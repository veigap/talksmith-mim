<svg viewBox="0 0 680 196" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Conectores y MCP: las «manos» del chat</title>
  <desc>El chat pide datos, el Connector los trae vía el protocolo MCP y el servicio externo responde.</desc>

  <defs>
    <marker id="ar-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6666"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="196" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#3B3535">

    <!-- caja A: chat / agente -->
    <rect x="16" y="42" width="126" height="112" rx="8" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="79" y="92" text-anchor="middle" font-size="15" font-weight="bold">Chat / agente</text>
    <text x="79" y="113" text-anchor="middle" font-size="11.5" fill="#6E6666">el que ya usás</text>

    <!-- caja B: connector (foco) -->
    <rect x="262" y="42" width="156" height="112" rx="8" fill="#FBEEEF" stroke="#DA1B2E" stroke-width="2"/>
    <text x="340" y="92" text-anchor="middle" font-size="15" font-weight="bold">Connector</text>
    <text x="340" y="113" text-anchor="middle" font-size="11.5" fill="#6E6666">un clic</text>

    <!-- caja C: servicio externo -->
    <rect x="524" y="42" width="140" height="112" rx="8" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="594" y="92" text-anchor="middle" font-size="15" font-weight="bold">Servicio externo</text>
    <text x="594" y="113" text-anchor="middle" font-size="11.5" fill="#6E6666">Gmail · Calendar</text>

    <!-- tramo 1: chat &lt;-&gt; connector -->
    <text x="202" y="74" text-anchor="middle" font-size="12" fill="#6E6666">pide datos</text>
    <line x1="142" y1="84" x2="260" y2="84" stroke="#6E6666" stroke-width="1.6" marker-end="url(#ar-grey)"/>
    <line x1="262" y1="124" x2="144" y2="124" stroke="#6E6666" stroke-width="1.6" marker-end="url(#ar-grey)"/>
    <text x="202" y="142" text-anchor="middle" font-size="12" fill="#6E6666">devuelve datos</text>

    <!-- tramo 2: connector &lt;-&gt; servicio (foco: MCP) -->
    <text x="471" y="58" text-anchor="middle" font-size="11" fill="#6E6666">protocolo</text>
    <text x="471" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">MCP</text>
    <line x1="418" y1="84" x2="522" y2="84" stroke="#DA1B2E" stroke-width="2.2" marker-end="url(#ar-red)"/>
    <line x1="524" y1="124" x2="420" y2="124" stroke="#6E6666" stroke-width="1.6" marker-end="url(#ar-grey)"/>
    <text x="471" y="142" text-anchor="middle" font-size="12" fill="#6E6666">responde</text>

    <!-- bajada -->
    <text x="340" y="181" text-anchor="middle" font-size="12.5" fill="#6E6666">La plataforma no gana IA: se vuelve conversacional.</text>

  </g>
</svg>
