<!-- talksmith-ascii-sha256: e8deb493f95e2e90b32f097cf549f8ba58f73409f051c220eb497cd02ab08ceb -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 434" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">
  <title>Schedule</title>
  <desc>Un Schedule se describe una vez, fija una cadencia y corre solo, usando los conectores ya configurados.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#3B3535"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="696" height="434" fill="#ffffff"/>

  <text x="348" y="39" text-anchor="middle" font-size="20" font-weight="bold">Tarea programada</text>

  <rect x="24" y="96" width="224" height="82" rx="6" fill="#F4F2F1" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="448" y="96" width="224" height="82" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.8"/>
  <rect x="448" y="328" width="224" height="82" rx="6" fill="#F4F2F1" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="24" y="328" width="224" height="82" rx="6" fill="#F4F2F1" stroke="#3B3535" stroke-width="1.2"/>

  <circle cx="136" cy="96" r="17" fill="#ffffff" stroke="#3B3535" stroke-width="1.4"/>
  <path d="M136 96 L136 86" stroke="#3B3535" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M136 96 L143 100" stroke="#3B3535" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <circle cx="136" cy="96" r="1.8" fill="#3B3535"/>

  <text x="136" y="130" text-anchor="middle" font-size="15" font-weight="bold">Cadencia fija</text>
  <text x="136" y="152" text-anchor="middle" fill="#6B6360">lunes 8:00</text>

  <text x="560" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">La tarea corre sola</text>
  <text x="560" y="152" text-anchor="middle" fill="#6B6360">sin que se lo pidas</text>

  <text x="560" y="362" text-anchor="middle" font-size="15" font-weight="bold">Conectores</text>
  <text x="560" y="384" text-anchor="middle" fill="#6B6360">mail · web · calendario</text>

  <text x="136" y="362" text-anchor="middle" font-size="15" font-weight="bold">Resumen listo</text>
  <text x="136" y="384" text-anchor="middle" fill="#6B6360">en tu chat</text>

  <path d="M248 137 H448" stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M560 178 V328" stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M448 369 H248" stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M136 328 V178" stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <text x="348" y="127" text-anchor="middle" font-size="13" fill="#6B6360">dispara la tarea</text>
  <text x="574" y="246" font-size="13" fill="#6B6360">usa los</text>
  <text x="574" y="263" font-size="13" fill="#6B6360">conectores</text>
  <text x="348" y="359" text-anchor="middle" font-size="13" fill="#6B6360">trae la info</text>
  <text x="150" y="246" font-size="13" fill="#6B6360">cada semana,</text>
  <text x="150" y="263" font-size="13" fill="#6B6360">sin pedirlo</text>

  <text x="348" y="246" text-anchor="middle" fill="#6B6360">se describe</text>
  <text x="348" y="270" text-anchor="middle" font-size="18" font-weight="bold">UNA vez</text>
</svg>
