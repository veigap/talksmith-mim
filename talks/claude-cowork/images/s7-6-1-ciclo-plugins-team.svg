<!-- talksmith-ascii-sha256: e25a869766dece2570d1cf8806c4802bb605260de6339e3511d1f4bcf60e05f7 -->
<svg viewBox="0 0 910 383" xmlns="http://www.w3.org/2000/svg">
  <title>Plugins en una cuenta Team</title>
  <desc>Ciclo de vida de un plugin en una cuenta Team o Enterprise: el Owner crea un marketplace privado de la organización, agrega plugins, fija la preferencia de instalación, el plugin se distribuye a chat y Cowork, y los miembros lo instalan con las actualizaciones sincronizadas.</desc>

  <defs>
    <marker id="ts-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10"
            refX="11" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10 Z" fill="#3B3535"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="910" height="383" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- ============ connectors ============ -->
    <g stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ts-arrow)">
      <path d="M274,89 L330,89"/>
      <path d="M580,89 L636,89"/>
      <path d="M761,154 L761,229"/>
      <path d="M636,294 L274,294"/>
    </g>

    <!-- ============ 1 · Owner crea el marketplace (focal) ============ -->
    <rect x="24" y="24" width="250" height="130" rx="8" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2"/>
    <rect x="38" y="37" width="18" height="18" rx="4.5" fill="#DA1B2E"/>
    <text x="47" y="50" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="38" y="75" font-size="12.5" font-weight="bold" fill="#1F1E1E">El Owner crea un</text>
    <text x="38" y="90" font-size="12.5" font-weight="bold" fill="#1F1E1E">marketplace privado</text>
    <text x="38" y="109" font-size="10.5" fill="#3B3535">Solo el Owner administra los</text>
    <text x="38" y="123" font-size="10.5" fill="#3B3535">plugins de la organización</text>
    <text x="38" y="137" font-size="10.5" fill="#6A737D">Organization settings &gt; Plugins</text>

    <!-- ============ 2 · Agrega plugins ============ -->
    <rect x="330" y="24" width="250" height="130" rx="8" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.4"/>
    <rect x="344" y="37" width="18" height="18" rx="4.5" fill="#F2EEEE"/>
    <text x="353" y="50" font-size="11" font-weight="bold" fill="#3B3535" text-anchor="middle">2</text>
    <text x="344" y="75" font-size="12.5" font-weight="bold" fill="#1F1E1E">Agrega plugins al</text>
    <text x="344" y="90" font-size="12.5" font-weight="bold" fill="#1F1E1E">marketplace</text>
    <text x="344" y="109" font-size="10.5" fill="#3B3535">· Subir un ZIP</text>
    <text x="344" y="123" font-size="10.5" fill="#3B3535">· Sincronizar un repo de GitHub</text>
    <text x="352" y="137" font-size="10.5" fill="#6A737D">(se auto-actualiza)</text>

    <!-- ============ 3 · Preferencia de instalacion ============ -->
    <rect x="636" y="24" width="250" height="130" rx="8" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.4"/>
    <rect x="650" y="37" width="18" height="18" rx="4.5" fill="#F2EEEE"/>
    <text x="659" y="50" font-size="11" font-weight="bold" fill="#3B3535" text-anchor="middle">3</text>
    <text x="650" y="75" font-size="12.5" font-weight="bold" fill="#1F1E1E">Fija la preferencia</text>
    <text x="650" y="90" font-size="12.5" font-weight="bold" fill="#1F1E1E">de instalación</text>
    <text x="650" y="109" font-size="10.5" fill="#3B3535">Por cada plugin:</text>
    <text x="650" y="123" font-size="10.5" fill="#3B3535">opcional / auto-install /</text>
    <text x="650" y="137" font-size="10.5" fill="#3B3535">provisionado</text>

    <!-- ============ 4 · Distribucion ============ -->
    <rect x="636" y="229" width="250" height="130" rx="8" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.4"/>
    <rect x="650" y="242" width="18" height="18" rx="4.5" fill="#F2EEEE"/>
    <text x="659" y="255" font-size="11" font-weight="bold" fill="#3B3535" text-anchor="middle">4</text>
    <text x="650" y="280" font-size="12.5" font-weight="bold" fill="#1F1E1E">Se distribuye a</text>
    <text x="650" y="295" font-size="12.5" font-weight="bold" fill="#1F1E1E">los miembros</text>
    <text x="650" y="314" font-size="10.5" fill="#3B3535">Aparece en los dos entornos:</text>
    <rect x="650" y="320" width="92" height="20" rx="10" fill="#F2EEEE"/>
    <text x="696" y="334" font-size="9" fill="#3B3535" text-anchor="middle">chat de Claude</text>
    <rect x="750" y="320" width="54" height="20" rx="10" fill="#F2EEEE"/>
    <text x="777" y="334" font-size="9" fill="#3B3535" text-anchor="middle">Cowork</text>

    <!-- ============ 5 · Miembros instalan ============ -->
    <rect x="24" y="229" width="250" height="130" rx="8" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.4"/>
    <rect x="38" y="242" width="18" height="18" rx="4.5" fill="#F2EEEE"/>
    <text x="47" y="255" font-size="11" font-weight="bold" fill="#3B3535" text-anchor="middle">5</text>
    <text x="38" y="280" font-size="12.5" font-weight="bold" fill="#1F1E1E">Los miembros instalan</text>
    <text x="38" y="295" font-size="12.5" font-weight="bold" fill="#1F1E1E">y habilitan</text>
    <text x="38" y="314" font-size="10.5" fill="#3B3535">desde el directorio de la org</text>
    <text x="38" y="328" font-size="10.5" fill="#3B3535">Las actualizaciones se</text>
    <text x="38" y="342" font-size="10.5" fill="#3B3535">sincronizan automáticamente</text>

  </g>
</svg>
