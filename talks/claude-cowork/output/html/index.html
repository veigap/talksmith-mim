<div class="wrap"><header><p class="eyebrow">Talksmith</p><h1 class="title">AI Generativa para Biomedicina</h1><p class="lede">Claude Cowork para el día a día · Paulo Veiga, Docente de Universidad Austral</p></header><div class="deck"><figure><div class="slide"><span class="snum">1/27 · divider</span><div class="stage cover"><div class="stmt"><p class="big">Agenda</p></div></div></div></figure><figure><div class="slide"><span class="snum">2/27 · divider</span><div class="stage cover"><div class="stmt"><p class="big">De chat a agente: dónde encaja Cowork</p></div></div></div></figure><figure><div class="slide"><span class="snum">3/27 · figures</span><div class="stage"><span class="pill">De chat a agente: dónde encaja Cowork</span><h2 class="stitle">Las tres superficies de Claude</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>Web/Chat</h4><p>— navegador o app, sin instalar; chat, preguntas y tareas puntuales; público: todos.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Claude Code</h4><p>— app de escritorio (pestaña Code + terminal); escribir, editar y publicar código; público: perfiles técnicos / developers.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Cowork</h4><p>— app de escritorio (pestaña Cowork), GUI sin terminal; trabajo de varios pasos sobre archivos reales; público: knowledge workers sin terminal. Esta charla vive acá.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Abrir ubicando el terreno: no son tres productos distintos, es el mismo agente con tres caras. Lo único que cambia es la superficie y para quién está pensada. Dejar claro desde el minuto cero que hoy trabajamos en Cowork — la cara pensada para quien no vive en una terminal. Claude Code aparece solo como contraste; no vamos a entrar en sus internals. Tiempo objetivo: ~5 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">4/27 · figures</span><div class="stage"><span class="pill">De chat a agente: dónde encaja Cowork</span><h2 class="stitle">El superpoder de Cowork: la herramienta de propósito general del knowledge worker</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>La idea grande.</h4><p>Cowork es la herramienta de propósito general del knowledge worker — de quien no* programa. No un asistente de una tarea puntual: una herramienta horizontal para casi cualquier trabajo de conocimiento. Sin base técnica: el "lenguaje de programación" es el español.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>La analogía que "pega" — "el nuevo Excel"</h4><p>(encuadre de analistas / industria, no un claim de Anthropic).* Así como Excel fue ~40 años la habilidad base del trabajo de oficina, las herramientas agénticas apuntan a ser la nueva habilidad base.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>El encuadre oficial de Anthropic:</h4><p>Cowork como "Claude Code para el resto de tu trabajo".</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Por qué te importa (bioingeniería).</h4><p>La habilidad base del trabajo del conocimiento se redefine ahora; llegar temprano es ventaja concreta y portable.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Este es el beat de "¿y a mí por qué me importa?", colocado justo después de ubicar las tres superficies. Hasta acá la audiencia sabe qué* es Cowork; esta slide responde por qué debería invertir su atención*. Tono motivacional y de alto nivel — la mecánica viene después. El gancho que mejor funciona es la analogía del Excel, pero hay que decirla con cuidado: durante unas cuatro décadas, saber Excel fue la* habilidad base del trabajo de oficina — no programabas, pero con Excel resolvías el 80% del trabajo de conocimiento. La tesis de varios analistas de la industria es que las herramientas agénticas (Claude Code para los que programan, Cowork para los que no) están en camino de ser esa nueva habilidad base. Atribuirlo explícitamente como encuadre de analistas/industria — "hay quien lo llama el nuevo Excel" — y NO como un claim oficial de Anthropic. Lo que sí es de Anthropic, y conviene citarlo como su framing propio, es "Claude Code para el resto de tu trabajo": la idea de que cualquier knowledge worker sienta con Cowork lo que los ingenieros ya sienten con Claude Code. Subrayar que Cowork no salió de la nada — es la generalización de algo que ya funcionó muy bien primero con developers. Cerrar aterrizándolo en la audiencia: ellos son ingenieros biomédicos, no necesariamente developers, y exactamente por eso esto les sirve — la habilidad base del trabajo del conocimiento se está redefiniendo ahora mismo, y llegar temprano es ventaja. Después de este beat motivacional pasamos a la mecánica: cómo se delega de verdad (slide 1.3). Tiempo objetivo: ~4-5 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">5/27 · single-point</span><div class="stage"><span class="pill">De chat a agente: dónde encaja Cowork</span><h2 class="stitle">De chat a agente: el cambio de paradigma</h2><p class="lead">La frase que resume toda la sesión: "Dejás de tipear un mensaje a la vez y empezás a entregar un resultado." El agente lo planifica, trabaja sobre tus archivos reales, y vos lo guiás — en lugar de hacer cada paso vos mismo.</p><div class="callout pink"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m627-287 45-45-159-160v-201h-60v225l174 181ZM480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155t86-127.5Q252-817 325-848.5T480-880q82 0 155 31.5t127.5 86Q817-708 848.5-635T880-480q0 82-31.5 155t-86 127.5Q708-143 635-111.5T480-80Zm0-400Zm0 340q140 0 240-100t100-240q0-140-100-240T480-820q-140 0-240 100T140-480q0 140 100 240t240 100Z"/></svg></span><p><b>Notes</b> Este es el concepto-ancla de la charla. Si se llevan una sola idea, que sea esta: el valor no está en escribir mejores mensajes, está en aprender a delegar un resultado y guiar el proceso. Usar la tabla para hacerlo concreto: la salida deja de ser texto en una ventana y pasa a ser archivos reales en tu disco. Anticipar la misión: vamos a "contratar" a Atlas, un analista de mercado virtual, y entrenarlo una vez para que después trabaje solo. Como cierre del concepto, citar el framing de la propia Anthropic — "menos una sesión de chat, más asignarle tareas a un colega" — para reforzar que esto no es marketing nuestro sino la forma en que el producto está pensado. Tiempo objetivo: ~5 min.</p></div></div></div></figure><figure><div class="slide"><span class="snum">6/27 · divider</span><div class="stage cover"><div class="stmt"><p class="big">Lo básico: interfaz, Instrucciones y Projects</p></div></div></div></figure><figure><div class="slide"><span class="snum">7/27 · code-example</span><div class="stage"><span class="pill">Lo básico: interfaz, Instrucciones y Projects</span><h2 class="stitle">(Demo time) Conozcamos la interfaz de Cowork</h2><div class="split"><div class="explain"></div><div class="codebox">   __________________________________________<br>  /                                          /|<br> /            &gt;   D E M O   T I M E          / |<br>/__________________________________________/  |<br>|                                          |   |<br>|     [ Pasamos a la app real de Cowork ]  |  /<br>|__________________________________________| /<br>|__________________________________________|/</div></div></div></div></figure><figure><div class="slide"><span class="snum">8/27 · figures</span><div class="stage"><span class="pill">Lo básico: interfaz, Instrucciones y Projects</span><h2 class="stitle">Los bloques de Cowork: cada problema, una pieza</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>La idea.</h4><p>Cowork no se aprende como una lista de features sueltas, sino como bloques que se apilan: cada bloque resuelve un problema concreto y recurrente, y al sumarse vuelven al agente cada vez más rico y autónomo. Importante: estos bloques no son una escalera estricta — usás solo los que tu tarea necesita; se combinan, no se exigen unos a otros.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Este es el mapa de toda la charla.</h4><p>Vamos a recorrer cada bloque, uno por uno, en el resto de la sesión — en este orden. Volvé a esta slide como "estamos acá" cuando quieras ubicarte.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Cada bloque = un problema que ya tuviste:</h4><p></p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Un prompt / chatear</h4><p>→ hago todo a mano, un mensaje a la vez.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Instrucciones</h4><p>→ no quiero repetir el contexto en cada prompt.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Projects</h4><p>→ quiero guardar y organizar todo en un lugar fijo.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Skills</h4><p>→ no quiero repetir la misma tarea.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Connectors / MCP</h4><p>→ quiero traer datos de mis herramientas.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Schedule</h4><p>→ quiero que corra solo.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Live Artifacts</h4><p>→ quiero compartir el resultado vivo* — un colaborador que entrega solo.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Plugins, transversal.</h4><p>Hay una pieza que no es un bloque más en la pila: los Plugins son la capa transversal de distribución — empaquetan y reparten Skills, agentes y connectors a todos a la vez. La vemos al final de la charla (Sección 6).</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Esta slide es el mapa de toda la sesión: antes de entrar en cada pieza, dar la foto completa. El gancho es el problema, no la feature — empezar desde abajo: "hoy hacés todo a mano, un mensaje a la vez". Cada bloque nace de una frustración concreta y la resuelve: no me quiero repetir el contexto → Instrucciones; no quiero perder los archivos → Projects; no quiero repetir la misma tarea → Skills; quiero datos de mis herramientas → Connectors/MCP; quiero que corra solo → Schedule; quiero compartir el resultado vivo → Live Artifacts. Subrayar la dirección: cuanto más arriba, menos trabajo manual y más entrega autónoma. Cuidado con la metáfora: NO es una pirámide donde cada capa depende de todas las de abajo. Son bloques que se apilan y se combinan — usás solo los que tu tarea necesita. Por eso cambiamos el dibujo de pirámide a bloques apilados. Decir explícitamente la promesa de roadmap: "vamos a recorrer cada uno de estos bloques, uno por uno, en el resto de la charla, en este orden" — y que pueden volver a esta slide como "estamos acá" entre secciones para ubicarse. Al final, la pila entera es Atlas. Plugins como transversal: marcar que Plugins NO es un bloque más en la pila, sino la banda que la envuelve — la forma de empaquetar y distribuir varias de estas piezas a la vez (a un equipo, p. ej.). No desarrollarlo acá: lo vemos en la Sección 6. Tiempo objetivo: ~3-4 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">9/27 · figures</span><div class="stage"><span class="pill">Lo básico: interfaz, Instrucciones y Projects</span><h2 class="stitle">Instrucciones: ajustar el comportamiento sin repetirte</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>Concepto.</h4><p>Las Instrucciones son el "contrato de trabajo" del agente: reglas en lenguaje natural que valen para todo lo que hagas, sin tener que repetirlas en cada prompt.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Ejemplo (Atlas) — qué podría decir un Instructions.</h4><p>Quién es Atlas, qué empresas sigue, su audiencia, su tono y su regla de oro: Una sola vez escribís esto; vale para todos los prompts del Project.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Cosas importantes a tener en cuenta.</h4><p>- Mantenelas cortas y claras; son lenguaje natural, no código. - Sirven para evitar repetir lo mismo en cada prompt: lo que decís una vez vale para todo el Project. - Es el lugar para fijar reglas no negociables (como el disclaimer legal).</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Conectar con el paradigma: en lugar de re-explicarle a Claude el contexto cada vez, lo escribís una vez en las Instrucciones y queda fijo. Mostrar el texto real de las Instrucciones de Atlas como ejemplo concreto — destacar la regla de oro del disclaimer financiero, que es exactamente el tipo de regla no negociable que conviene pinear acá. Dónde viven: en el panel de contexto del Project (en la GUI) — no es un archivo que edités a mano; lo escribís en el panel y queda asociado al Project. Tiempo objetivo: ~7 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">10/27 · concept-breakdown</span><div class="stage"><span class="pill">Lo básico: interfaz, Instrucciones y Projects</span><h2 class="stitle">Projects: guardar todo en un lugar fijo</h2><div class="cards c3"><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-120q-151 0-255.5-46.5T120-280v-400q0-66 105.5-113T480-840q149 0 254.5 47T840-680v400q0 67-104.5 113.5T480-120Zm0-488q86 0 176.5-26.5T773-694q-27-32-117.5-59T480-780q-88 0-177 26t-117 60q28 35 116 60.5T480-608Zm-1 214q42 0 84-4.5t80.5-13.5q38.5-9 73.5-22t63-29v-155q-29 16-64 29t-74 22q-39 9-80 14t-83 5q-42 0-84-5t-80.5-14q-38.5-9-73-22T180-618v155q27 16 61 29t72.5 22q38.5 9 80.5 13.5t85 4.5Zm1 214q48 0 99-8.5t93.5-22.5q42.5-14 72-31t35.5-35v-125q-28 16-63 28.5T643.5-352q-38.5 9-80 13.5T479-334q-43 0-85-4.5T313.5-352q-38.5-9-72.5-21.5T180-402v126q5 17 34 34.5t72 31q43 13.5 94 22t100 8.5Z"/></svg></span><h3>Concepto.</h3><p>Un Project es un espacio de trabajo autocontenido: le da al agente una carpeta propia, memoria dentro del proyecto y un lugar fijo para sus tareas. Tiene tres capas persistentes: Instrucciones, base de conocimiento (Knowledge base) y Chats.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M560-574v-48q33-14 67.5-21t72.5-7q26 0 51 4t49 10v44q-24-9-48.5-13.5T700-610q-38 0-73 9.5T560-574Zm0 220v-49q33-13.5 67.5-20.25T700-430q26 0 51 4t49 10v44q-24-9-48.5-13.5T700-390q-38 0-73 9t-67 27Zm0-110v-48q33-14 67.5-21t72.5-7q26 0 51 4t49 10v44q-24-9-48.5-13.5T700-500q-38 0-73 9.5T560-464ZM248-300q53.57 0 104.28 12.5Q403-275 452-250v-427q-45-30-97.62-46.5Q301.76-740 248-740q-38 0-74.5 9.5T100-707v434q31-14 70.5-20.5T248-300Zm264 50q50-25 98-37.5T712-300q38 0 78.5 6t69.5 16v-429q-34-17-71.82-25-37.82-8-76.18-8-54 0-104.5 16.5T512-677v427Zm-30 90q-51-38-111-58.5T248-239q-36.54 0-71.77 9T106-208q-23.1 11-44.55-3Q40-225 40-251v-463q0-15 7-27.5T68-761q42-20 87.39-29.5 45.4-9.5 92.61-9.5 63 0 122.5 17T482-731q51-35 109.5-52T712-800q46.87 0 91.93 9.5Q849-781 891-761q14 7 21.5 19.5T920-714v463q0 27.89-22.5 42.45Q875-194 853-208q-34-14-69.23-22.5Q748.54-239 712-239q-63 0-121 21t-109 58ZM276-489Z"/></svg></span><h3>Ventajas.</h3><p>Todo queda organizado y reutilizable: las Instrucciones valen para todo el Project, la memoria recuerda tus correcciones y preferencias, y los archivos viven en una carpeta concreta de tu disco.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M220-80q-24.75 0-42.37-17.63Q160-115.25 160-140v-434q0-24.75 17.63-42.38Q195.25-634 220-634h70v-96q0-78.85 55.61-134.42Q401.21-920 480.11-920q78.89 0 134.39 55.58Q670-808.85 670-730v96h70q24.75 0 42.38 17.62Q800-598.75 800-574v434q0 24.75-17.62 42.37Q764.75-80 740-80H220Zm0-60h520v-434H220v434Zm314.5-162.03Q557-324.06 557-355q0-30-22.67-54.5t-54.5-24.5q-31.83 0-54.33 24.5t-22.5 55q0 30.5 22.67 52.5t54.5 22q31.83 0 54.33-22.03ZM350-634h260v-96q0-54.17-37.88-92.08-37.88-37.92-92-37.92T388-822.08q-38 37.91-38 92.08v96ZM220-140v-434 434Z"/></svg></span><h3>Cosas importantes a tener en cuenta.</h3><p>- Los chats dentro de un mismo Project no comparten contexto entre sí — solo se comparte la base de conocimiento. - En Cowork, qué carpetas se conceden lo controla el selector de carpetas del sistema operativo, no un archivo de configuración. - Buena práctica: una carpeta de trabajo dedicada, para saber siempre qué está en alcance (y nunca conceder una carpeta con datos confidenciales o credenciales).</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-81q-140-35-230-162.5T160-523v-238l320-120 320 120v238q0 152-90 279.5T480-81Zm0-62q115-38 187.5-143.5T740-523v-196l-260-98-260 98v196q0 131 72.5 236.5T480-143Zm0-337Z"/></svg></span><h3>Notes</h3><p>El Project es el contenedor de todo lo demás: Instrucciones, archivos, memoria. En la misión, el Project "Inteligencia de Mercado Semanal" apunta a la carpeta Documentos/Atlas-Mercado. Subrayar dos puntos prácticos: (1) los chats no se hablan entre sí dentro del Project — si querés que recuerde algo, va a las Instrucciones o a la base de conocimiento; (2) el control de qué carpetas toca Claude es el folder picker del sistema operativo, que es a la vez la garantía de seguridad (Cowork solo ve lo que le concedés) y el límite. La slide siguiente muestra ese selector y el panel de contexto en pantalla. Tiempo objetivo: ~7 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">11/27 · figures</span><div class="stage"><span class="pill">Lo básico: interfaz, Instrucciones y Projects</span><h2 class="stitle">El selector de carpetas y el panel de contexto</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>Conceder una carpeta de trabajo.</h4><p>Cowork no toca tu disco por sí solo: vos le concedés una carpeta con el selector de carpetas del sistema operativo (el mismo folder picker que usás para abrir cualquier archivo). Lo que quede fuera de esa carpeta, Cowork no lo ve.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>El panel de contexto del Project.</h4><p>Es donde viven las Instrucciones, la base de conocimiento y la carpeta concedida — la "foto" de todo lo que el agente tiene a mano para ese Project.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Nota de seguridad.</h4><p>El selector es a la vez tu garantía y tu límite: Cowork solo trabaja sobre lo que le concedés. Nunca concedas una carpeta con datos sensibles, credenciales o información bajo NDA. Buena práctica: una carpeta dedicada por Project, para saber siempre qué está en alcance.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Slide de apoyo visual, corta y concreta — bajar a pantalla lo que en la slide anterior fue conceptual. Mostrar las dos capturas: (1) el folder picker del sistema cuando concedés una carpeta; (2) el panel de contexto del Project con sus capas. El mensaje de seguridad es el que no hay que saltear: Cowork solo ve lo que le concedés, así que la elección de carpeta ES el control de privacidad — nunca una carpeta con datos sensibles. Aterrizarlo en la misión: Atlas trabaja sobre Documentos/Atlas-Mercado, nada más. Tiempo objetivo: ~3 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">12/27 · divider</span><div class="stage cover"><div class="stmt"><p class="big">Extender Cowork: Skills y el rol de los archivos MD / metadata</p></div></div></div></figure><figure><div class="slide"><span class="snum">13/27 · concept-breakdown</span><div class="stage"><span class="pill">Extender Cowork: Skills y el rol de los archivos MD / metadata</span><h2 class="stitle">Skills: enseñarle a Claude algo una sola vez</h2><div class="cards c3"><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m627-287 45-45-159-160v-201h-60v225l174 181ZM480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155t86-127.5Q252-817 325-848.5T480-880q82 0 155 31.5t127.5 86Q817-708 848.5-635T880-480q0 82-31.5 155t-86 127.5Q708-143 635-111.5T480-80Zm0-400Zm0 340q140 0 240-100t100-240q0-140-100-240T480-820q-140 0-240 100T140-480q0 140 100 240t240 100Z"/></svg></span><h3>Concepto.</h3><p>Una Skill es una instrucción reutilizable (+ scripts opcionales) que el agente carga cuando tu pedido coincide con su descripción. Un trabajo por Skill: "si escribís 'y además', dividila en dos". La frase clave: "Todo lo que le explicás a Claude dos veces es una Skill que deberías escribir una vez."</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M140-160q-23 0-41.5-18.5T80-220v-520q0-23 18.5-41.5T140-800h281l60 60h339q23 0 41.5 18.5T880-680H455l-60-60H140v520l102-400h698L833-206q-6 24-22 35t-41 11H140Zm63-60h572l84-340H287l-84 340Zm0 0 84-340-84 340Zm-63-460v-60 60Z"/></svg></span><h3>Cómo se crea una Skill en Cowork.</h3><p>Dos caminos reales (Cowork es GUI: no hay slash commands): 1. Pedísela en lenguaje natural — "armame una Skill que haga X". Claude escribe el archivo SKILL.md, pero Cowork NO la registra/habilita solo. Tenés que habilitarla en Customize → Skills (el botón Save skill / Save to enable). Recién ahí queda activa. 2. Subís un ZIP — empaquetás la carpeta de la Skill como .zip y la cargás en Customize → Skills → "+" → Create skill → Upload a skill, y la activás con el toggle.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M320-242 80-482l242-242 43 43-199 199 197 197-43 43Zm318 2-43-43 199-199-197-197 43-43 240 240-242 242Z"/></svg></span><h3>Requisito.</h3><p>Las Skills necesitan Code execution habilitado (Settings → Capabilities).</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M503.5-289.48q9.5-9.48 9.5-23.5t-9.48-23.52q-9.48-9.5-23.5-9.5t-23.52 9.48q-9.5 9.48-9.5 23.5t9.48 23.52q9.48 9.5 23.5 9.5t23.52-9.48ZM453-433h60v-253h-60v253Zm27.27 353q-82.74 0-155.5-31.5Q252-143 197.5-197.5t-86-127.34Q80-397.68 80-480.5t31.5-155.66Q143-709 197.5-763t127.34-85.5Q397.68-880 480.5-880t155.66 31.5Q709-817 763-763t85.5 127Q880-563 880-480.27q0 82.74-31.5 155.5Q817-252 763-197.68q-54 54.31-127 86Q563-80 480.27-80Zm.23-60Q622-140 721-239.5t99-241Q820-622 721.19-721T480-820q-141 0-240.5 98.81T140-480q0 141 99.5 240.5t241 99.5Zm-.5-340Z"/></svg></span><h3>OJO — la trampa del Save (camino 1).</h3><p>Es el error más común: pedís la Skill, Claude escribe el archivo… pero si no le das Save / enable en Customize, no queda habilitada y parece que "no funciona".</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M140-160q-23 0-41.5-18.5T80-220v-520q0-23 18.5-41.5T140-800h281l60 60h339q23 0 41.5 18.5T880-680H455l-60-60H140v520l102-400h698L833-206q-6 24-22 35t-41 11H140Zm63-60h572l84-340H287l-84 340Zm0 0 84-340-84 340Zm-63-460v-60 60Z"/></svg></span><h3>Ejemplo (Atlas).</h3><p>La Skill reporte-semanal: lee TODOS los archivos crudos de una carpeta fuentes/ (uno por portal), consolida por empresa y genera un reporte con formato fijo. La empresa más relevante va primera (⭐). Guarda con sufijo -new para no pisar el ejemplo.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m627-287 45-45-159-160v-201h-60v225l174 181ZM480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155t86-127.5Q252-817 325-848.5T480-880q82 0 155 31.5t127.5 86Q817-708 848.5-635T880-480q0 82-31.5 155t-86 127.5Q708-143 635-111.5T480-80Zm0-400Zm0 340q140 0 240-100t100-240q0-140-100-240T480-820q-140 0-240 100T140-480q0 140 100 240t240 100Z"/></svg></span><h3>Notes</h3><p>La Skill es la materialización directa del paradigma "enseñá una vez, reutilizá siempre". Mostrar los dos caminos reales en Cowork: (1) pedírsela en lenguaje natural — Claude escribe el SKILL.md, y vos la habilitás en Customize → Skills; (2) subir un ZIP de la carpeta de la Skill por Customize → Skills. Aclarar de entrada que Cowork es GUI: no hay slash commands. El punto que NO hay que saltear es la trampa del Save: es un error real y muy común — pedís la Skill, Claude escribe el archivo, pero si no le das Save / enable no queda habilitada y parece que "no funciona". Mencionar que las Skills requieren Code execution (Settings → Capabilities). Usar reporte-semanal como ejemplo concreto: convierte varios archivos desordenados en un reporte prolijo. Tiempo objetivo: ~8 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">14/27 · concept-breakdown</span><div class="stage"><span class="pill">Extender Cowork: Skills y el rol de los archivos MD / metadata</span><h2 class="stitle">(Sideway) Archivos MD y metadata: el lenguaje común del mundo LLM</h2><div class="cards c3"><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M38-160v-94q0-35 18-63.5t50-42.5q73-32 131.5-46T358-420q62 0 120 14t131 46q32 14 50.5 42.5T678-254v94H38Zm700 0v-94q0-63-32-103.5T622-423q69 8 130 23.5t99 35.5q33 19 52 47t19 63v94H738ZM250-523q-42-42-42-108t42-108q42-42 108-42t108 42q42 42 42 108t-42 108q-42 42-108 42t-108-42Zm426 0q-42 42-108 42-11 0-24.5-1.5T519-488q24-25 36.5-61.5T568-631q0-45-12.5-79.5T519-774q11-3 24.5-5t24.5-2q66 0 108 42t42 108q0 66-42 108ZM98-220h520v-34q0-16-9.5-31T585-306q-72-32-121-43t-106-11q-57 0-106.5 11T130-306q-14 6-23 21t-9 31v34Zm324.5-346.5Q448-592 448-631t-25.5-64.5Q397-721 358-721t-64.5 25.5Q268-670 268-631t25.5 64.5Q319-541 358-541t64.5-25.5ZM358-220Zm0-411Z"/></svg></span><h3>Concepto.</h3><p>Casi todo lo que configurás alrededor de un agente — Instrucciones, Skills (SKILL.md), archivos de agentes, docs de plugins, salidas — es texto plano en Markdown (.md). Markdown es la lingua franca* del mundo LLM.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M220-80q-24.75 0-42.37-17.63Q160-115.25 160-140v-434q0-24.75 17.63-42.38Q195.25-634 220-634h70v-96q0-78.85 55.61-134.42Q401.21-920 480.11-920q78.89 0 134.39 55.58Q670-808.85 670-730v96h70q24.75 0 42.38 17.62Q800-598.75 800-574v434q0 24.75-17.62 42.37Q764.75-80 740-80H220Zm0-60h520v-434H220v434Zm314.5-162.03Q557-324.06 557-355q0-30-22.67-54.5t-54.5-24.5q-31.83 0-54.33 24.5t-22.5 55q0 30.5 22.67 52.5t54.5 22q31.83 0 54.33-22.03ZM350-634h260v-96q0-54.17-37.88-92.08-37.88-37.92-92-37.92T388-822.08q-38 37.91-38 92.08v96ZM220-140v-434 434Z"/></svg></span><h3>Qué es la metadata / los headers.</h3><p>Muchos de esos archivos arrancan con un bloque de metadata (un "header" en YAML): por ejemplo, un SKILL.md declara name y description. Esa descripción es lo que dispara la Skill — de forma semántica, no por palabra clave.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-120q-151 0-255.5-46.5T120-280v-400q0-66 105.5-113T480-840q149 0 254.5 47T840-680v400q0 67-104.5 113.5T480-120Zm0-488q86 0 176.5-26.5T773-694q-27-32-117.5-59T480-780q-88 0-177 26t-117 60q28 35 116 60.5T480-608Zm-1 214q42 0 84-4.5t80.5-13.5q38.5-9 73.5-22t63-29v-155q-29 16-64 29t-74 22q-39 9-80 14t-83 5q-42 0-84-5t-80.5-14q-38.5-9-73-22T180-618v155q27 16 61 29t72.5 22q38.5 9 80.5 13.5t85 4.5Zm1 214q48 0 99-8.5t93.5-22.5q42.5-14 72-31t35.5-35v-125q-28 16-63 28.5T643.5-352q-38.5 9-80 13.5T479-334q-43 0-85-4.5T313.5-352q-38.5-9-72.5-21.5T180-402v126q5 17 34 34.5t72 31q43 13.5 94 22t100 8.5Z"/></svg></span><h3>Por qué esto es importante en el mundo LLM.</h3><p>- El modelo lee texto: si la configuración es texto plano legible, el agente la entiende directamente, sin formato propietario. - La metadata le dice al sistema qué es* cada archivo y cuándo* usarlo (la description de una Skill decide cuándo se activa). - Es portable y versionable: el mismo estándar SKILL.md funciona entre herramientas (Cowork y Codex usan el mismo formato). - Nota de alcance:* esto es un sideway de alto nivel — qué es y por qué importa. No entramos en el detalle del formato de archivos.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-120q-151 0-255.5-46.5T120-280v-400q0-66 105.5-113T480-840q149 0 254.5 47T840-680v400q0 67-104.5 113.5T480-120Zm0-488q86 0 176.5-26.5T773-694q-27-32-117.5-59T480-780q-88 0-177 26t-117 60q28 35 116 60.5T480-608Zm-1 214q42 0 84-4.5t80.5-13.5q38.5-9 73.5-22t63-29v-155q-29 16-64 29t-74 22q-39 9-80 14t-83 5q-42 0-84-5t-80.5-14q-38.5-9-73-22T180-618v155q27 16 61 29t72.5 22q38.5 9 80.5 13.5t85 4.5Zm1 214q48 0 99-8.5t93.5-22.5q42.5-14 72-31t35.5-35v-125q-28 16-63 28.5T643.5-352q-38.5 9-80 13.5T479-334q-43 0-85-4.5T313.5-352q-38.5-9-72.5-21.5T180-402v126q5 17 34 34.5t72 31q43 13.5 94 22t100 8.5Z"/></svg></span><h3>Notes</h3><p>Sideway breve y de alto nivel — explícitamente NO un deep dive de formato de archivos. La idea a transmitir: en el mundo LLM, la configuración es texto plano (Markdown) porque el modelo lee texto, y la metadata (el header YAML) le dice al sistema qué es cada archivo y cuándo usarlo. El ejemplo más tangible es la description de una Skill: no es decoración, es lo que decide si la Skill se activa o no para un pedido dado. Cerrar con la portabilidad: el mismo SKILL.md sirve en distintas herramientas. Mantenerlo en ~5 min — es contexto, no el plato principal.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">15/27 · figures</span><div class="stage"><span class="pill">Extender Cowork: Skills y el rol de los archivos MD / metadata</span><h2 class="stitle">Anatomía de un SKILL.md</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>La metadata (el header).</h4><p>name identifica la Skill; description es lo que decide cuándo se activa — de forma semántica, no por palabra clave exacta. Una buena description = la Skill se dispara cuando corresponde.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>El cuerpo.</h4><p>Markdown común: los pasos que el agente sigue cuando la Skill se activa. - Nota de alcance:* reforzamos el sideway anterior (MD + metadata) con un ejemplo tangible — no entramos en el detalle fino del formato.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Slide-ejemplo que aterriza el sideway de MD/metadata. Mostrar el SKILL.md partido en dos zonas: arriba el header YAML (name, description) entre ---; abajo las instrucciones en Markdown. El punto a martillar: la description no es decoración — es exactamente lo que el sistema lee para decidir si esta Skill aplica a tu pedido (activación semántica). Usar reporte-semanal para que sea concreto. Mantenerlo alto nivel: es para que "vean cómo se ve", no un tutorial de formato. Tiempo objetivo: ~3-4 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">16/27 · divider</span><div class="stage cover"><div class="stmt"><p class="big">Conectar y automatizar: Connectors/MCP y Schedule</p></div></div></div></figure><figure><div class="slide"><span class="snum">17/27 · figures</span><div class="stage"><span class="pill">Conectar y automatizar: Connectors/MCP y Schedule</span><h2 class="stitle">Connectors y MCP: las "manos" del agente</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>Qué son los Connectors.</h4><p>Son lo que le permite al agente tocar sistemas externos que de otro modo no podría: Drive, Gmail, Slack, bases de datos, APIs. "Las manos: lo que el agente puede tocar que de otro modo no podría."</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Qué es MCP (Model Context Protocol).</h4><p>El estándar detrás de los Connectors: una forma estandarizada de conectar Claude con sistemas externos. Cualquier app que exponga un servidor MCP se vuelve algo con lo que podés "hablar" (Figma, Vercel, Cal.com, Home Assistant…). El patrón: la plataforma abre sus internals como herramientas MCP; el agente no gana una capacidad nueva, la plataforma se vuelve conversacional. - En la próxima slide vemos cómo se registra un Connector en la práctica (directorio + un clic).</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Desarmar el miedo: conectar un servicio externo no es programar. En Cowork es literalmente buscar el servicio en el directorio y darle Connect — como conectás Gmail. Usar el diagrama para explicar qué pasa por debajo: el agente pide datos, el Connector los trae vía el protocolo MCP. MCP es el estándar que hace que cualquier plataforma con API pueda volverse conversacional. Ejemplo de la misión: MT Newswires (noticias de mercado) y Gmail, ambos de un clic. Aclarar que en Cowork no hay archivo de config: todo por la UI. Tiempo objetivo: ~10 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">18/27 · figures</span><div class="stage"><span class="pill">Conectar y automatizar: Connectors/MCP y Schedule</span><h2 class="stitle">Cómo se registra un Connector</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>No estás programando: te conectás.</h4><p>Registrar un Connector es como conectar Gmail a una app nueva — buscás el servicio en un directorio y le das Connect. Configurado por la UI; no hay archivo local que editar.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>El directorio de Connectors.</h4><p>Cowork trae un directorio con servicios listos para conectar de un clic:</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Conexión de un clic.</h4><p>Buscás el servicio, le das Connect y autorizás — y queda disponible para el agente:</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Ejemplo (Atlas).</h4><p>MT Newswires ya tiene un connector listo: lo buscás y le das Connect, como cualquier app. Gmail, igual: un clic en el directorio. Con eso, Atlas pasa a leer noticias de mercado y a dejar borradores de correo — sin que vos programes nada.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Slide práctica: mostrar las dos capturas — el directorio de Connectors y la pantalla de conexión — para desarmar el miedo de "esto es técnico". El mensaje es: conectar un servicio es buscar + Connect + autorizar, igual que cuando conectás Gmail a cualquier app. Ejemplos de la misión: MT Newswires (noticias) y Gmail (borradores), ambos de un clic. Recordar que en Cowork todo esto es por la UI, no por archivos de config. Tiempo objetivo: ~5 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">19/27 · figures</span><div class="stage"><span class="pill">Conectar y automatizar: Connectors/MCP y Schedule</span><h2 class="stitle">Schedule: que Cowork trabaje solo</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>Para qué sirve.</h4><p>Todo lo anterior es reactivo (vos pedís, Claude hace). Schedule hace a Cowork proactivo: describís una tarea una vez, elegís una cadencia, y Claude la corre solo.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Cómo funciona.</h4><p>- Describís la tarea una vez; Claude guarda el prompt como las instrucciones de la tarea. - Elegís cadencia: por hora · diaria · semanal · días de semana · o a demanda ("Run now"). - Cada corrida abre su propia sesión fresca de Cowork y avisa al terminar. - Tiene los mismos poderes que una tarea normal: connectors, skills, plugins instalados. - Vive en la pestaña Scheduled de la barra lateral.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>⚠️ LA trampa — corre LOCAL, no en la nube.</h4><p>Las tareas programadas de Cowork corren en tu computadora, no en servidores de Anthropic. Solo se disparan con la máquina encendida y la app de Claude Desktop abierta. Si estaba dormida/cerrada a la hora prevista, la corrida se saltea — y se ejecuta automáticamente apenas la máquina despierta o reabrís la app (con aviso de "esto se saltó"). No esperes que tu laptop apagada genere el reporte del lunes. - (Aparte, fuera de alcance:)* existen agentes programados alojados en la nube, pero son una funcionalidad separada — no es lo que hace el Schedule de Cowork.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Ejemplo (Atlas).</h4><p>Cada lunes 8:00: buscar-accion → reporte-semanal → dejar el reporte como borrador en Gmail, listo antes de la reunión de las 9:00. Tip de demo: no esperar al lunes, usar "Run on demand".</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Acá Cowork pasa de herramienta a empleado: describís el trabajo una vez y corre solo. Es el momento en que Atlas "trabaja mientras vos dormís" — pero con un asterisco. El punto crítico — y un error clásico — es que el Schedule de Cowork corre LOCAL, en tu máquina, no en la nube de Anthropic: solo se dispara con la computadora despierta y la app abierta; si estaba dormida/cerrada, se saltea y corre apenas volvés (con aviso). Dejarlo bien claro para que nadie espere que su laptop apagada genere el reporte del lunes. (Si alguien pregunta por corridas en la nube: sí existen agentes programados hosteados, pero son otra cosa, fuera del alcance de esta charla.) Para la demo, usar "Run on demand" en lugar de esperar la cadencia real. Tiempo objetivo: ~10 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">20/27 · divider</span><div class="stage cover"><div class="stmt"><p class="big">Compartir resultados: Live Artifacts</p></div></div></div></figure><figure><div class="slide"><span class="snum">21/27 · figures</span><div class="stage"><span class="pill">Compartir resultados: Live Artifacts</span><h2 class="stitle">Artifacts y Live Artifacts: del resultado a algo compartible</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>Qué es un Artifact.</h4><p>Una salida viva y ejecutable que se renderiza en un panel lateral: componentes React, páginas HTML, gráficos SVG, diagramas, tablas, documentos descargables.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Distinción live vs no-live (breve).</h4><p></p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Artifact estándar</h4><p>(todos los planes): salida de un solo archivo, estática — lo que generás es lo que queda.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Live Artifact</h4><p>(Cowork, planes pagos): una página HTML interactiva y persistente que vive en la pestaña "Live artifacts" de Cowork. Se actualiza con datos actuales de tus apps conectadas cada vez que la abrís, y guarda historial de versiones.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Cómo se crea.</h4><p>Dos formas: (1) desde una tarea de Cowork (le pedís que el resultado sea un Live Artifact), o (2) desde la pestaña Live artifacts → New artifact → Chat with Claude.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Estado actual del compartir — leer con cuidado.</h4><p>Los Live Artifacts todavía NO son compartibles: en el lanzamiento son para tu propio uso; compartir está en el roadmap. Además son locales, no en la nube: viven en tu computadora y no te siguen entre dispositivos. Y usan tus connectors sin volver a pedirte permiso — solo los que aprobaste al crear/actualizar el artifact.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Ejemplo (Atlas).</h4><p>El tablero pulso-semanal-FECHA: un Live Artifact nuevo por semana (queda un historial de versiones), con tarjetas por empresa, tabla resumen y un chip "LIVE", refrescado con los datos de la semana. Diseño basado en el boceto del jefe:</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Cerramos el círculo de la misión: el jefe quería el reporte de dos formas — el email (que ya resolvimos con Gmail + Schedule) y una página siempre actualizada. El Live Artifact es esa página. Explicar la distinción clave: un Artifact estándar es estático; un Live Artifact persiste en la pestaña Live artifacts, se refresca con datos actuales al abrirlo y guarda versiones. Ser honesto con el estado actual del compartir, porque acá había una confusión que corregimos: hoy los Live Artifacts NO son compartibles (es del roadmap, no de hoy), son locales —no en la nube, no te siguen entre dispositivos— y usan los connectors que aprobaste sin volver a preguntar. (Nota: versiones previas de este material mencionaban un "ShareDuo" con URL pública — eso NO es una capacidad de Cowork; quitado.) Mostrar el boceto del tablero — el "napkin sketch" del jefe — como el spec de diseño que el artifact reproduce. Tiempo objetivo: ~10 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">22/27 · divider</span><div class="stage cover"><div class="stmt"><p class="big">Advanced: Subagentes y Plugins</p></div></div></div></figure><figure><div class="slide"><span class="snum">23/27 · figures</span><div class="stage"><span class="pill">Advanced: Subagentes y Plugins</span><h2 class="stitle">Subagentes: delegar sub-tareas en paralelo</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>Concepto.</h4><p>Un Subagente es un asistente aislado, con su propio contexto, instrucciones y acceso a herramientas, al que el agente principal le delega un trabajo y del que recibe un resumen (no la transcripción completa).</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Skill vs Subagente (la regla de una línea).</h4><p>Chico, y debe quedar frente a vos → Skill (corre dentro* de tu conversación). Grande o ruidoso, y debe correr en un proceso aparte → Subagente (corre al lado*, en su propio contexto).</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>En Cowork.</h4><p>Los Subagentes se coordinan "por debajo" (under the hood): el agente principal los lanza cuando le conviene, y pueden correr varios en paralelo.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Cómo se agrega un subagente.</h4><p>Se define igual que una Skill — una descripción de cuándo usarlo + sus instrucciones. Dos caminos: pedile a Claude que lo arme (escribe el archivo del agente, como con las Skills, y lo gestionás en el directorio Customize), o viene empaquetado dentro de un Plugin. No hace falta tocar archivos a mano.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Nivel avanzado — presentarlo como "para cuando crezcas". La distinción mental útil: si la sub-tarea es chica y querés verla, es una Skill; si es grande o ruidosa y querés que corra aparte sin ensuciar tu conversación, es un Subagente. El ejemplo del deck (8 propuestas de proveedores revisadas en paralelo por tres especialistas → tabla combinada) ilustra el fan-out. Cómo se agrega: explicarlo en paralelo a las Skills — un subagente se define con una descripción (cuándo usarlo) + instrucciones; le pedís a Claude que lo arme (igual que una Skill, se gestiona en Customize) o viene dentro de un Plugin. Mantenerlo alto nivel: no entrar en rutas de archivos ni internals de persistencia. Tiempo objetivo: ~7 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">24/27 · concept-breakdown</span><div class="stage"><span class="pill">Advanced: Subagentes y Plugins</span><h2 class="stitle">Plugins: empaquetar y distribuir un workflow completo</h2><div class="cards c3"><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M38-160v-94q0-35 18-63.5t50-42.5q73-32 131.5-46T358-420q62 0 120 14t131 46q32 14 50.5 42.5T678-254v94H38Zm700 0v-94q0-63-32-103.5T622-423q69 8 130 23.5t99 35.5q33 19 52 47t19 63v94H738ZM250-523q-42-42-42-108t42-108q42-42 108-42t108 42q42 42 42 108t-42 108q-42 42-108 42t-108-42Zm426 0q-42 42-108 42-11 0-24.5-1.5T519-488q24-25 36.5-61.5T568-631q0-45-12.5-79.5T519-774q11-3 24.5-5t24.5-2q66 0 108 42t42 108q0 66-42 108ZM98-220h520v-34q0-16-9.5-31T585-306q-72-32-121-43t-106-11q-57 0-106.5 11T130-306q-14 6-23 21t-9 31v34Zm324.5-346.5Q448-592 448-631t-25.5-64.5Q397-721 358-721t-64.5 25.5Q268-670 268-631t25.5 64.5Q319-541 358-541t64.5-25.5ZM358-220Zm0-411Z"/></svg></span><h3>Concepto.</h3><p>Un Plugin es la unidad de distribución de un workflow completo: empaqueta Skills + agentes + hooks + MCP en una sola instalación. "Ship the whole thing."</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M38-160v-94q0-35 18-63.5t50-42.5q73-32 131.5-46T358-420q62 0 120 14t131 46q32 14 50.5 42.5T678-254v94H38Zm700 0v-94q0-63-32-103.5T622-423q69 8 130 23.5t99 35.5q33 19 52 47t19 63v94H738ZM250-523q-42-42-42-108t42-108q42-42 108-42t108 42q42 42 42 108t-42 108q-42 42-108 42t-108-42Zm426 0q-42 42-108 42-11 0-24.5-1.5T519-488q24-25 36.5-61.5T568-631q0-45-12.5-79.5T519-774q11-3 24.5-5t24.5-2q66 0 108 42t42 108q0 66-42 108ZM98-220h520v-34q0-16-9.5-31T585-306q-72-32-121-43t-106-11q-57 0-106.5 11T130-306q-14 6-23 21t-9 31v34Zm324.5-346.5Q448-592 448-631t-25.5-64.5Q397-721 358-721t-64.5 25.5Q268-670 268-631t25.5 64.5Q319-541 358-541t64.5-25.5ZM358-220Zm0-411Z"/></svg></span><h3>En Cowork.</h3><p>Se instalan desde un marketplace de plugins en la GUI. Un Plugin es una de las vías para distribuir Skills (y agentes/connectors): para usar una Skill en Cowork, la habilitás como skill de usuario (Customize → Skills) o la enviás dentro de un plugin. Las skills provistas por plugin funcionan en Chat y en Cowork.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M880-81 721-240H300q-24.75 0-42.37-17.63Q240-275.25 240-300v-80h440q24.75 0 42.38-17.63Q740-415.25 740-440v-280h80q24.75 0 42.38 17.62Q880-684.75 880-660v579ZM140-425l75-75h405v-320H140v395ZM80-280v-540q0-24.75 17.63-42.38Q115.25-880 140-880h480q24.75 0 42.38 17.62Q680-844.75 680-820v320q0 24.75-17.62 42.37Q644.75-440 620-440H240L80-280Zm60-220v-320 320Z"/></svg></span><h3>Dónde encontrarlos.</h3><p>Marketplaces oficiales (anthropics/claude-plugins-official, anthropics/knowledge-work-plugins) y de la comunidad.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m627-287 45-45-159-160v-201h-60v225l174 181ZM480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155t86-127.5Q252-817 325-848.5T480-880q82 0 155 31.5t127.5 86Q817-708 848.5-635T880-480q0 82-31.5 155t-86 127.5Q708-143 635-111.5T480-80Zm0-400Zm0 340q140 0 240-100t100-240q0-140-100-240T480-820q-140 0-240 100T140-480q0 140 100 240t240 100Z"/></svg></span><h3>Notes</h3><p>Cerrar el avanzado con la idea de empaquetado: cuando un workflow está maduro (varias skills + connectors + agentes), un Plugin lo vuelve instalable de una. El punto importante para Cowork: la forma robusta de distribuir una skill (o un agente) a otros es dentro de un plugin; los plugins distribuidos aparecen tanto en Chat como en Cowork. Mencionar los marketplaces oficiales como punto de partida. Tiempo objetivo: ~6 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">25/27 · figures</span><div class="stage"><span class="pill">Advanced: Subagentes y Plugins</span><h2 class="stitle">Plugins en una cuenta Team: ciclo de vida</h2><div class="figs"><div class="figc"><div class="imgph"><span>image</span></div><h4>Quién lo maneja.</h4><p>En cuentas Team / Enterprise, los Owners gestionan los plugins de la organización desde Organization settings → Plugins. El resto de los miembros los reciben listos.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>El ciclo de vida, de punta a punta:</h4><p></p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Qué se puede hacer.</h4><p>- El Owner crea un marketplace privado de la organización y agrega plugins de dos formas: subir un ZIP, o sincronizar desde un repo de GitHub (privado) — esta segunda vía auto-actualiza cuando cambia el repo. - Por cada plugin se fija una preferencia de instalación: opcional (el miembro decide), auto-install o provisionado por usuario. - Los plugins distribuidos aparecen en chat y en Cowork para los miembros; cada uno instala/habilita desde el directorio de la org, y las actualizaciones se sincronizan solas.</p></div><div class="figc"><div class="imgph"><span>image</span></div><h4>Notes</h4><p>Slide de cierre del bloque avanzado, orientada a quien algún día administre una cuenta de equipo. La idea: los Plugins no son solo para instalar de a uno; en una cuenta Team, un Owner puede armar un marketplace privado de la organización y repartir workflows a todo el equipo. Recorrer el ciclo con el diagrama: el Owner crea el marketplace y sube plugins (ZIP o, mejor, sincronizando un repo de GitHub que auto-actualiza), fija cómo se instala cada uno (opcional / auto-install / provisionado), y desde ahí se distribuye —aparece tanto en chat como en Cowork— y los miembros lo habilitan desde su directorio, con las actualizaciones sincronizadas. Mantenerlo alto nivel: es el "para cuando esto escala a un equipo". Tiempo objetivo: ~4 min.</p></div></div></div></div></figure><figure><div class="slide"><span class="snum">26/27 · divider</span><div class="stage cover"><div class="stmt"><p class="big">Conclusions</p></div></div></div></figure><figure><div class="slide"><span class="snum">27/27 · concept-breakdown</span><div class="stage"><span class="pill">Conclusions</span><h2 class="stitle">Gobernanza y advertencias (antes de Q&amp;A)</h2><div class="cards c3"><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-120q-151 0-255.5-46.5T120-280v-400q0-66 105.5-113T480-840q149 0 254.5 47T840-680v400q0 67-104.5 113.5T480-120Zm0-488q86 0 176.5-26.5T773-694q-27-32-117.5-59T480-780q-88 0-177 26t-117 60q28 35 116 60.5T480-608Zm-1 214q42 0 84-4.5t80.5-13.5q38.5-9 73.5-22t63-29v-155q-29 16-64 29t-74 22q-39 9-80 14t-83 5q-42 0-84-5t-80.5-14q-38.5-9-73-22T180-618v155q27 16 61 29t72.5 22q38.5 9 80.5 13.5t85 4.5Zm1 214q48 0 99-8.5t93.5-22.5q42.5-14 72-31t35.5-35v-125q-28 16-63 28.5T643.5-352q-38.5 9-80 13.5T479-334q-43 0-85-4.5T313.5-352q-38.5-9-72.5-21.5T180-402v126q5 17 34 34.5t72 31q43 13.5 94 22t100 8.5Z"/></svg></span><h3>Cowork no tiene audit trail</h3><p>— no es apto para datos regulados o sensibles.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M220-80q-24.75 0-42.37-17.63Q160-115.25 160-140v-434q0-24.75 17.63-42.38Q195.25-634 220-634h70v-96q0-78.85 55.61-134.42Q401.21-920 480.11-920q78.89 0 134.39 55.58Q670-808.85 670-730v96h70q24.75 0 42.38 17.62Q800-598.75 800-574v434q0 24.75-17.62 42.37Q764.75-80 740-80H220Zm0-60h520v-434H220v434Zm314.5-162.03Q557-324.06 557-355q0-30-22.67-54.5t-54.5-24.5q-31.83 0-54.33 24.5t-22.5 55q0 30.5 22.67 52.5t54.5 22q31.83 0 54.33-22.03ZM350-634h260v-96q0-54.17-37.88-92.08-37.88-37.92-92-37.92T388-822.08q-38 37.91-38 92.08v96ZM220-140v-434 434Z"/></svg></span><h3>Toda salida es un borrador</h3><p>— verificá cifras, citas y afirmaciones contra la fuente.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-120q-151 0-255.5-46.5T120-280v-400q0-66 105.5-113T480-840q149 0 254.5 47T840-680v400q0 67-104.5 113.5T480-120Zm0-488q86 0 176.5-26.5T773-694q-27-32-117.5-59T480-780q-88 0-177 26t-117 60q28 35 116 60.5T480-608Zm-1 214q42 0 84-4.5t80.5-13.5q38.5-9 73.5-22t63-29v-155q-29 16-64 29t-74 22q-39 9-80 14t-83 5q-42 0-84-5t-80.5-14q-38.5-9-73-22T180-618v155q27 16 61 29t72.5 22q38.5 9 80.5 13.5t85 4.5Zm1 214q48 0 99-8.5t93.5-22.5q42.5-14 72-31t35.5-35v-125q-28 16-63 28.5T643.5-352q-38.5 9-80 13.5T479-334q-43 0-85-4.5T313.5-352q-38.5-9-72.5-21.5T180-402v126q5 17 34 34.5t72 31q43 13.5 94 22t100 8.5Z"/></svg></span><h3>No metas datos confidenciales / PII / bajo NDA</h3><p>en la superficie equivocada.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m393-165 279-335H492l36-286-253 366h154l-36 255Zm-73 85 40-280H160l360-520h80l-40 320h240L400-80h-80Zm154-396Z"/></svg></span><h3>Reproducibilidad:</h3><p>mantené juntos prompt + entradas + salidas, para que el trabajo sea auditable.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-120q-151 0-255.5-46.5T120-280v-400q0-66 105.5-113T480-840q149 0 254.5 47T840-680v400q0 67-104.5 113.5T480-120Zm0-488q86 0 176.5-26.5T773-694q-27-32-117.5-59T480-780q-88 0-177 26t-117 60q28 35 116 60.5T480-608Zm-1 214q42 0 84-4.5t80.5-13.5q38.5-9 73.5-22t63-29v-155q-29 16-64 29t-74 22q-39 9-80 14t-83 5q-42 0-84-5t-80.5-14q-38.5-9-73-22T180-618v155q27 16 61 29t72.5 22q38.5 9 80.5 13.5t85 4.5Zm1 214q48 0 99-8.5t93.5-22.5q42.5-14 72-31t35.5-35v-125q-28 16-63 28.5T643.5-352q-38.5 9-80 13.5T479-334q-43 0-85-4.5T313.5-352q-38.5-9-72.5-21.5T180-402v126q5 17 34 34.5t72 31q43 13.5 94 22t100 8.5Z"/></svg></span><h3>Capas de guardarraíles:</h3><p>permisos de carpeta → reglas en Instrucciones → solo plugins verificados → revisión humana. - Contexto biomédico:* lo anterior es especialmente relevante si alguna vez aplican esto con datos de pacientes — Cowork no es la herramienta para datos clínicos sensibles.</p></div><div class="ccard"><span class="ic"><svg fill="#DA1B2E" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m627-287 45-45-159-160v-201h-60v225l174 181ZM480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155t86-127.5Q252-817 325-848.5T480-880q82 0 155 31.5t127.5 86Q817-708 848.5-635T880-480q0 82-31.5 155t-86 127.5Q708-143 635-111.5T480-80Zm0-400Zm0 340q140 0 240-100t100-240q0-140-100-240T480-820q-140 0-240 100T140-480q0 140 100 240t240 100Z"/></svg></span><h3>Notes</h3><p>Slide de cierre responsable, breve pero no opcional. Para esta audiencia (bioingeniería), conectar explícitamente: Cowork es excelente para trabajo recurrente de oficina, pero NO para datos de pacientes ni nada regulado — no tiene audit trail. Recordar que toda salida es un borrador que hay que verificar. Dejar esto antes de abrir Q&amp;A. Tiempo objetivo: ~3 min.</p></div></div></div></div></figure></div><footer>Rendered by Talksmith · strict style, code-generated HTML. Icons: Material Symbols (Apache-2.0). Image slots are placeholders.</footer></div>
