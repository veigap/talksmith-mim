<svg viewBox="0 0 780 315" xmlns="http://www.w3.org/2000/svg">
  <title>¿Dónde corre tu tarea? Local vs nube</title>
  <desc>Hoy conviven dos realidades.</desc>

  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6B6360"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="315" fill="#ffffff"/>

  <!-- root question (focal) -->
  <rect x="220" y="18" width="340" height="58" rx="6" fill="#FDECEE" stroke="#DA1B2E" stroke-width="2"/>
  <text x="390" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">tu tarea programada</text>
  <text x="390" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#DA1B2E">¿DÓNDE corre?</text>

  <!-- bifurcation connectors -->
  <path d="M390,76 L390,100" fill="none" stroke="#6B6360" stroke-width="1.8"/>
  <path d="M207.5,100 L572.5,100" fill="none" stroke="#6B6360" stroke-width="1.8"/>
  <path d="M207.5,100 L207.5,125" fill="none" stroke="#6B6360" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M572.5,100 L572.5,125" fill="none" stroke="#6B6360" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- LOCAL panel -->
  <rect x="40" y="125" width="335" height="170" rx="6" fill="#ffffff"/>
  <path d="M46,125 L369,125 A6,6 0 0 1 375,131 L375,158 L40,158 L40,131 A6,6 0 0 1 46,125 z" fill="#E8E4E4"/>
  <path d="M40,158 L375,158" fill="none" stroke="#3B3535" stroke-width="1.6"/>
  <rect x="40" y="125" width="335" height="170" rx="6" fill="none" stroke="#3B3535" stroke-width="1.6"/>
  <text x="207.5" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535">LOCAL — hoy, la mayoría</text>

  <text x="62" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">·  compu prendida</text>
  <text x="62" y="211" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">·  app abierta</text>
  <text x="62" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">·  apagada → se saltea,</text>
  <text x="76" y="254" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">corre al volver</text>
  <text x="62" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">·  ojo: notebooks suspendidas</text>

  <!-- NUBE panel -->
  <rect x="405" y="125" width="335" height="170" rx="6" fill="#ffffff"/>
  <path d="M411,125 L734,125 A6,6 0 0 1 740,131 L740,158 L405,158 L405,131 A6,6 0 0 1 411,125 z" fill="#F4F2F2"/>
  <path d="M405,158 L740,158" fill="none" stroke="#B9B2B2" stroke-width="1.4"/>
  <rect x="405" y="125" width="335" height="170" rx="6" fill="none" stroke="#B9B2B2" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="572.5" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535">NUBE — beta, jul 2026 →</text>

  <text x="427" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">·  sin compu prendida</text>
  <text x="427" y="211" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">·  rollout gradual (Max primero)</text>
  <text x="427" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3B3535">·  PERO: archivos/apps locales</text>
  <text x="441" y="254" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3B3535">→ corre local igual</text>
</svg>
