<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Anatomía de un SKILL.md</title>
  <desc id="d">Un SKILL.md partido en dos zonas: arriba el header YAML con name y description, abajo las instrucciones en Markdown.</desc>

  <!-- Canvas -->
  <rect x="0" y="0" width="680" height="360" fill="#ffffff"/>

  <!-- File card -->
  <rect x="32" y="30" width="430" height="294" rx="8" fill="#ffffff" stroke="#DCD7D3" stroke-width="1.5"/>

  <!-- Card header strip -->
  <path d="M 32,38 a 8,8 0 0 1 8,-8 L 454,30 a 8,8 0 0 1 8,8 L 462,56 L 32,56 Z" fill="#F2EFEC"/>
  <line x1="32" y1="56" x2="462" y2="56" stroke="#DCD7D3" stroke-width="1.5"/>
  <text x="52" y="48" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="bold" fill="#6B6462">SKILL.md</text>

  <!-- Metadata zone tint -->
  <rect x="33" y="56" width="428" height="134" fill="#F7F4F1"/>

  <!-- Focal highlight: the description block -->
  <rect x="42" y="104" width="412" height="56" fill="#FCF0F1"/>
  <rect x="42" y="104" width="4" height="56" fill="#DA1B2E"/>

  <!-- Zone divider -->
  <line x1="32" y1="190" x2="462" y2="190" stroke="#DCD7D3" stroke-width="1.5"/>

  <!-- Metadata zone content -->
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#3B3535">
    <text x="52" y="77" fill="#A9A29F">---</text>
    <text x="52" y="96"><tspan font-weight="bold">name:</tspan> reporte-semanal</text>
    <text x="52" y="115"><tspan font-weight="bold" fill="#DA1B2E">description:</tspan> Genera el pulso semanal de mercado a partir</text>
    <text x="68" y="134">de la carpeta fuentes/ de la semana. Usar cuando pidan</text>
    <text x="68" y="153">"reporte semanal" o "pulso de la semana".</text>
    <text x="52" y="172" fill="#A9A29F">---</text>
  </g>

  <!-- Body zone content -->
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#3B3535">
    <text x="52" y="213" font-weight="bold"># Reporte semanal</text>
    <text x="52" y="251">1. Leé TODOS los archivos de fuentes/ y consolidá</text>
    <text x="72" y="270">por empresa.</text>
    <text x="52" y="289">2. Generá el reporte con esta estructura exacta...</text>
    <text x="52" y="308">3. Guardá con sufijo -new (no pises el original).</text>
  </g>

  <!-- Right column: metadata label group -->
  <rect x="478" y="84" width="3" height="76" fill="#DCD7D3"/>
  <text x="492" y="95" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#8A8482">METADATA / HEADER</text>
  <text x="492" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8A8482">(YAML)</text>
  <text x="492" y="136" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">qué es la Skill</text>
  <text x="492" y="155" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DA1B2E">+ cuándo se activa</text>

  <!-- Right column: body label group -->
  <rect x="478" y="219" width="3" height="76" fill="#DCD7D3"/>
  <text x="492" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" fill="#8A8482">CUERPO</text>
  <text x="492" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8A8482">(Markdown)</text>
  <text x="492" y="271" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">qué hace: los pasos</text>
  <text x="492" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">que sigue el agente</text>
</svg>
