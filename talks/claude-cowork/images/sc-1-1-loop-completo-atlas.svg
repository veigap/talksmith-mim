<svg viewBox="0 0 680 458" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>El loop completo y la idea para llevarse</title>
  <desc>El loop de Atlas encadena todas las piezas de Cowork: un solo disparador de Schedule cada lunes pone en marcha las Skills, los Connectors y el Live Artifact.</desc>
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6666"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="458" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#3B3535">

    <!-- ===== trigger: un solo disparador (focal) ===== -->
    <rect x="100" y="14" width="180" height="28" rx="14" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
    <text x="190" y="33" text-anchor="middle" font-size="14" font-weight="bold" fill="#DA1B2E">Lunes 8:00</text>
    <line x1="190" y1="42" x2="190" y2="66" stroke="#DA1B2E" stroke-width="2" marker-end="url(#arrow-red)"/>

    <text x="296" y="33" font-size="12.5" font-style="italic" fill="#DA1B2E">un solo disparador arranca todo el loop</text>

    <!-- ===== paso 1: Schedule (focal) ===== -->
    <rect x="40" y="72" width="300" height="54" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
    <text x="190" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">Schedule</text>
    <text x="190" y="113" text-anchor="middle" font-size="12.5">dispara el loop cada lunes</text>

    <line x1="190" y1="126" x2="190" y2="150" stroke="#6E6666" stroke-width="2" marker-end="url(#arrow-grey)"/>

    <!-- ===== paso 2: Skill buscar-accion ===== -->
    <rect x="40" y="154" width="300" height="54" rx="8" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="190" y="177" text-anchor="middle" font-size="14" font-weight="bold">Skill buscar-accion</text>
    <text x="190" y="195" text-anchor="middle" font-size="12.5">trae precios y noticias</text>

    <line x1="340" y1="181" x2="376" y2="181" stroke="#6E6666" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

    <rect x="380" y="154" width="270" height="54" rx="8" fill="#ffffff" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="515" y="177" text-anchor="middle" font-size="12.5" font-weight="bold">Connector MT Newswires + Yahoo</text>
    <text x="515" y="195" text-anchor="middle" font-size="12.5">guarda las fuentes en el Project</text>

    <line x1="190" y1="208" x2="190" y2="232" stroke="#6E6666" stroke-width="2" marker-end="url(#arrow-grey)"/>

    <!-- ===== paso 3: Skill reporte-semanal ===== -->
    <rect x="40" y="236" width="300" height="54" rx="8" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="190" y="259" text-anchor="middle" font-size="14" font-weight="bold">Skill reporte-semanal</text>
    <text x="190" y="277" text-anchor="middle" font-size="12.5">consolida las fuentes</text>

    <line x1="340" y1="263" x2="376" y2="263" stroke="#6E6666" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

    <rect x="380" y="236" width="270" height="54" rx="8" fill="#ffffff" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="515" y="259" text-anchor="middle" font-size="12.5" font-weight="bold">reporte .md consolidado</text>
    <text x="515" y="277" text-anchor="middle" font-size="12.5">guardado en el Project</text>

    <!-- ===== spine + rama Gmail ===== -->
    <line x1="190" y1="290" x2="190" y2="370" stroke="#6E6666" stroke-width="2" marker-end="url(#arrow-grey)"/>
    <circle cx="190" cy="332" r="3.5" fill="#6E6666"/>
    <line x1="190" y1="332" x2="376" y2="332" stroke="#6E6666" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

    <rect x="380" y="309" width="270" height="46" rx="8" fill="#ffffff" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="515" y="328" text-anchor="middle" font-size="12.5" font-weight="bold">Connector Gmail</text>
    <text x="515" y="346" text-anchor="middle" font-size="12.5">deja un borrador para el equipo</text>

    <!-- ===== paso 4: Skill publicar-tablero ===== -->
    <rect x="40" y="374" width="300" height="60" rx="8" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="190" y="400" text-anchor="middle" font-size="14" font-weight="bold">Skill publicar-tablero</text>
    <text x="190" y="418" text-anchor="middle" font-size="12.5">arma y publica el tablero</text>

    <line x1="340" y1="404" x2="376" y2="404" stroke="#6E6666" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

    <rect x="380" y="374" width="270" height="60" rx="8" fill="#ffffff" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="515" y="391" text-anchor="middle" font-size="12.5" font-weight="bold">Live Artifact</text>
    <text x="515" y="408" text-anchor="middle" font-size="12.5">pulso-semanal-FECHA</text>
    <text x="515" y="425" text-anchor="middle" font-size="12.5">en la pesta&#241;a Live artifacts</text>

  </g>
</svg>
