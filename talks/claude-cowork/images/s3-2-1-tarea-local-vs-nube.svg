<!-- talksmith-ascii-sha256: 7ffdcbe4fc7caccf17150f6b726ec3ba368d9e70e44cda749593f82406ca55c8 -->
<svg viewBox="0 0 688 384" xmlns="http://www.w3.org/2000/svg">
  <title>¿Dónde corre tu tarea? Local vs nube</title>
  <desc>Bifurcación de una tarea programada según dónde se ejecuta: local, con la computadora prendida y la app abierta, o en la nube, en beta desde julio de 2026 y con rollout gradual.</desc>

  <rect x="0" y="0" width="688" height="384" fill="#ffffff"/>

  <!-- Raíz: la pregunta (elemento focal) -->
  <rect x="154" y="24" width="380" height="46" rx="5" fill="#DA1B2E"/>
  <text x="344" y="53" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">tu tarea programada: ¿DÓNDE corre?</text>

  <!-- Conectores de la bifurcación -->
  <path d="M 344 70 L 344 92" stroke="#3B3535" stroke-width="1.6" fill="none"/>
  <path d="M 174 92 L 514 92" stroke="#3B3535" stroke-width="1.6" fill="none"/>
  <path d="M 174 92 L 174 117" stroke="#3B3535" stroke-width="1.6" fill="none"/>
  <path d="M 514 92 L 514 117" stroke="#3B3535" stroke-width="1.6" fill="none"/>
  <path d="M 168 117 L 180 117 L 174 126 Z" fill="#3B3535"/>
  <path d="M 508 117 L 520 117 L 514 126 Z" fill="#3B3535"/>

  <!-- Rama izquierda: LOCAL -->
  <rect x="24" y="126" width="300" height="160" rx="5" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.4"/>
  <path d="M 24 131 A 5 5 0 0 1 29 126 L 319 126 A 5 5 0 0 1 324 131 L 324 160 L 24 160 Z" fill="#F2EEEE"/>
  <path d="M 24 160 L 324 160" stroke="#D8D4D4" stroke-width="1.4"/>
  <text x="174" y="149" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F1E1E">LOCAL (hoy, la mayoría)</text>

  <text x="40" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">·</text>
  <text x="50" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">computadora prendida</text>
  <text x="40" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">·</text>
  <text x="50" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">app abierta</text>
  <text x="40" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">·</text>
  <text x="50" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">si está apagada: se saltea</text>
  <text x="50" y="244" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">y corre al volver</text>
  <text x="40" y="266" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">·</text>
  <text x="50" y="266" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">ojo: notebooks suspendidas</text>

  <!-- Rama derecha: NUBE -->
  <rect x="364" y="126" width="300" height="160" rx="5" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.4"/>
  <path d="M 364 131 A 5 5 0 0 1 369 126 L 659 126 A 5 5 0 0 1 664 131 L 664 160 L 364 160 Z" fill="#F2EEEE"/>
  <path d="M 364 160 L 664 160" stroke="#D8D4D4" stroke-width="1.4"/>
  <text x="514" y="149" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F1E1E">NUBE (beta, desde jul 2026)</text>

  <text x="380" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">·</text>
  <text x="390" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">no hace falta la compu prendida</text>
  <text x="380" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">·</text>
  <text x="390" y="204" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">rollout gradual: plan Max primero</text>
  <text x="380" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">·</text>
  <text x="390" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">todavía no llega a toda cuenta</text>

  <!-- Excepción que sobrevive a la nube -->
  <rect x="24" y="312" width="640" height="48" rx="5" fill="#F7BBC1"/>
  <text x="344" y="341" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F1E1E">PERO: si la tarea necesita archivos o apps locales, corre local siempre</text>
</svg>
