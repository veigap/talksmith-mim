<!-- talksmith-ascii-sha256: 5a4e1f5f13afdb77ca7b91153f39bc76dc2cb072efcbeeb44b0bddc6eeadae86 -->
<svg viewBox="0 0 598 332" xmlns="http://www.w3.org/2000/svg">
  <title>Tareas programadas desde el chat</title>
  <desc>Describís el trabajo una vez, elegís cadencia (diaria, semanal, a demanda) y corre sola avisándote con el resultado.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B3535"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="598" height="332" fill="#ffffff"/>

  <!-- heading -->
  <text x="299" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">Tarea programada — se describe una vez</text>

  <!-- clock trigger pill -->
  <rect x="44" y="60" width="180" height="40" rx="20" fill="#ffffff" stroke="#B9B2B2" stroke-width="1.5"/>
  <circle cx="84" cy="80" r="11" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
  <line x1="84" y1="80" x2="84" y2="72.5" stroke="#3B3535" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="84" y1="80" x2="79.2" y2="82.8" stroke="#3B3535" stroke-width="1.6" stroke-linecap="round"/>
  <text x="104" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535">Lunes, 8:00</text>

  <!-- trigger arrow -->
  <line x1="134" y1="102" x2="134" y2="134" stroke="#3B3535" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="146" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#6B6363">cadencia</text>

  <!-- focal box: the task -->
  <rect x="24" y="138" width="220" height="74" rx="8" fill="#FDF3F4" stroke="#DA1B2E" stroke-width="2"/>
  <text x="134" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#3B3535">La tarea corre sola</text>
  <text x="134" y="191" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6363">una vez descrita, se repite</text>

  <!-- connectors box -->
  <rect x="354" y="138" width="220" height="74" rx="8" fill="#F4F2F2" stroke="#B9B2B2" stroke-width="1.5"/>
  <text x="464" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#3B3535">Mail · Web · Calendario</text>
  <text x="464" y="191" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6363">tus conectores</text>

  <!-- round trip -->
  <line x1="248" y1="160" x2="350" y2="160" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="299" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B6363">usa conectores</text>
  <line x1="350" y1="190" x2="248" y2="190" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="299" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B6363">trae la info</text>

  <!-- result arrow -->
  <line x1="134" y1="214" x2="134" y2="246" stroke="#DA1B2E" stroke-width="1.8" marker-end="url(#ahr)"/>

  <!-- result band -->
  <rect x="24" y="250" width="550" height="58" rx="8" fill="#ffffff" stroke="#B9B2B2" stroke-width="1.5"/>
  <text x="299" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">Resumen listo en tu chat, cada semana, sin que lo pidas de nuevo</text>
</svg>
