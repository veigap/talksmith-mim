<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Los bloques de Cowork</title>
  <desc>Cada pieza de Cowork resuelve un problema recurrente; los bloques se apilan y Plugins los distribuye a todos.</desc>
  <rect x="0" y="0" width="680" height="620" fill="#ffffff"/>

  <!-- Plugins transversal band wrapping everything (focal, red outline) -->
  <rect x="20" y="20" width="640" height="540" rx="8" fill="none" stroke="#DA1B2E" stroke-width="2.5"/>
  <rect x="20" y="20" width="640" height="40" rx="8" fill="#DA1B2E"/>
  <text x="340" y="47" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">PLUGINS — capa transversal: empaquetan y distribuyen</text>

  <!-- 7 stacked blocks, each paired with its recurring problem -->
  <!-- block template: rect 50,Y,200,46 ; problem text at x=270 -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Live Artifacts -->
    <rect x="50" y="80" width="220" height="44" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="160" y="107" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">LIVE ARTIFACTS</text>
    <text x="290" y="107" font-size="12.5" fill="#3B3535">"quiero compartir el resultado vivo"</text>

    <!-- Schedule -->
    <rect x="50" y="146" width="220" height="44" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="160" y="173" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">SCHEDULE</text>
    <text x="290" y="173" font-size="12.5" fill="#3B3535">"quiero que corra solo"</text>

    <!-- Connectors / MCP -->
    <rect x="50" y="212" width="220" height="44" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="160" y="239" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">CONNECTORS / MCP</text>
    <text x="290" y="239" font-size="12.5" fill="#3B3535">"quiero traer datos de mis herramientas"</text>

    <!-- Skills -->
    <rect x="50" y="278" width="220" height="44" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="160" y="305" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">SKILLS</text>
    <text x="290" y="305" font-size="12.5" fill="#3B3535">"no quiero repetir la misma tarea"</text>

    <!-- Projects -->
    <rect x="50" y="344" width="220" height="44" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="160" y="371" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">PROJECTS</text>
    <text x="290" y="371" font-size="12.5" fill="#3B3535">"quiero guardar y organizar en un lugar fijo"</text>

    <!-- Instrucciones -->
    <rect x="50" y="410" width="220" height="44" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="160" y="437" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">INSTRUCCIONES</text>
    <text x="290" y="437" font-size="12.5" fill="#3B3535">"no quiero repetir el contexto en cada prompt"</text>

    <!-- Un prompt / chatear -->
    <rect x="50" y="476" width="220" height="44" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
    <text x="160" y="503" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#3B3535">UN PROMPT / CHATEAR</text>
    <text x="290" y="503" font-size="12.5" fill="#3B3535">"hago todo a mano, un mensaje a la vez"</text>
  </g>

  <!-- upward autonomy arrow alongside the stack -->
  <line x1="35" y1="510" x2="35" y2="90" stroke="#DA1B2E" stroke-width="2"/>
  <polygon points="29,98 35,84 41,98" fill="#DA1B2E"/>

  <!-- footer caption -->
  <text x="340" y="588" text-anchor="middle" font-size="12.5" fill="#6A737D">Los bloques se apilan (cada uno suma autonomia); Plugins los distribuye a todos.</text>
</svg>
