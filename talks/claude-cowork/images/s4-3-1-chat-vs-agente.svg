<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>De chat a agente: el cambio de paradigma</title>
  <desc>Contraste entre el modo chat, donde escribís un mensaje a la vez y hacés cada paso, y el modo agente, donde describís un resultado y el agente planifica y trabaja sobre tus archivos.</desc>

  <defs>
    <marker id="arrGrey" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#8A8080"/>
    </marker>
    <marker id="arrRed" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#DA1B2E"/>
    </marker>
    <marker id="arrBig" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>

  <!-- ================= LEFT: ANTES (chat) ================= -->
  <text x="160" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B3535">ANTES · chat</text>
  <text x="160" y="44" text-anchor="middle" font-size="11" fill="#8A8080">un mensaje a la vez</text>

  <rect x="24" y="56" width="272" height="240" rx="6" fill="#FAF9F9" stroke="#C9C2C2" stroke-width="1.5"/>

  <!-- row 1 -->
  <rect x="42" y="80" width="100" height="24" rx="4" fill="#F2EFEF" stroke="#C9C2C2" stroke-width="1"/>
  <text x="92" y="96" text-anchor="middle" font-size="11" fill="#3B3535">vos: mensaje</text>
  <line x1="148" y1="92" x2="172" y2="92" stroke="#8A8080" stroke-width="1.4" marker-end="url(#arrGrey)"/>
  <text x="178" y="96" font-size="11" fill="#8A8080">respuesta</text>

  <!-- row 2 -->
  <rect x="42" y="116" width="100" height="24" rx="4" fill="#F2EFEF" stroke="#C9C2C2" stroke-width="1"/>
  <text x="92" y="132" text-anchor="middle" font-size="11" fill="#3B3535">vos: mensaje</text>
  <line x1="148" y1="128" x2="172" y2="128" stroke="#8A8080" stroke-width="1.4" marker-end="url(#arrGrey)"/>
  <text x="178" y="132" font-size="11" fill="#8A8080">respuesta</text>

  <!-- row 3 -->
  <rect x="42" y="152" width="100" height="24" rx="4" fill="#F2EFEF" stroke="#C9C2C2" stroke-width="1"/>
  <text x="92" y="168" text-anchor="middle" font-size="11" fill="#3B3535">vos: mensaje</text>
  <line x1="148" y1="164" x2="172" y2="164" stroke="#8A8080" stroke-width="1.4" marker-end="url(#arrGrey)"/>
  <text x="178" y="168" font-size="11" fill="#8A8080">respuesta</text>

  <!-- row 4 -->
  <rect x="42" y="188" width="100" height="24" rx="4" fill="#F2EFEF" stroke="#C9C2C2" stroke-width="1"/>
  <text x="92" y="204" text-anchor="middle" font-size="11" fill="#3B3535">vos: mensaje</text>
  <line x1="148" y1="200" x2="172" y2="200" stroke="#8A8080" stroke-width="1.4" marker-end="url(#arrGrey)"/>
  <text x="178" y="204" font-size="11" fill="#8A8080">respuesta</text>

  <!-- left outcome chip -->
  <rect x="44" y="234" width="232" height="38" rx="4" fill="#F2EFEF" stroke="#C9C2C2" stroke-width="1.5"/>
  <text x="160" y="257" text-anchor="middle" font-size="11.5" fill="#6B6363">salida: texto en la ventana</text>

  <!-- ================= PARADIGM ARROW ================= -->
  <text x="335" y="164" text-anchor="middle" font-size="10" font-weight="bold" fill="#DA1B2E">delegar</text>
  <line x1="306" y1="176" x2="366" y2="176" stroke="#DA1B2E" stroke-width="3" marker-end="url(#arrBig)"/>

  <!-- ================= RIGHT: AHORA (agente / Cowork) ================= -->
  <text x="514" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#DA1B2E">AHORA · agente (Cowork)</text>
  <text x="514" y="44" text-anchor="middle" font-size="11" fill="#8A8080">describís un resultado</text>

  <rect x="372" y="56" width="284" height="240" rx="6" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="1.5"/>

  <!-- step A -->
  <rect x="396" y="72" width="236" height="30" rx="4" fill="#FAF9F9" stroke="#C9C2C2" stroke-width="1"/>
  <text x="514" y="91" text-anchor="middle" font-size="11.5" fill="#3B3535">vos: «entregá X»</text>
  <line x1="514" y1="102" x2="514" y2="120" stroke="#8A8080" stroke-width="1.4" marker-end="url(#arrGrey)"/>

  <!-- step B -->
  <rect x="396" y="120" width="236" height="44" rx="4" fill="#FAF9F9" stroke="#C9C2C2" stroke-width="1"/>
  <text x="514" y="138" text-anchor="middle" font-size="11.5" fill="#3B3535">el agente planifica</text>
  <text x="514" y="154" text-anchor="middle" font-size="11.5" fill="#3B3535">y trabaja tus archivos</text>
  <line x1="514" y1="164" x2="514" y2="182" stroke="#8A8080" stroke-width="1.4" marker-end="url(#arrGrey)"/>

  <!-- step C -->
  <rect x="396" y="182" width="236" height="30" rx="4" fill="#FAF9F9" stroke="#C9C2C2" stroke-width="1"/>
  <text x="514" y="201" text-anchor="middle" font-size="11.5" fill="#3B3535">vos: leés y guiás</text>
  <line x1="514" y1="212" x2="514" y2="234" stroke="#DA1B2E" stroke-width="2" marker-end="url(#arrRed)"/>

  <!-- right outcome chip — focal -->
  <rect x="396" y="234" width="236" height="38" rx="4" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2.5"/>
  <text x="514" y="257" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#DA1B2E">salida: archivos en tu disco</text>
</svg>
