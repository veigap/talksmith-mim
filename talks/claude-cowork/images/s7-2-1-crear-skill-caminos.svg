<!-- talksmith-ascii-sha256: 260f014456b375c1959dc88ebc281c6a78271e61a121d0ab0396065f39300d1b -->
<svg viewBox="0 0 608 487" xmlns="http://www.w3.org/2000/svg">
  <title>Cómo se crea una Skill</title>
  <desc>Los dos caminos reales para crear una Skill en Cowork —pedírsela en lenguaje natural o subir un ZIP— convergen en la misma compuerta: Save / enable en Customize &gt; Skills.</desc>

  <rect x="0" y="0" width="608" height="487" fill="#ffffff"/>

  <!-- Header -->
  <text x="304" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#3B3535">Crear una Skill en Cowork</text>
  <text x="304" y="63" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6E6666">Cowork es GUI: no hay slash commands — solo estos dos caminos</text>

  <!-- Column labels -->
  <text x="144" y="99" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1.4" fill="#6E6666">CAMINO 1</text>
  <text x="464" y="99" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1.4" fill="#6E6666">CAMINO 2</text>

  <!-- Path 1 box -->
  <rect x="24" y="110" width="240" height="80" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.4"/>
  <text x="144" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">Pedila en lenguaje natural</text>
  <text x="144" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6E6666">Claude escribe el SKILL.md</text>

  <!-- Path 2 box -->
  <rect x="344" y="110" width="240" height="80" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.4"/>
  <text x="464" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">Subí un ZIP de la carpeta</text>
  <text x="464" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6E6666">Customize &gt; Skills &gt; “+”</text>

  <!-- Converging arrows -->
  <line x1="144" y1="194" x2="237.24" y2="245.19" stroke="#3B3535" stroke-width="1.6"/>
  <path d="M 246 250 L 235.08 249.13 L 239.40 241.25 Z" fill="#3B3535"/>
  <line x1="464" y1="194" x2="370.76" y2="245.19" stroke="#3B3535" stroke-width="1.6"/>
  <path d="M 362 250 L 368.60 241.25 L 372.92 249.13 Z" fill="#3B3535"/>

  <!-- Gate — the focal element -->
  <rect x="154" y="252" width="300" height="70" rx="4" fill="#FDECEE" stroke="#DA1B2E" stroke-width="2"/>
  <rect x="158" y="256" width="292" height="62" rx="2" fill="none" stroke="#DA1B2E" stroke-width="1"/>
  <text x="304" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#DA1B2E">SAVE / ENABLE</text>
  <text x="304" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6E6666">Customize &gt; Skills</text>

  <!-- "la trampa" pointer -->
  <line x1="478" y1="287" x2="468" y2="287" stroke="#DA1B2E" stroke-width="1.6"/>
  <path d="M 458 287 L 468 282.5 L 468 291.5 Z" fill="#DA1B2E"/>
  <text x="482" y="291.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DA1B2E">la trampa</text>

  <!-- Gate to outcome -->
  <line x1="304" y1="322" x2="304" y2="344" stroke="#3B3535" stroke-width="1.6"/>
  <path d="M 304 354 L 299.5 344 L 308.5 344 Z" fill="#3B3535"/>

  <!-- Outcome -->
  <rect x="204" y="356" width="200" height="48" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
  <text x="304" y="386" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535">SKILL ACTIVA</text>

  <!-- Legend -->
  <text x="304" y="436" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3B3535">Frenar en la compuerta = la Skill “no funciona”</text>
  <text x="304" y="460" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6E6666">Requisito: Code execution habilitado (Settings &gt; Capabilities)</text>
</svg>
