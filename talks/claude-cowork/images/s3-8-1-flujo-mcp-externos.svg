<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 982 266" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="15">
<title>External connectors: todo pasa por MCP</title>
<desc>El chat pide datos, el conector externo traduce el pedido por el protocolo MCP y el servicio de la empresa responde.</desc>
