<svg viewBox="0 0 680 344" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>De chat a agente: el cambio de paradigma</title>
  <desc>Dejás de tipear un mensaje a la vez y pasás a delegar un resultado: el agente planifica y trabaja sobre tus archivos mientras vos leés y guiás.</desc>
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6666"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="344" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#3B3535">

    <!-- panel headers -->
    <text x="154" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#3B3535">ANTES — chatear</text>
    <text x="526" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#DA1B2E">AHORA — delegar a un agente</text>

    <!-- ===== left panel: chat (neutral) ===== -->
    <rect x="28" y="64" width="252" height="222" rx="8" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1.5"/>

    <rect x="48" y="84" width="212" height="36" rx="6" fill="#ffffff" stroke="#B8B2B2" stroke-width="1"/>
    <text x="154" y="107" text-anchor="middle" font-size="13">vos: mensaje &#8594; respuesta</text>

    <rect x="48" y="136" width="212" height="36" rx="6" fill="#ffffff" stroke="#B8B2B2" stroke-width="1"/>
    <text x="154" y="159" text-anchor="middle" font-size="13">vos: mensaje &#8594; respuesta</text>

    <rect x="48" y="188" width="212" height="36" rx="6" fill="#ffffff" stroke="#B8B2B2" stroke-width="1"/>
    <text x="154" y="211" text-anchor="middle" font-size="13">vos: mensaje &#8594; respuesta</text>

    <!-- vertical ellipsis (drawn, font-independent) -->
    <circle cx="154" cy="244" r="2.2" fill="#6E6666"/>
    <circle cx="154" cy="254" r="2.2" fill="#6E6666"/>
    <circle cx="154" cy="264" r="2.2" fill="#6E6666"/>

    <text x="154" y="314" text-anchor="middle" font-size="12.5" font-style="italic" fill="#3B3535">cada paso lo hac&#233;s vos</text>

    <!-- ===== paradigm arrow ===== -->
    <text x="340" y="152" text-anchor="middle" font-size="11.5" fill="#3B3535">cambio de</text>
    <text x="340" y="166" text-anchor="middle" font-size="11.5" fill="#3B3535">paradigma</text>
    <line x1="290" y1="184" x2="393" y2="184" stroke="#DA1B2E" stroke-width="5" marker-end="url(#arrow-red)"/>

    <!-- ===== right panel: agent / Cowork (focal) ===== -->
    <rect x="400" y="64" width="252" height="222" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>

    <rect x="420" y="82" width="212" height="32" rx="6" fill="#ffffff" stroke="#B8B2B2" stroke-width="1"/>
    <text x="526" y="103" text-anchor="middle" font-size="13">vos: &#171;entreg&#225; X&#187;</text>

    <line x1="526" y1="116" x2="526" y2="124" stroke="#6E6666" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

    <rect x="420" y="128" width="212" height="32" rx="6" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1"/>
    <text x="526" y="149" text-anchor="middle" font-size="13">agente: planifica</text>

    <line x1="526" y1="162" x2="526" y2="170" stroke="#6E6666" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

    <rect x="420" y="174" width="212" height="44" rx="6" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1"/>
    <text x="526" y="192" text-anchor="middle" font-size="13">agente: trabaja sobre</text>
    <text x="526" y="209" text-anchor="middle" font-size="13">tus archivos</text>

    <line x1="526" y1="220" x2="526" y2="228" stroke="#6E6666" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

    <rect x="420" y="232" width="212" height="32" rx="6" fill="#ffffff" stroke="#B8B2B2" stroke-width="1"/>
    <text x="526" y="253" text-anchor="middle" font-size="13">vos: le&#233;s y gui&#225;s</text>

    <text x="526" y="314" text-anchor="middle" font-size="12.5" font-style="italic" font-weight="bold" fill="#DA1B2E">entreg&#225;s un resultado</text>

  </g>
</svg>
