<!-- talksmith-ascii-sha256: 41ef0e2fb883bbee362f3b72d11842d6d2bc10039e7e303dcc2e73ec9c7a862d -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="t d">
  <title id="t">El superpoder de Cowork: la herramienta de propósito general del knowledge worker</title>
  <desc id="d">Analogía: Excel fue la habilidad base del trabajo de oficina durante cuarenta años; las herramientas agénticas (Claude Code para developers, Cowork para knowledge workers) son la nueva habilidad base.</desc>

  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#3B3535">Trabajo de oficina: la herramienta de propósito general</text>

  <!-- Era labels -->
  <text x="160" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6E6868">~40 años</text>
  <text x="515" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6E6868">ahora</text>

  <!-- Left panel: Excel (yesterday, neutral) -->
  <rect x="40" y="88" width="240" height="128" rx="6" fill="#F2F0F0" stroke="#9C9494" stroke-width="1.5"/>
  <text x="160" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">EXCEL</text>
  <text x="160" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">lingua franca del</text>
  <text x="160" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">trabajo de oficina</text>
  <text x="160" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#6E6868">sin escribir codigo</text>

  <!-- Arrow between panels -->
  <line x1="292" y1="152" x2="342" y2="152" stroke="#3B3535" stroke-width="3"/>
  <polygon points="342,145 358,152 342,159" fill="#3B3535"/>

  <!-- Right panel: agentic tools (today, accented) -->
  <rect x="370" y="88" width="290" height="128" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
  <text x="515" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#DA1B2E">HERRAMIENTAS AGÉNTICAS</text>
  <text x="395" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">Claude Code</text>
  <text x="505" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6E6868">developers</text>
  <text x="395" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B3535">Cowork</text>
  <text x="505" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6E6868">knowledge workers</text>
  <text x="395" y="202" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#6E6868">encuadre de industria, no claim oficial</text>

  <!-- Footers -->
  <text x="160" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6E6868">la habilidad base de ayer</text>
  <text x="515" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B3535">la nueva habilidad base</text>
</svg>
