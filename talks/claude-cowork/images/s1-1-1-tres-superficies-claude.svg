<svg viewBox="0 0 680 384" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Las tres superficies de Claude</title>
  <desc>No son tres productos distintos: es el mismo agente con tres caras que corren sobre los mismos modelos Claude, y hoy trabajamos en Cowork.</desc>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="384" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- connectors (drawn first, under panels) -->
    <line x1="120" y1="120" x2="120" y2="288" stroke="#3B3535" stroke-width="1.5"/>
    <line x1="340" y1="120" x2="340" y2="168" stroke="#3B3535" stroke-width="1.5"/>
    <line x1="560" y1="120" x2="560" y2="168" stroke="#3B3535" stroke-width="1.5"/>
    <line x1="450" y1="232" x2="450" y2="288" stroke="#3B3535" stroke-width="1.5"/>

    <!-- label on the Web/Chat connector -->
    <text x="130" y="212" font-size="11" fill="#3B3535">superficie de chat</text>

    <!-- top panel: Web / Chat -->
    <rect x="24" y="24" width="192" height="96" rx="8" fill="#F2F0EF" stroke="#3B3535" stroke-width="1.2"/>
    <text x="120" y="50" font-size="17" font-weight="bold" fill="#3B3535" text-anchor="middle">Web / Chat</text>
    <text x="120" y="74" font-size="11.5" fill="#3B3535" text-anchor="middle">navegador o app, sin instalar</text>
    <text x="120" y="92" font-size="11.5" fill="#3B3535" text-anchor="middle">chat y tareas puntuales</text>

    <!-- top panel: Claude Code -->
    <rect x="244" y="24" width="192" height="96" rx="8" fill="#F2F0EF" stroke="#3B3535" stroke-width="1.2"/>
    <text x="340" y="50" font-size="17" font-weight="bold" fill="#3B3535" text-anchor="middle">Claude Code</text>
    <text x="340" y="74" font-size="11.5" fill="#3B3535" text-anchor="middle">app de escritorio + terminal</text>
    <text x="340" y="92" font-size="11.5" fill="#3B3535" text-anchor="middle">escribir y publicar código</text>

    <!-- top panel: Cowork (focal element, single red accent) -->
    <rect x="464" y="24" width="192" height="96" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
    <text x="560" y="50" font-size="17" font-weight="bold" fill="#DA1B2E" text-anchor="middle">Cowork</text>
    <text x="560" y="70" font-size="11.5" fill="#3B3535" text-anchor="middle">GUI de escritorio, sin terminal</text>
    <text x="560" y="86" font-size="11.5" fill="#3B3535" text-anchor="middle">trabajo multipaso en archivos</text>
    <text x="560" y="106" font-size="11" font-weight="bold" fill="#DA1B2E" text-anchor="middle">esta charla vive acá</text>

    <!-- Agent SDK band joining Code + Cowork -->
    <rect x="244" y="168" width="412" height="64" rx="8" fill="#F2F0EF" stroke="#3B3535" stroke-width="1.2"/>
    <text x="450" y="194" font-size="14" font-weight="bold" fill="#3B3535" text-anchor="middle">Claude Agent SDK — mismo engine de agente</text>
    <text x="450" y="215" font-size="11" fill="#3B3535" text-anchor="middle">archivos · Skills · MCP · loop plan → aprobar → redirigir</text>

    <!-- base panel: shared models -->
    <rect x="24" y="288" width="632" height="72" rx="8" fill="#ffffff" stroke="#3B3535" stroke-width="2.5"/>
    <text x="340" y="320" font-size="18" font-weight="bold" fill="#3B3535" text-anchor="middle" letter-spacing="1">MISMOS MODELOS CLAUDE</text>
    <text x="340" y="342" font-size="12" fill="#3B3535" text-anchor="middle">las tres superficies corren sobre la misma familia de modelos</text>

  </g>
</svg>
