<!-- talksmith-ascii-sha256: 015626f7662722f3403b7d8e9828520ae2263e272883f67ec48d2cea1fa8692d -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Las tres superficies de Claude</title>
  <desc>El mismo agente con tres caras: Web/Chat, Claude Code y Cowork corren sobre los mismos modelos Claude; Code y Cowork comparten ademas la misma base tecnica.</desc>
  <rect x="0" y="0" width="680" height="305" fill="#ffffff"/>

  <!-- Panel Web/Chat -->
  <rect x="25" y="25" width="190" height="100" rx="6" fill="#F4F4F4" stroke="#3B3535" stroke-width="1.5"/>
  <text x="120" y="48" text-anchor="middle" font-size="16" font-weight="bold">Web / Chat</text>
  <text x="120" y="68" text-anchor="middle" font-size="12">Superficie de chat</text>
  <text x="120" y="85" text-anchor="middle" font-size="11" fill="#6B6464">navegador · tareas puntuales</text>
  <text x="120" y="110" text-anchor="middle" font-size="11" font-style="italic" fill="#6B6464">donde estuvimos hasta ahora</text>

  <!-- Panel Claude Code -->
  <rect x="245" y="25" width="190" height="100" rx="6" fill="#F4F4F4" stroke="#3B3535" stroke-width="1.5"/>
  <text x="340" y="48" text-anchor="middle" font-size="16" font-weight="bold">Claude Code</text>
  <text x="340" y="68" text-anchor="middle" font-size="12">Terminal</text>
  <text x="340" y="85" text-anchor="middle" font-size="11" fill="#6B6464">para developers</text>

  <!-- Panel Cowork (focal) -->
  <rect x="465" y="25" width="190" height="100" rx="6" fill="#FDECEE" stroke="#DA1B2E" stroke-width="2.5"/>
  <text x="560" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#DA1B2E">Cowork</text>
  <text x="560" y="68" text-anchor="middle" font-size="12">GUI de escritorio</text>
  <text x="560" y="85" text-anchor="middle" font-size="11" fill="#6B6464">trabajo multipaso · archivos reales</text>
  <text x="560" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#DA1B2E">el foco de esta charla</text>

  <!-- Bracket: Code + Cowork share the same technical base -->
  <path d="M 340 125 V 143 H 560 V 125" fill="none" stroke="#3B3535" stroke-width="1.5"/>
  <line x1="450" y1="143" x2="450" y2="152" stroke="#3B3535" stroke-width="1.5"/>
  <text x="450" y="169" text-anchor="middle" font-size="13" font-weight="bold">Misma base técnica</text>
  <text x="450" y="186" text-anchor="middle" font-size="11" fill="#6B6464">archivos · Skills · MCP · loop de agente</text>

  <!-- Connectors to shared foundation -->
  <line x1="120" y1="125" x2="285" y2="222" stroke="#9A9393" stroke-width="1.5"/>
  <line x1="450" y1="192" x2="450" y2="222" stroke="#9A9393" stroke-width="1.5"/>

  <!-- Foundation box -->
  <rect x="200" y="222" width="280" height="58" rx="6" fill="#EAEAEA" stroke="#3B3535" stroke-width="1.5"/>
  <text x="340" y="248" text-anchor="middle" font-size="14" font-weight="bold">Mismos modelos Claude</text>
  <text x="340" y="266" text-anchor="middle" font-size="11" fill="#6B6464">el cimiento compartido de las tres caras</text>
</svg>
