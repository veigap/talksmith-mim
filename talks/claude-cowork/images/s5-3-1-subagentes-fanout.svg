<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Subagentes: delegar sub-tareas en paralelo</title>
  <desc>El agente principal reparte una tarea entre tres subagentes que corren en paralelo, cada uno con su propio contexto, y devuelve un resumen combinado.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0.5 1 L 9 5 L 0.5 9 z" fill="#8C8484"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="380" fill="#ffffff"/>

  <!-- agente principal -->
  <rect x="240" y="26" width="200" height="48" rx="6" fill="#F4F2F2" stroke="#B9B2B2" stroke-width="1.5"/>
  <text x="340" y="55" text-anchor="middle" font-size="15" font-weight="600" fill="#3B3535">agente principal</text>

  <!-- fan-out -->
  <line x1="340" y1="74" x2="340" y2="104" stroke="#8C8484" stroke-width="1.5"/>
  <line x1="152" y1="104" x2="528" y2="104" stroke="#8C8484" stroke-width="1.5"/>
  <line x1="152" y1="104" x2="152" y2="142" stroke="#8C8484" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="340" y1="104" x2="340" y2="142" stroke="#8C8484" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="528" y1="104" x2="528" y2="142" stroke="#8C8484" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- subagentes (banda focal: corren en paralelo) -->
  <rect x="68" y="142" width="168" height="76" rx="6" fill="#FDF2F3" stroke="#DA1B2E" stroke-width="1.75"/>
  <text x="152" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#3B3535">Subagente A</text>
  <text x="152" y="196" text-anchor="middle" font-size="12.5" fill="#DA1B2E">contexto propio</text>

  <rect x="256" y="142" width="168" height="76" rx="6" fill="#FDF2F3" stroke="#DA1B2E" stroke-width="1.75"/>
  <text x="340" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#3B3535">Subagente B</text>
  <text x="340" y="196" text-anchor="middle" font-size="12.5" fill="#DA1B2E">contexto propio</text>

  <rect x="444" y="142" width="168" height="76" rx="6" fill="#FDF2F3" stroke="#DA1B2E" stroke-width="1.75"/>
  <text x="528" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#3B3535">Subagente C</text>
  <text x="528" y="196" text-anchor="middle" font-size="12.5" fill="#DA1B2E">contexto propio</text>

  <!-- fan-in -->
  <line x1="152" y1="218" x2="152" y2="254" stroke="#8C8484" stroke-width="1.5"/>
  <line x1="340" y1="218" x2="340" y2="254" stroke="#8C8484" stroke-width="1.5"/>
  <line x1="528" y1="218" x2="528" y2="254" stroke="#8C8484" stroke-width="1.5"/>
  <line x1="152" y1="254" x2="528" y2="254" stroke="#8C8484" stroke-width="1.5"/>
  <line x1="340" y1="254" x2="340" y2="286" stroke="#8C8484" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- resumen combinado -->
  <rect x="230" y="286" width="220" height="48" rx="6" fill="#F4F2F2" stroke="#B9B2B2" stroke-width="1.5"/>
  <text x="340" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#3B3535">resumen combinado</text>

  <text x="340" y="357" text-anchor="middle" font-size="12.5" fill="#6E6666">un resumen, no la transcripción completa</text>
</svg>
