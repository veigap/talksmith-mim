  <desc>Un plugin reúne cuatro componentes que pueden combinarse para ampliar Cowork y Claude Code.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 5L0 10Z" fill="#756D6D"/></marker>
  </defs>
  <rect width="760" height="350" fill="#fff"/>
  <text x="380" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#756D6D">UN PLUGIN REUNE</text>
  <rect x="260" y="72" width="240" height="72" rx="12" fill="#F9E5E7" stroke="#DA1B2E" stroke-width="3"/>
  <text x="380" y="105" text-anchor="middle" font-size="24" font-weight="700" fill="#A41425">PLUGIN</text>
  <text x="380" y="128" text-anchor="middle" font-size="14" fill="#6B6262">un paquete de capacidades</text>
