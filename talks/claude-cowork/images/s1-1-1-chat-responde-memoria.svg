<!-- talksmith-ascii-sha256: 005d46777b8d6cdd4282113a2080dafcfd58d46710502dfebbc4f056caed67b5 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 674 256">
  <title>El chat responde de memoria</title>
  <desc>El chat, tal como viene de fábrica, responde de memoria: recuerda hasta su fecha de corte y no ve tus mails, calendario, archivos ni apps.</desc>

  <rect x="0" y="0" width="674" height="256" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- Título -->
    <text x="24" y="37" font-size="17" font-weight="bold" fill="#1F1E1E" letter-spacing="0.6">EL CHAT «COMO VIENE DE FÁBRICA»</text>

    <!-- Caja exterior: CHAT DE IA -->
    <rect x="25" y="63" width="378" height="168" rx="6" fill="#ffffff" stroke="#D8D4D4" stroke-width="2"/>
    <text x="214" y="92" font-size="15" font-weight="bold" fill="#1F1E1E" letter-spacing="0.8" text-anchor="middle">CHAT DE IA</text>

    <!-- Caja interior (foco): memoria de entrenamiento -->
    <rect x="49" y="109" width="330" height="72" rx="5" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
    <text x="214" y="137" font-size="13.5" font-weight="bold" fill="#DA1B2E" letter-spacing="0.4" text-anchor="middle">MEMORIA DE ENTRENAMIENTO</text>
    <text x="214" y="161" font-size="12" fill="#3B3535" text-anchor="middle">«foto congelada» hasta la fecha de corte</text>

    <text x="214" y="208" font-size="13" fill="#3B3535" text-anchor="middle">responde «de memoria» — no busca</text>

    <!-- Panel: lo que NO ve (fuera de la caja) -->
    <rect x="441" y="63" width="208" height="168" rx="6" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="2"/>
    <text x="456" y="92" font-size="13.5" font-weight="bold" fill="#1F1E1E">lo que NO ve:</text>

    <g stroke="#3B3535" stroke-width="1.8" stroke-linecap="round">
      <path d="M 458 109 L 466 117 M 466 109 L 458 117"/>
      <path d="M 458 132 L 466 140 M 466 132 L 458 140"/>
      <path d="M 458 155 L 466 163 M 466 155 L 458 163"/>
      <path d="M 458 178 L 466 186 M 466 178 L 458 186"/>
      <path d="M 458 201 L 466 209 M 466 201 L 458 209"/>
    </g>

    <g font-size="13" fill="#3B3535">
      <text x="476" y="117">noticias de hoy</text>
      <text x="476" y="140">tus mails</text>
      <text x="476" y="163">tu calendario</text>
      <text x="476" y="186">tus archivos</text>
      <text x="476" y="209">las apps de tu trabajo</text>
    </g>

  </g>
</svg>
