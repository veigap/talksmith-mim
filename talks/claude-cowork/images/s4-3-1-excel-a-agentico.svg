<!-- talksmith-ascii-sha256: 54edab82c7c4e9497e12b8c4313e8ea46f56e2f0314c55067280f9bfca62ba36 -->
<svg viewBox="0 0 708 313" xmlns="http://www.w3.org/2000/svg">
  <title>La nueva habilidad base</title>
  <desc>El gancho es la analogía del Excel, dicha con cuidado: durante unas cuatro décadas Excel fue la habilidad base del trabajo de oficina, y hay quien llama a las herramientas agénticas la nueva habilidad base.</desc>

  <rect x="0" y="0" width="708" height="313" fill="#ffffff"/>

  <!-- Title -->
  <text x="354" y="36" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle" letter-spacing="0.4">TRABAJO DE OFICINA — la herramienta de propósito general</text>

  <!-- Era labels -->
  <text x="154" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8A8080" text-anchor="middle" letter-spacing="0.8">~40 años</text>
  <text x="524" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DA1B2E" text-anchor="middle" letter-spacing="0.8">AHORA</text>

  <!-- Left panel — Excel -->
  <rect x="24" y="82" width="260" height="154" rx="4" fill="#F2F0F0" stroke="#BFB8B8" stroke-width="1.5"/>
  <text x="154" y="116" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#3B3535" text-anchor="middle" letter-spacing="0.5">EXCEL</text>
  <line x1="48" y1="130" x2="260" y2="130" stroke="#D6D0D0" stroke-width="1"/>
  <text x="154" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">lingua franca del</text>
  <text x="154" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">trabajo de oficina</text>
  <text x="154" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8A8080" text-anchor="middle">(sin programar)</text>

  <!-- Arrow -->
  <line x1="292" y1="159" x2="342" y2="159" stroke="#DA1B2E" stroke-width="3"/>
  <path d="M 340 149 L 358 159 L 340 169 Z" fill="#DA1B2E"/>

  <!-- Right panel — agentic tools -->
  <rect x="364" y="82" width="320" height="154" rx="4" fill="#FDF1F2" stroke="#DA1B2E" stroke-width="2"/>
  <text x="524" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535" text-anchor="middle" letter-spacing="0.5">HERRAMIENTAS AGÉNTICAS</text>
  <line x1="388" y1="130" x2="660" y2="130" stroke="#EFC9CD" stroke-width="1"/>

  <rect x="416" y="162" width="6" height="6" fill="#DA1B2E"/>
  <text x="430" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3B3535">Claude Code</text>
  <text x="530" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8A8080">developers</text>

  <rect x="416" y="194" width="6" height="6" fill="#DA1B2E"/>
  <text x="430" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3B3535">Cowork</text>
  <text x="530" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8A8080">knowledge worker</text>

  <!-- Footers -->
  <text x="154" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#8A8080" text-anchor="middle">la habilidad base de ayer</text>
  <text x="524" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DA1B2E" text-anchor="middle">la nueva habilidad base</text>

  <!-- Attribution -->
  <text x="354" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9A9090" text-anchor="middle" font-style="italic">«El nuevo Excel» — encuadre de analistas e industria</text>
</svg>
