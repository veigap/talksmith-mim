<!-- talksmith-ascii-sha256: b933e0996d52e2e9a12b1a21c93e50ecd7e8ff2408c685f0ca013a3093a1f279 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="t d">
  <title id="t">El primer conector: búsqueda web</title>
  <desc id="d">Acá se fija la distinción memoria vs información viva: la misma pregunta respondida de memoria (quizás vieja o inventada) o con búsqueda web (real, actual, con fuentes citadas).</desc>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>

  <!-- shared question pill -->
  <rect x="170" y="18" width="340" height="40" rx="20" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
  <text x="340" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B3535">La MISMA pregunta</text>
  <text x="340" y="51" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#3B3535">«¿Cuál es la última versión de X?»</text>

  <!-- fork lines from pill to panels -->
  <path d="M 300 58 L 180 88" stroke="#8A8484" stroke-width="1.6" fill="none"/>
  <path d="M 380 58 L 500 88" stroke="#8A8484" stroke-width="1.6" fill="none"/>
  <path d="M 180 88 l 3.5 -8.5 M 180 88 l 8.5 -3.8" stroke="#8A8484" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M 500 88 l -3.5 -8.5 M 500 88 l -8.5 -3.8" stroke="#8A8484" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- LEFT panel: de memoria -->
  <rect x="45" y="96" width="270" height="200" rx="8" fill="#F4F2F2" stroke="#8A8484" stroke-width="1.4"/>
  <text x="180" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B3535">DE MEMORIA</text>

  <rect x="70" y="138" width="220" height="46" rx="6" fill="#ffffff" stroke="#8A8484" stroke-width="1.2"/>
  <text x="180" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">Recuerda lo aprendido hasta</text>
  <text x="180" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">la fecha de entrenamiento</text>

  <path d="M 180 184 L 180 212" stroke="#8A8484" stroke-width="1.6" fill="none"/>
  <path d="M 180 212 l -4 -8 M 180 212 l 4 -8" stroke="#8A8484" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <rect x="70" y="216" width="220" height="60" rx="6" fill="#E6E3E3" stroke="#8A8484" stroke-width="1.2"/>
  <text x="180" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3B3535">Respuesta quizás vieja</text>
  <text x="180" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#3B3535">o inventada</text>

  <!-- RIGHT panel: con búsqueda web -->
  <rect x="365" y="96" width="270" height="200" rx="8" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>
  <text x="500" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B3535">CON BÚSQUEDA WEB</text>

  <rect x="390" y="138" width="220" height="46" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.2"/>
  <text x="500" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">Busca ahora en la web</text>
  <text x="500" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">(«buscando...»)</text>

  <path d="M 500 184 L 500 212" stroke="#DA1B2E" stroke-width="1.8" fill="none"/>
  <path d="M 500 212 l -4 -8 M 500 212 l 4 -8" stroke="#DA1B2E" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <rect x="390" y="216" width="220" height="60" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="500" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DA1B2E">Info REAL y actual</text>
  <text x="500" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DA1B2E">+ fuentes citadas</text>
</svg>
