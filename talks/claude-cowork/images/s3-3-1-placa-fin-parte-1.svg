<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 227" role="img" aria-labelledby="t d">
  <title id="t">Fin de la parte 1</title>
  <desc id="d">Marcar el corte del día: acá termina el primer bloque de la clase y conviene hacer la pausa.</desc>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="227" fill="#ffffff"/>

  <!-- plate frame -->
  <rect x="24" y="18" width="632" height="191" fill="#ffffff" stroke="#3B3535" stroke-width="2"/>

  <!-- top half: fin de la parte 1 (neutral, closing) -->
  <rect x="26" y="20" width="628" height="93" fill="#F2F0F0"/>
  <text x="60" y="62" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#3B3535" letter-spacing="1">FIN DE LA PARTE 1</text>
  <text x="60" y="92" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6E6666">el chat extendido</text>

  <!-- divider: the cut -->
  <line x1="24" y1="113.5" x2="656" y2="113.5" stroke="#3B3535" stroke-width="2"/>
  <rect x="308" y="103" width="64" height="21" fill="#3B3535"/>
  <text x="340" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">PAUSA</text>

  <!-- bottom half: parte 2 (accent, what comes next) -->
  <text x="60" y="157" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6E6666" letter-spacing="1">PARTE 2</text>
  <text x="60" y="192" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#DA1B2E">Claude Cowork</text>
  <!-- accent tick pointing forward -->
  <path d="M 596 160 L 620 174.5 L 596 189 Z" fill="#DA1B2E"/>
</svg>
