<svg viewBox="0 0 680 383" xmlns="http://www.w3.org/2000/svg">
  <title>Elegir no es siempre el más probable</title>
  <desc>La elección final es una ruleta ponderada por confianza: cada candidato ocupa una tajada proporcional, y a veces sale uno que no es el más probable.</desc>

  <rect x="0" y="0" width="680" height="383" fill="#ffffff"/>

  <!-- Left panel: candidates ordered by confidence -->
  <text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">Candidatos ordenados por confianza</text>

  <!-- azul: most probable, widest bar -->
  <text x="40" y="103" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">azul</text>
  <rect x="98" y="90" width="196" height="20" rx="3" fill="#C9CDD2"/>
  <text x="304" y="104" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6A737D">más probable</text>

  <!-- gris: middle -->
  <text x="40" y="149" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">gris</text>
  <rect x="98" y="136" width="98" height="20" rx="3" fill="#DA1B2E"/>

  <!-- claro: smallest -->
  <text x="40" y="195" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">claro</text>
  <rect x="98" y="182" width="56" height="20" rx="3" fill="#DCDFE3"/>

  <!-- connector note to the roulette -->
  <line x1="98" y1="236" x2="294" y2="236" stroke="#C9CDD2" stroke-width="1.4"/>
  <text x="98" y="258" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6A737D">cada barra = tamaño de su tajada</text>

  <!-- Divider -->
  <line x1="330" y1="70" x2="330" y2="330" stroke="#ECEEF0" stroke-width="1.4"/>

  <!-- Right panel: weighted roulette -->
  <text x="495" y="52" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">Ruleta ponderada</text>

  <!-- Donut slices (proportional to confidence) -->
  <!-- azul slice -->
  <path d="M 495.0 90.0 A 120 120 0 1 1 450.8 321.6 L 470.7 271.4 A 66 66 0 1 0 495.0 144.0 Z" fill="#C9CDD2" stroke="#ffffff" stroke-width="2.5"/>
  <!-- gris slice: the one the ball lands on (NOT the top) -->
  <path d="M 450.8 321.6 A 120 120 0 0 1 393.7 145.7 L 439.3 174.6 A 66 66 0 0 0 470.7 271.4 Z" fill="#DA1B2E" stroke="#ffffff" stroke-width="2.5"/>
  <!-- claro slice -->
  <path d="M 393.7 145.7 A 120 120 0 0 1 495.0 90.0 L 495.0 144.0 A 66 66 0 0 0 439.3 174.6 Z" fill="#DCDFE3" stroke="#ffffff" stroke-width="2.5"/>

  <!-- slice labels -->
  <text x="586" y="231" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535" text-anchor="middle">azul</text>
  <text x="405" y="243" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">gris</text>
  <text x="450" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535" text-anchor="middle">claro</text>

  <!-- center hub -->
  <circle cx="495" cy="210" r="66" fill="#ffffff"/>
  <text x="495" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6A737D" text-anchor="middle">el azar cae</text>
  <text x="495" y="221" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6A737D" text-anchor="middle">en una porción</text>

  <!-- Ball / pointer landing on the gris slice (starts at hub edge, clears the hub text) -->
  <line x1="432" y1="230" x2="378" y2="248" stroke="#1F1E1E" stroke-width="2"/>
  <circle cx="366" cy="252" r="9" fill="#1F1E1E"/>

  <!-- Callout: chosen one is not the top -->
  <text x="495" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DA1B2E" text-anchor="middle">salió &#8220;gris&#8221; &#8212; no el más probable</text>
</svg>
