<!-- talksmith-ascii-sha256: 4965b4abb8029904ea551bc5d3c8c443f08ca6b24a291ad20ee25fbb45025260 -->
<svg viewBox="0 0 786 588" xmlns="http://www.w3.org/2000/svg">
  <title>El loop completo de Atlas</title>
  <desc>Cierre integrador: recorrer el diagrama para que vean cómo cada pieza engancha con la siguiente.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#3B3535"/>
    </marker>
    <clipPath id="cA"><rect x="28" y="104" width="320" height="72" rx="8"/></clipPath>
    <clipPath id="cB"><rect x="28" y="204" width="320" height="72" rx="8"/></clipPath>
    <clipPath id="cC"><rect x="28" y="304" width="320" height="72" rx="8"/></clipPath>
    <clipPath id="cD"><rect x="28" y="472" width="320" height="88" rx="8"/></clipPath>
    <clipPath id="cG"><rect x="418" y="400" width="340" height="48" rx="8"/></clipPath>
  </defs>

  <rect x="0" y="0" width="786" height="588" fill="#ffffff"/>

  <!-- Disparador -->
  <rect x="93" y="28" width="190" height="48" rx="24" fill="#DA1B2E"/>
  <text x="188" y="49" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Lunes 8:00</text>
  <text x="188" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF">un solo disparador</text>

  <line x1="188" y1="76" x2="188" y2="104" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- Paso 1 · Schedule -->
  <rect x="28" y="104" width="320" height="72" rx="8" fill="#FFFFFF"/>
  <rect x="28" y="104" width="7" height="72" fill="#F2EEEE" clip-path="url(#cA)"/>
  <rect x="28" y="104" width="320" height="72" rx="8" fill="none" stroke="#D8D4D4" stroke-width="1"/>
  <text x="56" y="122" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.1" fill="#6A737D">SCHEDULE</text>
  <text x="56" y="144" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F1E1E">dispara el loop</text>
  <text x="56" y="162" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3B3535">y el resto cae solo</text>

  <line x1="188" y1="176" x2="188" y2="204" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- Paso 2 · buscar-accion -->
  <rect x="28" y="204" width="320" height="72" rx="8" fill="#FFFFFF"/>
  <rect x="28" y="204" width="7" height="72" fill="#F2EEEE" clip-path="url(#cB)"/>
  <rect x="28" y="204" width="320" height="72" rx="8" fill="none" stroke="#D8D4D4" stroke-width="1"/>
  <text x="56" y="222" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.1" fill="#6A737D">SKILL</text>
  <text x="56" y="244" font-family="'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="bold" fill="#1F1E1E">buscar-accion</text>
  <text x="56" y="262" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3B3535">Connector MT Newswires · web_fetch Yahoo</text>

  <line x1="348" y1="240" x2="418" y2="240" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="418" y="216" width="340" height="48" rx="8" fill="#F2EEEE"/>
  <text x="438" y="232" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.1" fill="#6A737D">GUARDA</text>
  <text x="438" y="252" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#1F1E1E">fuentes/</text>

  <line x1="188" y1="276" x2="188" y2="304" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- Paso 3 · reporte-semanal -->
  <rect x="28" y="304" width="320" height="72" rx="8" fill="#FFFFFF"/>
  <rect x="28" y="304" width="7" height="72" fill="#F2EEEE" clip-path="url(#cC)"/>
  <rect x="28" y="304" width="320" height="72" rx="8" fill="none" stroke="#D8D4D4" stroke-width="1"/>
  <text x="56" y="322" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.1" fill="#6A737D">SKILL</text>
  <text x="56" y="344" font-family="'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="bold" fill="#1F1E1E">reporte-semanal</text>
  <text x="56" y="362" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3B3535">consolida las fuentes de la semana</text>

  <line x1="348" y1="340" x2="418" y2="340" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="418" y="316" width="340" height="48" rx="8" fill="#F2EEEE"/>
  <text x="438" y="332" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.1" fill="#6A737D">ESCRIBE</text>
  <text x="438" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F1E1E">reporte .md en el Project</text>

  <!-- Bajada al paso 4, con derivación a Gmail -->
  <line x1="188" y1="376" x2="188" y2="472" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arw)"/>
  <circle cx="188" cy="424" r="3.5" fill="#3B3535"/>
  <line x1="188" y1="424" x2="418" y2="424" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="418" y="400" width="340" height="48" rx="8" fill="#FFFFFF"/>
  <rect x="418" y="400" width="7" height="48" fill="#F2EEEE" clip-path="url(#cG)"/>
  <rect x="418" y="400" width="340" height="48" rx="8" fill="none" stroke="#D8D4D4" stroke-width="1"/>
  <text x="446" y="416" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.1" fill="#6A737D">CONNECTOR</text>
  <text x="446" y="436" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#1F1E1E">Gmail · borrador para el equipo</text>

  <!-- Paso 4 · publicar-tablero -->
  <rect x="28" y="472" width="320" height="88" rx="8" fill="#FFFFFF"/>
  <rect x="28" y="472" width="7" height="88" fill="#F2EEEE" clip-path="url(#cD)"/>
  <rect x="28" y="472" width="320" height="88" rx="8" fill="none" stroke="#D8D4D4" stroke-width="1"/>
  <text x="56" y="498" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.1" fill="#6A737D">SKILL</text>
  <text x="56" y="520" font-family="'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="bold" fill="#1F1E1E">publicar-tablero</text>
  <text x="56" y="538" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3B3535">arma el tablero de la semana</text>

  <line x1="348" y1="516" x2="418" y2="516" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="418" y="472" width="340" height="88" rx="8" fill="#F2EEEE"/>
  <text x="438" y="491" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" letter-spacing="1.1" fill="#6A737D">PUBLICA</text>
  <text x="438" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1F1E1E">Live Artifact</text>
  <text x="438" y="529" font-family="'DejaVu Sans Mono', monospace" font-size="10.5" fill="#3B3535">pulso-semanal-FECHA</text>
  <text x="438" y="545" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6A737D">en la pestaña Live artifacts</text>
</svg>
