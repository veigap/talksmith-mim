<!-- talksmith-ascii-sha256: 5a4e1f5f13afdb77ca7b91153f39bc76dc2cb072efcbeeb44b0bddc6eeadae86 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392">
  <title>Tareas programadas desde el chat</title>
  <desc>Ciclo de una tarea programada: un disparador de calendario ejecuta la tarea, que usa los conectores para traer información y deja el resumen listo en el chat sin intervención del usuario.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B3535"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="392" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#3B3535">Tarea programada: se describe UNA vez</text>

  <!-- Clock trigger pill -->
  <rect x="95" y="60" width="190" height="42" rx="21" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
  <circle cx="124" cy="81" r="11" fill="#ffffff" stroke="#3B3535" stroke-width="1.8"/>
  <line x1="124" y1="81" x2="124" y2="74" stroke="#3B3535" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="124" y1="81" x2="130" y2="84" stroke="#3B3535" stroke-width="1.8" stroke-linecap="round"/>
  <text x="145" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">lunes 8:00 · cadencia</text>

  <!-- Arrow: clock -> task -->
  <line x1="190" y1="102" x2="190" y2="144" stroke="#3B3535" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Task box (focal, accented) -->
  <rect x="90" y="150" width="200" height="96" rx="8" fill="#FBE9EB" stroke="#DA1B2E" stroke-width="2.5"/>
  <text x="190" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">La tarea</text>
  <text x="190" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">corre sola</text>

  <!-- Connectors box -->
  <rect x="400" y="150" width="200" height="96" rx="8" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="500" y="188" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535">Conectores</text>
  <text x="500" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">mail · web · calendario</text>

  <!-- Arrow: task -> connectors -->
  <line x1="290" y1="178" x2="396" y2="178" stroke="#3B3535" stroke-width="2" marker-end="url(#arr)"/>
  <text x="345" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">usa conectores</text>

  <!-- Arrow: connectors -> task -->
  <line x1="400" y1="222" x2="294" y2="222" stroke="#3B3535" stroke-width="2" marker-end="url(#arr)"/>
  <text x="345" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">trae la info</text>

  <!-- Arrow: task -> result -->
  <line x1="190" y1="246" x2="190" y2="296" stroke="#3B3535" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Result banner -->
  <rect x="52" y="302" width="276" height="64" rx="8" fill="#F7F7F7" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="190" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535">Resumen listo en el chat</text>
  <text x="190" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">cada semana, sin pedirlo de nuevo</text>
</svg>
