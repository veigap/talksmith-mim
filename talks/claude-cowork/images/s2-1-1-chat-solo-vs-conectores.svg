<!-- talksmith-ascii-sha256: d358b92bbb2e1f12bd74e56f8fa47765fbad1dc3a9b2e7d3fb9a1d237e16cf18 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img">
  <title>Chat solo vs chat con conectores</title>
  <desc>Un conector saca al chat de su aislamiento y le da acceso a buscar en la web, leer tu mail, ver tu calendario y consultar tus documentos.</desc>

  <!-- white canvas -->
  <rect x="0" y="0" width="680" height="310" fill="#ffffff"/>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <!-- ===== Left: CHAT SOLO ===== -->
  <text x="120" y="44" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">CHAT SOLO</text>

  <rect x="35" y="66" width="170" height="150" rx="8" fill="#F2F0F0" stroke="#9A9494" stroke-width="1.5"/>
  <text x="120" y="106" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535" text-anchor="middle">Chat</text>
  <text x="120" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">Responde de memoria</text>
  <text x="120" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">de entrenamiento</text>

  <text x="120" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#9A9494" text-anchor="middle">(aislado)</text>

  <!-- ===== Right: CHAT CON CONECTORES ===== -->
  <text x="450" y="44" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#DA1B2E" text-anchor="middle">CHAT CON CONECTORES</text>

  <rect x="290" y="66" width="170" height="150" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="375" y="106" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535" text-anchor="middle">Chat</text>
  <text x="375" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">Consulta fuentes</text>
  <text x="375" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#DA1B2E" text-anchor="middle">reales</text>
  <text x="375" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">antes de responder</text>

  <text x="450" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#DA1B2E" text-anchor="middle">(conectado al mundo real)</text>

  <!-- arrows to sources -->
  <line x1="460" y1="84" x2="528" y2="84" stroke="#DA1B2E" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="460" y1="122" x2="528" y2="122" stroke="#DA1B2E" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="460" y1="160" x2="528" y2="160" stroke="#DA1B2E" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="460" y1="198" x2="528" y2="198" stroke="#DA1B2E" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- source boxes -->
  <rect x="532" y="68" width="118" height="32" rx="6" fill="#F2F0F0" stroke="#9A9494" stroke-width="1.5"/>
  <text x="591" y="89" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535" text-anchor="middle">Web</text>

  <rect x="532" y="106" width="118" height="32" rx="6" fill="#F2F0F0" stroke="#9A9494" stroke-width="1.5"/>
  <text x="591" y="127" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535" text-anchor="middle">Mail</text>

  <rect x="532" y="144" width="118" height="32" rx="6" fill="#F2F0F0" stroke="#9A9494" stroke-width="1.5"/>
  <text x="591" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535" text-anchor="middle">Calendario</text>

  <rect x="532" y="182" width="118" height="32" rx="6" fill="#F2F0F0" stroke="#9A9494" stroke-width="1.5"/>
  <text x="591" y="203" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535" text-anchor="middle">Documentos</text>

  <!-- divider between panels -->
  <line x1="248" y1="56" x2="248" y2="254" stroke="#D8D4D4" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- bottom takeaway -->
  <text x="340" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">Mismo chat: el conector le da acceso a información viva, no solo a su memoria.</text>
</svg>
