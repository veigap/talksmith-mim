<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>El loop completo de la mision Atlas</title>
  <desc>Cada lunes Schedule dispara la cadena: buscar datos, consolidar el reporte, dejar borrador en Gmail y publicar el tablero vivo.</desc>
  <rect x="0" y="0" width="680" height="620" fill="#ffffff"/>

  <!-- trigger (focal, red) -->
  <rect x="240" y="25" width="200" height="56" rx="6" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.5"/>
  <text x="340" y="50" text-anchor="middle" font-weight="bold" font-size="14" fill="#ffffff">Lunes 8:00</text>
  <text x="340" y="70" text-anchor="middle" font-size="12.5" fill="#ffffff">[Schedule] dispara</text>

  <line x1="340" y1="81" x2="340" y2="108" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="333,108 340,118 347,108" fill="#3B3535"/>

  <!-- step 1: buscar-accion -->
  <rect x="120" y="120" width="440" height="62" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
  <text x="340" y="146" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">[Skill buscar-accion]</text>
  <text x="340" y="168" text-anchor="middle" font-size="12" fill="#3B3535">Connector MT Newswires + web_fetch Yahoo &#8594; guarda fuentes/</text>

  <line x1="340" y1="182" x2="340" y2="209" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="333,209 340,219 347,209" fill="#3B3535"/>

  <!-- step 2: reporte-semanal -->
  <rect x="120" y="221" width="440" height="62" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
  <text x="340" y="247" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">[Skill reporte-semanal]</text>
  <text x="340" y="269" text-anchor="middle" font-size="12" fill="#3B3535">consolida &#8594; reporte .md en el Project</text>

  <!-- branch to Gmail -->
  <line x1="340" y1="283" x2="340" y2="320" stroke="#3B3535" stroke-width="1.5"/>
  <line x1="340" y1="320" x2="560" y2="320" stroke="#3B3535" stroke-width="1.5"/>
  <line x1="560" y1="320" x2="560" y2="345" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="553,345 560,355 567,345" fill="#3B3535"/>
  <rect x="430" y="357" width="220" height="56" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
  <text x="540" y="382" text-anchor="middle" font-weight="bold" font-size="13" fill="#1F1E1E">[Connector Gmail]</text>
  <text x="540" y="402" text-anchor="middle" font-size="12" fill="#3B3535">borrador para el equipo</text>

  <!-- main continues down -->
  <line x1="340" y1="320" x2="340" y2="409" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="333,409 340,419 347,409" fill="#3B3535"/>

  <!-- step 3: publicar-tablero (focal accent border) -->
  <rect x="60" y="421" width="430" height="76" rx="6" fill="#F9D2D6" stroke="#DA1B2E" stroke-width="2"/>
  <text x="275" y="450" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">[Skill publicar-tablero]</text>
  <text x="275" y="472" text-anchor="middle" font-size="12" fill="#3B3535">&#8594; Live Artifact pulso-semanal-FECHA</text>
  <text x="275" y="490" text-anchor="middle" font-size="11.5" fill="#6A737D">(pestana Live artifacts)</text>

  <!-- takeaway caption -->
  <text x="340" y="545" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#DA1B2E">Se delega una vez; corre solo cada lunes.</text>
</svg>
