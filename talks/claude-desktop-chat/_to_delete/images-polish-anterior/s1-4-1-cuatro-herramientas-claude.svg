<rect x="404" y="115" width="72" height="19" rx="9.5" fill="#F2EFEF" stroke="#8A8080" stroke-width="1"/>
<text x="440" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#6B6363">2.ª clase</text>

<rect x="534" y="24" width="152" height="120" rx="6" fill="#ffffff" stroke="#8A8080" stroke-width="1.5"/>
<text x="610" y="50" text-anchor="middle" font-size="15" font-weight="bold">Design</text>
