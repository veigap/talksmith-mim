<svg viewBox="0 0 900 338" xmlns="http://www.w3.org/2000/svg">
  <title>Instrucciones: el contrato</title>
  <desc>Conectar con el paradigma: en lugar de re-explicarle el contexto cada vez, lo escribís una vez y vale para todo el Project.</desc>

  <rect x="0" y="0" width="900" height="338" fill="#ffffff"/>

  <!-- card -->
  <rect x="32" y="28" width="836" height="282" rx="10" fill="#FAF9F9" stroke="#DCD7D7" stroke-width="1.5"/>

  <!-- header strip -->
  <path d="M 32,76 L 32,38 A 10,10 0 0 1 42,28 L 858,28 A 10,10 0 0 1 868,38 L 868,76 Z" fill="#F1EEEE"/>
  <line x1="32" y1="76" x2="868" y2="76" stroke="#DCD7D7" stroke-width="1.5"/>
  <text x="72" y="58" font-family="DejaVu Sans Mono, monospace" font-size="12" letter-spacing="1.5" fill="#8A8080">INSTRUCCIONES DEL PROJECT · ATLAS</text>

  <!-- opening paragraph -->
  <text x="72" y="110" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#3B3535" xml:space="preserve">Sos Atlas, el analista de mercado de un equipo de trabajo.</text>
  <text x="72" y="140" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#3B3535" xml:space="preserve">Preparás un pulso semanal para colegas NO técnicos (incluido el jefe),</text>
  <text x="72" y="170" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#3B3535" xml:space="preserve">que se lee en 2 minutos antes de la reunión de los lunes.</text>

  <!-- focal accent bar -->
  <rect x="56" y="194" width="3" height="88" fill="#DA1B2E"/>

  <!-- golden-rule bullet -->
  <text x="72" y="212" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#3B3535" xml:space="preserve">· </text>
  <text x="92.47" y="212" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="bold" fill="#DA1B2E" xml:space="preserve">REGLA DE ORO</text>
  <text x="215.29" y="212" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#3B3535" xml:space="preserve">: tus reportes son informativos y de uso interno.</text>
  <text x="72" y="242" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#3B3535" xml:space="preserve">  NUNCA son recomendaciones de inversión ni asesoramiento financiero.</text>
  <text x="72" y="272" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#3B3535" xml:space="preserve">  Siempre incluís esa aclaración al final.</text>
</svg>
