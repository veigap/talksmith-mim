<!-- talksmith-ascii-sha256: 78711b25b7743764e930967d979958fc56e2c966a227225f878f30c340760c36 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 376" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">
  <title>Amplificación, no reemplazo</title>
  <desc>Esta es la slide de la que cuelga todo el curso: los agentes toman la ejecución y las personas ganan agencia — no es un juego de suma cero.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A9090"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="728" height="376" fill="#ffffff"/>

  <!-- column headers -->
  <text x="164" y="34" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="1.6">AGENTES</text>
  <text x="564" y="34" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="1.6">PERSONAS</text>

  <!-- left panel -->
  <rect x="24" y="46" width="280" height="200" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <text x="164" y="82" text-anchor="middle" fill="#6B6060">toman más de la</text>
  <text x="164" y="108" text-anchor="middle" font-size="22" font-weight="bold">EJECUCIÓN</text>
  <line x1="48" y1="124" x2="280" y2="124" stroke="#C9C2C2" stroke-width="1.5"/>
  <circle cx="54" cy="141" r="2.5" fill="#9A9090"/>
  <text x="66" y="146">buscar datos</text>
  <circle cx="54" cy="167" r="2.5" fill="#9A9090"/>
  <text x="66" y="172">resumir</text>
  <circle cx="54" cy="193" r="2.5" fill="#9A9090"/>
  <text x="66" y="198">redactar</text>
  <circle cx="54" cy="219" r="2.5" fill="#9A9090"/>
  <text x="66" y="224">repetir</text>

  <!-- right panel -->
  <rect x="424" y="46" width="280" height="200" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <text x="564" y="82" text-anchor="middle" fill="#6B6060">ganan más</text>
  <text x="564" y="108" text-anchor="middle" font-size="22" font-weight="bold">AGENCIA</text>
  <line x1="448" y1="124" x2="680" y2="124" stroke="#C9C2C2" stroke-width="1.5"/>
  <circle cx="454" cy="154" r="2.5" fill="#9A9090"/>
  <text x="466" y="159">dirigir el trabajo</text>
  <circle cx="454" cy="180" r="2.5" fill="#9A9090"/>
  <text x="466" y="185">decidir</text>
  <circle cx="454" cy="206" r="2.5" fill="#9A9090"/>
  <text x="466" y="211">responder por el resultado</text>

  <!-- central arrow: focal element -->
  <line x1="316" y1="146" x2="388" y2="146" stroke="#DA1B2E" stroke-width="4" marker-end="url(#ar)"/>

  <!-- converging diagonals -->
  <line x1="164" y1="254" x2="250" y2="294" stroke="#9A9090" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="564" y1="254" x2="478" y2="294" stroke="#9A9090" stroke-width="2.5" marker-end="url(#ag)"/>

  <!-- footer -->
  <rect x="164" y="308" width="400" height="44" rx="22" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <text x="414" y="336" text-anchor="end" font-size="17">No es un juego de suma cero:</text>
  <text x="422" y="336" font-size="17" font-weight="bold" fill="#DA1B2E">crecen juntas</text>
</svg>
