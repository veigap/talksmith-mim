<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Predecir la próxima palabra</title>
  <desc>Para la frase incompleta "El cielo es ___", el modelo arma una lista de candidatos, cada uno con una barra de confianza. "azul" tiene la confianza más alta pero no es el único candidato. Luego el modelo elige uno, lo agrega al texto y repite.</desc>

  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <!-- Prompt -->
  <text x="380" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#3B3535">El cielo es ___</text>

  <!-- Panel -->
  <rect x="60" y="80" width="640" height="250" rx="6" fill="#ffffff" stroke="#CFC9C9" stroke-width="1.5"/>

  <!-- Column headers -->
  <text x="90" y="112" text-anchor="start" font-size="16" font-weight="bold" fill="#3B3535">candidato</text>
  <text x="300" y="112" text-anchor="start" font-size="16" font-weight="bold" fill="#3B3535">confianza</text>
  <line x1="90" y1="122" x2="670" y2="122" stroke="#CFC9C9" stroke-width="1"/>

  <!-- Row 1: azul (FOCAL, red, tallest) -->
  <text x="90" y="160" text-anchor="start" font-size="17" font-weight="bold" fill="#DA1B2E">azul</text>
  <rect x="300" y="146" width="300" height="20" rx="3" fill="#DA1B2E"/>
  <text x="614" y="161" text-anchor="start" font-size="14" font-weight="bold" fill="#DA1B2E">alta</text>

  <!-- Row 2: gris -->
  <text x="90" y="205" text-anchor="start" font-size="17" fill="#3B3535">gris</text>
  <rect x="300" y="191" width="130" height="20" rx="3" fill="#D8D3D3"/>

  <!-- Row 3: infinito -->
  <text x="90" y="250" text-anchor="start" font-size="17" fill="#3B3535">infinito</text>
  <rect x="300" y="236" width="85" height="20" rx="3" fill="#D8D3D3"/>

  <!-- Row 4: verde -->
  <text x="90" y="295" text-anchor="start" font-size="17" fill="#3B3535">verde</text>
  <rect x="300" y="281" width="45" height="20" rx="3" fill="#D8D3D3"/>

  <!-- Cycle -->
  <g font-size="16" fill="#3B3535">
    <rect x="95" y="380" width="150" height="44" rx="6" fill="#F2EFEF" stroke="#CFC9C9" stroke-width="1.5"/>
    <text x="170" y="407" text-anchor="middle" font-weight="bold">elige uno</text>

    <rect x="305" y="380" width="150" height="44" rx="6" fill="#F2EFEF" stroke="#CFC9C9" stroke-width="1.5"/>
    <text x="380" y="407" text-anchor="middle" font-weight="bold">lo agrega</text>

    <rect x="515" y="380" width="150" height="44" rx="6" fill="#F2EFEF" stroke="#CFC9C9" stroke-width="1.5"/>
    <text x="590" y="407" text-anchor="middle" font-weight="bold">repite</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B3535"/>
    </marker>
  </defs>
  <line x1="245" y1="402" x2="305" y2="402" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="455" y1="402" x2="515" y2="402" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- loop back arrow: repite -> elige -->
  <path d="M 590 424 L 590 448 L 170 448 L 170 424" fill="none" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>