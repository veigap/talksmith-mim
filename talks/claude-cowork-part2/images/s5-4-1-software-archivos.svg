<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>¿Qué es un software?</title>
  <desc>Una aplicación se entiende como una colección de archivos con funciones distintas y conectadas.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 5L0 10Z" fill="#756D6D"/></marker>
  </defs>
  <rect width="760" height="400" fill="#fff"/>
  <text x="380" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#756D6D">UNA APLICACION ES UN CONJUNTO DE ARCHIVOS</text>
  <rect x="241" y="76" width="278" height="78" rx="12" fill="#F9E5E7" stroke="#DA1B2E" stroke-width="3"/>
  <path d="M273 76V104H305V88H362L393 119V142H273Z" fill="#DA1B2E" opacity=".12"/>
  <path d="M273 76V104H305V88H362L393 119V142H273Z" fill="none" stroke="#DA1B2E" stroke-width="2"/>
  <text x="425" y="111" text-anchor="middle" font-size="23" font-weight="700" fill="#A41425">Aplicacion</text>
  <text x="425" y="134" text-anchor="middle" font-size="14" fill="#6B6262">la carpeta de trabajo</text>
  <path d="M380 154V188M110 188H650M110 188V220M290 188V220M470 188V220M650 188V220" fill="none" stroke="#756D6D" stroke-width="3" marker-end="url(#a)"/>
  <g>
    <rect x="30" y="231" width="160" height="110" rx="10" fill="#F4F1F1" stroke="#B8B0B0" stroke-width="2"/>
    <text x="110" y="267" text-anchor="middle" font-size="19" font-weight="700">Pantallas</text>
    <text x="110" y="292" text-anchor="middle" font-size="13">lo que ve y usa</text>
    <text x="110" y="311" text-anchor="middle" font-size="13">cada persona</text>
  </g>
  <g>
    <rect x="210" y="231" width="160" height="110" rx="10" fill="#F4F1F1" stroke="#B8B0B0" stroke-width="2"/>
    <text x="290" y="267" text-anchor="middle" font-size="19" font-weight="700">Reglas</text>
    <text x="290" y="292" text-anchor="middle" font-size="13">la logica que define</text>
    <text x="290" y="311" text-anchor="middle" font-size="13">cada comportamiento</text>
  </g>
  <g>
    <rect x="390" y="231" width="160" height="110" rx="10" fill="#F4F1F1" stroke="#B8B0B0" stroke-width="2"/>
    <text x="470" y="267" text-anchor="middle" font-size="19" font-weight="700">Datos</text>
    <text x="470" y="292" text-anchor="middle" font-size="13">informacion, ajustes</text>
    <text x="470" y="311" text-anchor="middle" font-size="13">y configuracion</text>
  </g>
  <g>
    <rect x="570" y="231" width="160" height="110" rx="10" fill="#F4F1F1" stroke="#B8B0B0" stroke-width="2"/>
    <text x="650" y="267" text-anchor="middle" font-size="19" font-weight="700">Pruebas</text>
    <text x="650" y="292" text-anchor="middle" font-size="13">comprobaciones para</text>
    <text x="650" y="311" text-anchor="middle" font-size="13">evitar regresiones</text>
  </g>
  <text x="380" y="375" text-anchor="middle" font-size="14" fill="#6B6262">Claude Code lee estas piezas antes de proponer cambios.</text>
</svg>
