<svg viewBox="0 0 800 275" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Las dos caras de la seguridad</title>
  <desc id="d">La seguridad tiene dos caras: protegerte de los que atacan, y cumplir lo que prometiste.</desc>

  <!-- canvas -->
  <rect x="0" y="0" width="800" height="275" fill="#ffffff"/>

  <!-- overline labels -->
  <text x="205" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#7A7373">LO QUE IMAGINAMOS</text>
  <text x="595" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" font-weight="bold" fill="#3B3535">LO QUE PASA DE VERDAD</text>

  <!-- left panel: Cara 1 (neutral) -->
  <rect x="40" y="50" width="330" height="136" rx="6" fill="#F2F0F0" stroke="#C9C4C4" stroke-width="1.5"/>
  <text x="205" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">CARA 1: EL ATAQUE</text>
  <line x1="70" y1="110" x2="340" y2="110" stroke="#C9C4C4" stroke-width="1"/>
  <text x="205" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">hackers, malware</text>
  <text x="205" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#7A7373">el candado roto</text>

  <!-- right panel: Cara 2 (focal, red accent) -->
  <rect x="430" y="50" width="330" height="136" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="3"/>
  <text x="595" y="74" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#DA1B2E">CARA 2: LAS PROMESAS</text>
  <text x="595" y="93" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#DA1B2E">INCUMPLIDAS</text>
  <line x1="460" y1="110" x2="730" y2="110" stroke="#DA1B2E" stroke-width="1"/>
  <text x="595" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3B3535">datos fuera de control</text>
  <text x="595" y="166" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#3B3535">la puerta abierta</text>

  <!-- left arrow (subdued) -->
  <line x1="205" y1="232" x2="205" y2="201" stroke="#9B9494" stroke-width="2"/>
  <polygon points="205,187 198,201 212,201" fill="#9B9494"/>
  <text x="205" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7A7373">casi todos miran acá</text>

  <!-- right arrow (dominant, red) -->
  <line x1="595" y1="232" x2="595" y2="201" stroke="#DA1B2E" stroke-width="5"/>
  <polygon points="595,186 584,201 606,201" fill="#DA1B2E"/>
  <text x="595" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#DA1B2E">la IA golpea acá</text>
</svg>
