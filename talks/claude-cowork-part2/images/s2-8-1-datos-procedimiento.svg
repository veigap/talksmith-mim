<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>Datos o procedimiento</title>
  <desc>El criterio comienza separando los datos auditables de los procedimientos reutilizables.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#6F6868"/></marker>
  </defs>
  <rect width="760" height="390" fill="#ffffff"/>
  <rect x="240" y="30" width="280" height="74" rx="16" fill="#F9E6E8" stroke="#DA1B2E" stroke-width="2.5"/>
  <text x="380" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#DA1B2E">¿DATO O PROCEDIMIENTO?</text>
  <text x="380" y="86" text-anchor="middle" font-size="14">La primera pregunta ordena el destino</text>
  <path d="M380 104 V140 M160 140 H600 M160 140 V180 M600 140 V180" fill="none" stroke="#6F6868" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="30" y="180" width="260" height="155" rx="14" fill="#F6F4F4" stroke="#807878" stroke-width="1.5"/>
  <text x="160" y="217" text-anchor="middle" font-size="19" font-weight="700">DATOS</text>
  <path d="M78 238 H242" stroke="#C9C2C2" stroke-width="1"/>
  <text x="160" y="264" text-anchor="middle" font-size="16" font-weight="700">ARCHIVOS (.md)</text>
  <text x="160" y="291" text-anchor="middle" font-size="15">Se citan y auditan</text>
  <text x="160" y="315" text-anchor="middle" font-size="13" fill="#6F6868">cifras, fuentes, decisiones</text>
  <rect x="470" y="180" width="260" height="155" rx="14" fill="#F6F4F4" stroke="#807878" stroke-width="1.5"/>
  <text x="600" y="217" text-anchor="middle" font-size="19" font-weight="700">PROCEDIMIENTO</text>
  <path d="M492 238 H708" stroke="#C9C2C2" stroke-width="1"/>
  <rect x="490" y="251" width="98" height="62" rx="9" fill="#ffffff" stroke="#807878" stroke-width="1"/>
  <text x="539" y="273" text-anchor="middle" font-size="11" font-weight="700">INSTRUCTIONS</text>
  <text x="539" y="294" text-anchor="middle" font-size="11">regla siempre activa</text>
  <rect x="612" y="251" width="98" height="62" rx="9" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.5"/>
  <text x="661" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#DA1B2E">SKILL</text>
  <text x="661" y="294" text-anchor="middle" font-size="11">proceso a demanda</text>
  <text x="600" y="324" text-anchor="middle" font-size="13" fill="#6F6868">reutilizable entre análisis</text>
</svg>
