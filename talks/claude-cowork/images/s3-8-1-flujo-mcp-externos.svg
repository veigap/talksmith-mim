<text x="121" y="78" text-anchor="middle" font-size="17" font-weight="bold">Chat / agente</text>
<text x="121" y="100" text-anchor="middle" font-size="13" fill="#6B6260">el usuario pide</text>
<text x="431" y="78" text-anchor="middle" font-size="17" font-weight="bold">Conector externo</text>
<text x="431" y="100" text-anchor="middle" font-size="13" fill="#6B6260">traduce el pedido</text>
<text x="826" y="78" text-anchor="middle" font-size="17" font-weight="bold">Servicio de la empresa</text>
<text x="826" y="100" text-anchor="middle" font-size="13" fill="#6B6260">CRM / ERP / base interna</text>
