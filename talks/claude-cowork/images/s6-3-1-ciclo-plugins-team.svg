<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Ciclo de vida de un plugin en cuenta Team</title>
  <desc>El Owner crea un marketplace privado, agrega plugins y fija preferencias; los miembros lo instalan y los updates se sincronizan.</desc>
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

  <!-- top row -->
  <!-- Owner (focal, red) -->
  <rect x="25" y="40" width="185" height="100" rx="6" fill="#F9D2D6" stroke="#DA1B2E" stroke-width="2"/>
  <text x="117" y="72" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#DA1B2E">OWNER crea un</text>
  <text x="117" y="92" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#DA1B2E">marketplace</text>
  <text x="117" y="112" text-anchor="middle" font-size="12.5" fill="#3B3535">privado (org)</text>

  <line x1="210" y1="90" x2="240" y2="90" stroke="#3B3535" stroke-width="2"/>
  <polygon points="240,83 254,90 240,97" fill="#3B3535"/>

  <!-- add plugins -->
  <rect x="255" y="40" width="185" height="100" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
  <text x="347" y="66" text-anchor="middle" font-weight="bold" font-size="13" fill="#1F1E1E">agrega plugins:</text>
  <text x="270" y="89" font-size="12" fill="#3B3535">&#183; subir ZIP</text>
  <text x="270" y="109" font-size="12" fill="#3B3535">&#183; sync repo GitHub</text>
  <text x="282" y="127" font-size="11" fill="#6A737D">(auto-actualiza)</text>

  <line x1="440" y1="90" x2="470" y2="90" stroke="#3B3535" stroke-width="2"/>
  <polygon points="470,83 484,90 470,97" fill="#3B3535"/>

  <!-- set install pref -->
  <rect x="485" y="40" width="185" height="100" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
  <text x="577" y="66" text-anchor="middle" font-weight="bold" font-size="13" fill="#1F1E1E">fija preferencia</text>
  <text x="577" y="86" text-anchor="middle" font-size="12" fill="#3B3535">de instalacion por</text>
  <text x="577" y="106" text-anchor="middle" font-size="12" fill="#3B3535">plugin (opcional /</text>
  <text x="577" y="124" text-anchor="middle" font-size="12" fill="#3B3535">auto / provisto)</text>

  <!-- vertical connector from top-right down to bottom row -->
  <line x1="577" y1="140" x2="577" y2="190" stroke="#3B3535" stroke-width="2"/>
  <polygon points="570,190 577,200 584,190" fill="#3B3535"/>

  <!-- bottom row -->
  <!-- distribute -->
  <rect x="355" y="215" width="300" height="100" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
  <text x="505" y="255" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">se DISTRIBUYE a los miembros</text>
  <text x="505" y="282" text-anchor="middle" font-size="12.5" fill="#3B3535">(aparece en chat Y en Cowork)</text>

  <line x1="355" y1="265" x2="325" y2="265" stroke="#3B3535" stroke-width="2"/>
  <polygon points="325,258 311,265 325,272" fill="#3B3535"/>

  <!-- members install -->
  <rect x="25" y="215" width="285" height="100" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
  <text x="167" y="248" text-anchor="middle" font-weight="bold" font-size="13.5" fill="#1F1E1E">MIEMBROS instalan / habilitan</text>
  <text x="167" y="272" text-anchor="middle" font-size="12.5" fill="#3B3535">desde el directorio de la org</text>
  <text x="167" y="294" text-anchor="middle" font-size="12" fill="#6A737D">(updates se sincronizan)</text>
</svg>
