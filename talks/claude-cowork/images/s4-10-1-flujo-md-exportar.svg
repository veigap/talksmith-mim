<svg viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg">
  <title>Trabajá en .md, exportá al final</title>
  <desc>El .md es tu mesa de trabajo; el .docx o PDF es la vitrina: las fuentes se convierten a .md, todas las idas y vueltas con la IA pasan ahí, y el entregable se genera una sola vez al final.</desc>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#7A7070"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="290" fill="#ffffff"/>

  <text x="350" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="#3B3535">Flujo de trabajo con la IA</text>

  <!-- column headers -->
  <text x="110" y="82" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7A7070">fuentes — lo que llega</text>
  <text x="350" y="82" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7A7070">trabajo — idas y vueltas con la IA</text>
  <text x="590" y="82" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7A7070">entrega — una vez, al final</text>

  <!-- left panel: fuentes -->
  <rect x="30" y="95" width="160" height="90" rx="4" fill="#F4F2F2" stroke="#D6D0D0" stroke-width="1.5"/>
  <text x="110" y="134" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#3B3535">.docx   ·   pdf</text>
  <text x="110" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#3B3535">mails   ·   webs</text>

  <!-- center panel: archivos .md (focal) -->
  <rect x="250" y="95" width="200" height="90" rx="4" fill="#FDF0F1" stroke="#DA1B2E" stroke-width="2"/>
  <text x="350" y="128" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" fill="#DA1B2E">ARCHIVOS .MD</text>
  <text x="350" y="150" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#3B3535">la IA lee, edita y crea mejor acá</text>
  <text x="350" y="167" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#7A7070">iterás acá, barato</text>

  <!-- right panel: entrega -->
  <rect x="510" y="95" width="160" height="90" rx="4" fill="#F4F2F2" stroke="#D6D0D0" stroke-width="1.5"/>
  <text x="590" y="134" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#3B3535">.docx   ·   .xlsx</text>
  <text x="590" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#3B3535">PDF   ·   slides</text>

  <!-- arrows -->
  <line x1="190" y1="140" x2="250" y2="140" stroke="#7A7070" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="450" y1="140" x2="510" y2="140" stroke="#7A7070" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- caption connectors -->
  <line x1="220" y1="140" x2="220" y2="199" stroke="#C9C2C2" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="480" y1="140" x2="480" y2="199" stroke="#C9C2C2" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- captions -->
  <text x="220" y="212" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#3B3535">«convertime esto a .md»</text>
  <text x="480" y="212" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#3B3535">«generame el entregable»</text>

  <!-- pocket rule -->
  <text x="350" y="256" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#7A7070">Regla de bolsillo: editá en .md, entregá en el formato final.</text>
</svg>
