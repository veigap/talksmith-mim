<!-- talksmith-ascii-sha256: 4965b4abb8029904ea551bc5d3c8c443f08ca6b24a291ad20ee25fbb45025260 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480">
  <title>El loop completo y la idea para llevarse</title>
  <desc>Cierre integrador: el diagrama del loop completo de la misión Atlas muestra cómo cada pieza de la charla se engancha con la siguiente, disparada por Schedule cada lunes a las 8:00.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8484"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="480" fill="#ffffff"/>

  <!-- Trigger (focal, red accent) -->
  <rect x="140" y="22" width="180" height="40" rx="20" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
  <text x="230" y="47" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#DA1B2E" text-anchor="middle">Lunes 8:00</text>
  <text x="336" y="47" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#DA1B2E" text-anchor="start">un solo disparador</text>

  <line x1="230" y1="62" x2="230" y2="84" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Schedule -->
  <rect x="100" y="88" width="260" height="52" rx="6" fill="#F2F0EF" stroke="#3B3535" stroke-width="1.5"/>
  <text x="230" y="109" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535" text-anchor="middle">Schedule</text>
  <text x="230" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">dispara la misión</text>

  <line x1="230" y1="140" x2="230" y2="162" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Skill buscar-accion -->
  <rect x="100" y="166" width="260" height="52" rx="6" fill="#F2F0EF" stroke="#3B3535" stroke-width="1.5"/>
  <text x="230" y="187" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535" text-anchor="middle">Skill · buscar-accion</text>
  <text x="230" y="206" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">elige la acción de la semana</text>

  <line x1="360" y1="192" x2="398" y2="192" stroke="#8A8484" stroke-width="1.5" marker-end="url(#arrg)"/>
  <rect x="402" y="168" width="256" height="48" rx="6" fill="#ffffff" stroke="#8A8484" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="530" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535" text-anchor="middle">Connector MT Newswires</text>
  <text x="530" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535" text-anchor="middle">+ web_fetch Yahoo → guarda fuentes/</text>

  <line x1="230" y1="218" x2="230" y2="240" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Skill reporte-semanal -->
  <rect x="100" y="244" width="260" height="52" rx="6" fill="#F2F0EF" stroke="#3B3535" stroke-width="1.5"/>
  <text x="230" y="265" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535" text-anchor="middle">Skill · reporte-semanal</text>
  <text x="230" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">consolida el reporte .md en el Project</text>

  <line x1="360" y1="270" x2="398" y2="270" stroke="#8A8484" stroke-width="1.5" marker-end="url(#arrg)"/>
  <rect x="402" y="246" width="256" height="48" rx="6" fill="#ffffff" stroke="#8A8484" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="530" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535" text-anchor="middle">Connector Gmail</text>
  <text x="530" y="283" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535" text-anchor="middle">deja borrador para el equipo</text>

  <line x1="230" y1="296" x2="230" y2="318" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Skill publicar-tablero -->
  <rect x="100" y="322" width="260" height="52" rx="6" fill="#F2F0EF" stroke="#3B3535" stroke-width="1.5"/>
  <text x="230" y="343" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535" text-anchor="middle">Skill · publicar-tablero</text>
  <text x="230" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">publica el tablero</text>

  <line x1="230" y1="374" x2="230" y2="396" stroke="#3B3535" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Live Artifact (output) -->
  <rect x="80" y="400" width="300" height="56" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="2"/>
  <text x="230" y="423" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3B3535" text-anchor="middle">Live Artifact · pulso-semanal-FECHA</text>
  <text x="230" y="442" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535" text-anchor="middle">pestaña Live artifacts</text>
</svg>
