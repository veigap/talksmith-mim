<text x="616" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#DA1B2E">MCP</text>
<text x="616" y="60" text-anchor="middle" font-size="13" fill="#6B6260">protocolo</text>
<path d="M826 132 L826 168 Q826 178 816 178 L131 178 Q121 178 121 168 L121 132" stroke="#8A807E" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<text x="474" y="196" text-anchor="middle" font-size="14" fill="#6B6260">devuelve la respuesta</text>
<text x="491" y="226" text-anchor="middle" font-size="14" fill="#6B6260">Todo conector externo habla el mismo protocolo: MCP.</text>
