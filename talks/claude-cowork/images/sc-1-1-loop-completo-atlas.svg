<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480">
  <title>El loop completo y la idea para llevarse</title>
  <desc>Cierre integrador: el loop completo de la misión Atlas, encadenando Schedule, Skills, Connectors y Live Artifacts a partir de un solo disparador.</desc>

  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="10" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C8585"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="10" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="480" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#3B3535">

    <!-- ===== Disparador (foco) ===== -->
    <rect x="90" y="16" width="160" height="30" rx="15" fill="#FCEBED" stroke="#DA1B2E" stroke-width="1.5"/>
    <text x="170" y="36" text-anchor="middle" font-size="14" font-weight="600" fill="#DA1B2E">Lunes 8:00</text>
    <text x="266" y="36" text-anchor="start" font-size="12.5" font-style="italic" fill="#DA1B2E">un solo disparador arranca todo el loop</text>

    <line x1="170" y1="46" x2="170" y2="80" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ah-red)"/>

    <!-- ===== Schedule ===== -->
    <rect x="40" y="80" width="260" height="56" rx="6" fill="#FCEBED" stroke="#DA1B2E" stroke-width="1.5"/>
    <text x="170" y="104" text-anchor="middle" font-size="15" font-weight="600" fill="#DA1B2E">Schedule</text>
    <text x="170" y="122" text-anchor="middle" font-size="11" fill="#B4515C">dispara el loop cada lunes</text>

    <line x1="170" y1="136" x2="170" y2="176" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>

    <!-- ===== buscar-accion ===== -->
    <rect x="40" y="176" width="260" height="56" rx="6" fill="#F4F2F2" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="170" y="200" text-anchor="middle" font-size="15" font-weight="600">Skill · buscar-accion</text>
    <text x="170" y="218" text-anchor="middle" font-size="11" fill="#7A7373">busca los datos crudos</text>

    <line x1="300" y1="204" x2="340" y2="204" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>

    <rect x="340" y="182" width="304" height="44" rx="22" fill="#FFFFFF" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="492" y="208" text-anchor="middle" font-size="11.5">Connector MT Newswires + web_fetch Yahoo</text>

    <line x1="644" y1="204" x2="684" y2="204" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>

    <rect x="684" y="176" width="196" height="56" rx="6" fill="#F4F2F2" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="782" y="200" text-anchor="middle" font-size="14" font-weight="600">fuentes/</text>
    <text x="782" y="218" text-anchor="middle" font-size="10.5" fill="#7A7373">datos crudos guardados</text>

    <line x1="170" y1="232" x2="170" y2="272" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>

    <!-- ===== reporte-semanal ===== -->
    <rect x="40" y="272" width="260" height="56" rx="6" fill="#F4F2F2" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="170" y="296" text-anchor="middle" font-size="15" font-weight="600">Skill · reporte-semanal</text>
    <text x="170" y="314" text-anchor="middle" font-size="11" fill="#7A7373">arma el informe</text>

    <line x1="300" y1="300" x2="684" y2="300" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>
    <text x="492" y="294" text-anchor="middle" font-size="11" font-style="italic" fill="#7A7373">consolida</text>

    <rect x="684" y="272" width="196" height="56" rx="6" fill="#F4F2F2" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="782" y="296" text-anchor="middle" font-size="14" font-weight="600">reporte .md</text>
    <text x="782" y="314" text-anchor="middle" font-size="10.5" fill="#7A7373">en el Project</text>

    <line x1="170" y1="328" x2="170" y2="400" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>

    <!-- ===== rama Gmail ===== -->
    <circle cx="170" cy="358" r="4" fill="#8C8585"/>
    <line x1="170" y1="358" x2="340" y2="358" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>

    <rect x="340" y="336" width="304" height="44" rx="22" fill="#FFFFFF" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="492" y="362" text-anchor="middle" font-size="11.5">Connector Gmail</text>

    <line x1="644" y1="358" x2="684" y2="358" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>

    <rect x="684" y="336" width="196" height="44" rx="6" fill="#F4F2F2" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="782" y="354" text-anchor="middle" font-size="13" font-weight="600">Borrador en Gmail</text>
    <text x="782" y="370" text-anchor="middle" font-size="10" fill="#7A7373">para el equipo</text>

    <!-- ===== publicar-tablero ===== -->
    <rect x="40" y="400" width="260" height="56" rx="6" fill="#F4F2F2" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="170" y="424" text-anchor="middle" font-size="15" font-weight="600">Skill · publicar-tablero</text>
    <text x="170" y="442" text-anchor="middle" font-size="11" fill="#7A7373">arma el tablero HTML</text>

    <line x1="300" y1="428" x2="684" y2="428" stroke="#8C8585" stroke-width="2" marker-end="url(#ah-grey)"/>
    <text x="492" y="422" text-anchor="middle" font-size="11" font-style="italic" fill="#7A7373">publica</text>

    <rect x="684" y="396" width="196" height="64" rx="6" fill="#F4F2F2" stroke="#B9B3B3" stroke-width="1.5"/>
    <text x="782" y="418" text-anchor="middle" font-size="14" font-weight="600">Live Artifact</text>
    <text x="782" y="433" text-anchor="middle" font-size="11" fill="#3B3535">pulso-semanal-FECHA</text>
    <text x="782" y="447" text-anchor="middle" font-size="9.5" fill="#7A7373">pestaña Live artifacts</text>

  </g>
</svg>
