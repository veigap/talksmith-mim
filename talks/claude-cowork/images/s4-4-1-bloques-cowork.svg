<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>El mapa de la charla: bloques que se apilan</title>
  <desc>Esta slide es el mapa de toda la sesión, actualizado al nuevo arco: ya no arranca en Cowork — arranca en el chat que todos usan.</desc>

  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>

  <!-- Banda transversal PLUGINS -->
  <rect x="10" y="10" width="800" height="520" rx="6" fill="#F9D2D6"/>
  <text x="410" y="27" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="bold" fill="#1F1E1E">PLUGINS — capa transversal: empaquetan y distribuyen todo esto</text>
  <rect x="40" y="44" width="740" height="462" rx="4" fill="#ffffff"/>

  <!-- Flecha de acumulación -->
  <line x1="58" y1="496" x2="58" y2="68" stroke="#D8D4D4" stroke-width="1.5"/>
  <polygon points="58,56 63,68 53,68" fill="#D8D4D4"/>

  <!-- Live Artifacts -->
  <rect x="76" y="60" width="230" height="42" rx="5" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="191" y="81" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#3B3535" letter-spacing="0.2">LIVE ARTIFACTS</text>
  <text x="322" y="81" dominant-baseline="central" font-size="11.5" font-style="italic" fill="#3B3535">“quiero compartir el resultado vivo”</text>

  <!-- Skills / Subagentes -->
  <rect x="76" y="116" width="230" height="42" rx="5" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="191" y="137" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#3B3535" letter-spacing="0.2">SKILLS / SUBAGENTES</text>
  <text x="322" y="137" dominant-baseline="central" font-size="11.5" font-style="italic" fill="#3B3535">“no repetir la misma tarea / delegar en paralelo”</text>
  <rect x="646" y="128" width="112" height="18" rx="4" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1"/>
  <text x="702" y="137" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#6A737D">avanzado · sección 5</text>

  <!-- Archivos .md -->
  <rect x="76" y="172" width="230" height="42" rx="5" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="191" y="193" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#3B3535" letter-spacing="0.2">ARCHIVOS .MD</text>
  <text x="322" y="193" dominant-baseline="central" font-size="11.5" font-style="italic" fill="#3B3535">“quiero que la IA entienda y edite mi material”</text>

  <!-- Instrucciones + Projects -->
  <rect x="76" y="228" width="230" height="42" rx="5" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="191" y="249" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#3B3535" letter-spacing="0.2">INSTRUCCIONES + PROJECTS</text>
  <text x="322" y="249" dominant-baseline="central" font-size="11.5" font-style="italic" fill="#3B3535">“contexto fijo, todo en un lugar”</text>

  <!-- Cowork — foco -->
  <rect x="76" y="284" width="230" height="42" rx="5" fill="#DA1B2E"/>
  <text x="191" y="305" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#FFFFFF" letter-spacing="0.2">COWORK: CARPETAS</text>
  <text x="322" y="305" dominant-baseline="central" font-size="11.5" font-style="italic" font-weight="bold" fill="#1F1E1E">“quiero que trabaje sobre mis archivos reales”</text>
  <rect x="672" y="296" width="86" height="18" rx="4" fill="#DA1B2E"/>
  <text x="715" y="305" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="bold" fill="#FFFFFF">ESTAMOS ACÁ</text>

  <!-- Tareas programadas -->
  <rect x="76" y="340" width="230" height="42" rx="5" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="191" y="361" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#6A737D" letter-spacing="0.2">TAREAS PROGRAMADAS</text>
  <text x="322" y="361" dominant-baseline="central" font-size="11.5" font-style="italic" fill="#6A737D">“quiero que corra solo”</text>
  <rect x="715" y="352" width="43" height="18" rx="4" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1"/>
  <text x="736" y="361" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#6A737D">visto</text>

  <!-- Conectores -->
  <rect x="76" y="396" width="230" height="42" rx="5" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="191" y="417" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#6A737D" letter-spacing="0.2">CONECTORES</text>
  <text x="322" y="417" dominant-baseline="central" font-size="11.5" font-style="italic" fill="#6A737D">“quiero info real de mis herramientas — y que actúe”</text>
  <rect x="715" y="408" width="43" height="18" rx="4" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1"/>
  <text x="736" y="417" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#6A737D">visto</text>

  <!-- El chat -->
  <rect x="76" y="452" width="230" height="42" rx="5" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="191" y="473" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="bold" fill="#6A737D" letter-spacing="0.2">EL CHAT</text>
  <text x="322" y="473" dominant-baseline="central" font-size="11.5" font-style="italic" fill="#6A737D">“respondía solo de memoria”</text>
  <rect x="715" y="464" width="43" height="18" rx="4" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1"/>
  <text x="736" y="473" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#6A737D">visto</text>

  <text x="410" y="548" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6A737D">Los bloques se apilan — cada uno suma autonomía. No es una escalera estricta: usás solo los que tu tarea necesita.</text>
</svg>
