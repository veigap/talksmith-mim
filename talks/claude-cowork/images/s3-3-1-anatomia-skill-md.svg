<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Anatomia de un SKILL.md</title>
  <desc>Un SKILL.md tiene un bloque de metadata YAML arriba y el cuerpo de instrucciones en Markdown abajo.</desc>
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>

  <!-- METADATA panel (focal, red strip) -->
  <rect x="40" y="40" width="430" height="170" rx="6" fill="#F2F2F2" stroke="#3B3535" stroke-width="1.5"/>
  <rect x="40" y="40" width="8" height="170" rx="4" fill="#DA1B2E"/>
  <g font-family="Courier New, monospace" font-size="13" fill="#000000">
    <text x="62" y="68">---</text>
    <text x="62" y="92">name: reporte-semanal</text>
    <text x="62" y="116">description: Genera el pulso semanal</text>
    <text x="62" y="138">  a partir de la carpeta fuentes/.</text>
    <text x="62" y="160">  Usar cuando pidan "reporte semanal".</text>
    <text x="62" y="184">---</text>
  </g>
  <!-- metadata side label -->
  <text x="500" y="110" font-weight="bold" font-size="13" fill="#DA1B2E">METADATA (YAML)</text>
  <text x="500" y="132" font-size="12" fill="#3B3535">"que es" +</text>
  <text x="500" y="150" font-size="12" fill="#3B3535">"cuando se activa"</text>

  <!-- BODY panel -->
  <rect x="40" y="240" width="430" height="190" rx="6" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
  <g font-family="Courier New, monospace" font-size="13" fill="#000000">
    <text x="62" y="270"># Reporte semanal</text>
    <text x="62" y="300">1. Lee TODOS los archivos de</text>
    <text x="62" y="320">   fuentes/ y consolida por empresa.</text>
    <text x="62" y="350">2. Genera el reporte con esta</text>
    <text x="62" y="370">   estructura exacta...</text>
    <text x="62" y="400">3. Guarda con sufijo -new (no pises</text>
    <text x="62" y="420">   el original).</text>
  </g>
  <!-- body side label -->
  <text x="500" y="320" font-weight="bold" font-size="13" fill="#1F1E1E">CUERPO (Markdown)</text>
  <text x="500" y="342" font-size="12" fill="#3B3535">"que hace":</text>
  <text x="500" y="360" font-size="12" fill="#3B3535">las instrucciones</text>
</svg>
