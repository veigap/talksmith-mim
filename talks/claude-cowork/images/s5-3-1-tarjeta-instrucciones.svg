<!-- talksmith-ascii-sha256: c42a998f3d5c7ca90f019904a52b9b708eb5d784de290bf5a7799c33203f4da9 -->
<svg viewBox="0 0 664 294" xmlns="http://www.w3.org/2000/svg">
  <title>Instrucciones: el contrato</title>
  <desc>Tarjeta con el texto literal de las Instrucciones del Project de Atlas: el contrato de trabajo escrito en lenguaje natural, con la regla de oro del disclaimer destacada.</desc>

  <defs>
    <clipPath id="cardClip">
      <rect x="20" y="20" width="624" height="254" rx="12"/>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="44" y="156" width="576" height="94" rx="8"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="664" height="294" fill="#ffffff"/>

  <!-- card -->
  <rect x="20" y="20" width="624" height="254" rx="12" fill="#ffffff"/>
  <g clip-path="url(#cardClip)">
    <rect x="20" y="20" width="7" height="254" fill="#F2EEEE"/>
  </g>
  <rect x="20" y="20" width="624" height="254" rx="12" fill="none" stroke="#D8D4D4" stroke-width="1.5"/>

  <!-- card header -->
  <text x="44" y="48" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F1E1E">Instrucciones del Project · Atlas</text>
  <text x="620" y="48" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6A737D">el contrato de trabajo</text>
  <line x1="44" y1="64" x2="620" y2="64" stroke="#D8D4D4" stroke-width="1"/>

  <!-- instruction body, verbatim -->
  <text xml:space="preserve" x="44" y="92" font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#3B3535">Sos Atlas, el analista de mercado de un equipo de trabajo.</text>
  <text xml:space="preserve" x="44" y="114" font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#3B3535">Preparás un pulso semanal para colegas NO técnicos (incluido el jefe),</text>
  <text xml:space="preserve" x="44" y="136" font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#3B3535">que se lee en 2 minutos antes de la reunión de los lunes.</text>

  <!-- golden rule block -->
  <rect x="44" y="156" width="576" height="94" rx="8" fill="#F7BBC1"/>
  <g clip-path="url(#panelClip)">
    <rect x="44" y="156" width="4" height="94" fill="#DA1B2E"/>
  </g>

  <text xml:space="preserve" x="64" y="186" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#DA1B2E">· REGLA DE ORO:</text>
  <text xml:space="preserve" x="189.23" y="186" font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#3B3535">tus reportes son informativos y de uso interno.</text>

  <text xml:space="preserve" x="79.65" y="208" font-family="'DejaVu Sans Mono', monospace" font-size="13" font-weight="bold" fill="#1F1E1E">NUNCA</text>
  <text xml:space="preserve" x="126.62" y="208" font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#3B3535">son recomendaciones de inversión ni asesoramiento financiero.</text>

  <text xml:space="preserve" x="64" y="230" font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#3B3535">  Siempre incluís esa aclaración al final.</text>
</svg>
