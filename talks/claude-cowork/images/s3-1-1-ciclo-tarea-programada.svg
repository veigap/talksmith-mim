<svg viewBox="0 0 660 322" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Tareas programadas desde el chat</title>
  <desc>Ciclo de una tarea programada: un reloj de cadencia (lunes 8:00) dispara la tarea, que corre sola, usa los conectores de mail, web y calendario para traer la informacion, y deja el resumen listo en el chat cada semana sin que se lo vuelva a pedir.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#6B6363"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="660" height="322" fill="#ffffff"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

    <!-- Title -->
    <text x="330" y="26" text-anchor="middle" font-size="14" font-weight="bold"
          letter-spacing="0.8" fill="#3B3535">TAREA PROGRAMADA · SE DESCRIBE UNA VEZ</text>

    <!-- Trigger pill -->
    <rect x="90" y="46" width="170" height="38" rx="19" fill="#ffffff" stroke="#C9C4C4" stroke-width="1.5"/>
    <text x="175" y="69.5" text-anchor="middle" font-size="13" fill="#3B3535">Reloj: lunes 8:00</text>

    <!-- Spine arrow 1 -->
    <line x1="175" y1="84" x2="175" y2="118" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ar-red)"/>

    <!-- Task box (focal) -->
    <rect x="80" y="118" width="190" height="80" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
    <text x="175" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#DA1B2E">La tarea corre sola</text>
    <text x="175" y="173" text-anchor="middle" font-size="11.5" fill="#6B6363">sin que la vuelvas a pedir</text>

    <!-- Connectors box -->
    <rect x="400" y="118" width="190" height="80" rx="8" fill="#F2F0F0" stroke="#C9C4C4" stroke-width="1.5"/>
    <text x="495" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B3535">Conectores</text>
    <text x="495" y="173" text-anchor="middle" font-size="11.5" fill="#6B6363">mail · web · calendario</text>

    <!-- Lateral loop -->
    <line x1="272" y1="145" x2="398" y2="145" stroke="#6B6363" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="335" y="137" text-anchor="middle" font-size="11" fill="#6B6363">usa conectores</text>

    <line x1="398" y1="175" x2="272" y2="175" stroke="#6B6363" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="335" y="191" text-anchor="middle" font-size="11" fill="#6B6363">trae la info</text>

    <!-- Spine arrow 2 -->
    <line x1="175" y1="198" x2="175" y2="232" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ar-red)"/>

    <!-- Result bar -->
    <rect x="80" y="232" width="510" height="60" rx="8" fill="#F2F0F0" stroke="#C9C4C4" stroke-width="1.5"/>
    <text x="335" y="256" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3B3535">Resumen listo en tu chat, cada semana</text>
    <text x="335" y="276" text-anchor="middle" font-size="11.5" fill="#6B6363">sin que lo pidas de nuevo</text>

  </g>
</svg>
