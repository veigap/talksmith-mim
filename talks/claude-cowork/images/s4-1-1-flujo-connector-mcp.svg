<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Flujo de una llamada a un Connector via MCP</title>
  <desc>El agente Cowork pide datos, el Connector traduce via el protocolo MCP y el servicio externo responde.</desc>
  <rect x="0" y="0" width="680" height="260" fill="#ffffff"/>

  <!-- Cowork panel -->
  <rect x="30" y="80" width="160" height="90" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
  <text x="110" y="118" text-anchor="middle" font-weight="bold" font-size="16" fill="#1F1E1E">Cowork</text>
  <text x="110" y="142" text-anchor="middle" font-size="12.5" fill="#3B3535">(agente)</text>

  <!-- Connector panel (focal, red) -->
  <rect x="260" y="80" width="160" height="90" rx="6" fill="#F9D2D6" stroke="#DA1B2E" stroke-width="2"/>
  <text x="340" y="118" text-anchor="middle" font-weight="bold" font-size="16" fill="#DA1B2E">Connector</text>
  <text x="340" y="142" text-anchor="middle" font-size="12.5" fill="#3B3535">(1 clic)</text>

  <!-- External service panel -->
  <rect x="490" y="80" width="160" height="90" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
  <text x="570" y="113" text-anchor="middle" font-weight="bold" font-size="15" fill="#1F1E1E">Servicio ext.</text>
  <text x="570" y="138" text-anchor="middle" font-size="12.5" fill="#3B3535">Gmail / MT News</text>

  <!-- forward arrows -->
  <line x1="190" y1="108" x2="252" y2="108" stroke="#3B3535" stroke-width="2"/>
  <polygon points="252,101 266,108 252,115" fill="#3B3535"/>
  <text x="221" y="96" text-anchor="middle" font-size="11" fill="#6A737D">pide datos</text>

  <line x1="420" y1="108" x2="482" y2="108" stroke="#DA1B2E" stroke-width="2"/>
  <polygon points="482,101 496,108 482,115" fill="#DA1B2E"/>
  <text x="451" y="96" text-anchor="middle" font-size="11" fill="#DA1B2E">MCP</text>

  <!-- return arrows -->
  <line x1="496" y1="150" x2="424" y2="150" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="424,143 410,150 424,157" fill="#3B3535"/>
  <line x1="266" y1="150" x2="194" y2="150" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="194,143 180,150 194,157" fill="#3B3535"/>
  <text x="340" y="195" text-anchor="middle" font-size="11.5" fill="#6A737D">devuelve datos</text>

  <text x="451" y="62" text-anchor="middle" font-size="11" fill="#6A737D">protocolo</text>
</svg>
