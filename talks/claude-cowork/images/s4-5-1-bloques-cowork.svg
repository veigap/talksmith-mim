<svg viewBox="0 0 804 605" xmlns="http://www.w3.org/2000/svg">
  <title>Bloques que se apilan</title>
  <desc>El mapa de toda la sesión: arranca en el chat que ya usan, no en Cowork.</desc>

  <rect x="0" y="0" width="804" height="605" fill="#ffffff"/>

  <!-- ===== Banda transversal PLUGINS ===== -->
  <rect x="24" y="24" width="756" height="529" rx="10" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="44" y="32" width="96" height="26" rx="13" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="92" y="49" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F1E1E" text-anchor="middle">PLUGINS</text>
  <text x="152" y="49" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">capa transversal: empaquetan y distribuyen la pila entera (sección 7)</text>

  <!-- ===== Bloque 8 (cima) — Live Artifacts ===== -->
  <rect x="44" y="84" width="252" height="48" rx="4" fill="#D8D4D4"/>
  <rect x="50" y="84" width="246" height="48" rx="4" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="66" y="113" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F1E1E">Live Artifacts</text>
  <text x="316" y="113" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">“quiero compartir el resultado vivo”</text>

  <!-- ===== Bloque 7 — Skills / Subagentes ===== -->
  <rect x="44" y="141" width="252" height="48" rx="4" fill="#D8D4D4"/>
  <rect x="50" y="141" width="246" height="48" rx="4" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="66" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F1E1E">Skills / Subagentes</text>
  <text x="316" y="163" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">“no quiero repetir la tarea / delegar en paralelo”</text>
  <text x="316" y="179" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6A737D">(avanzado, sección 7)</text>

  <!-- ===== Bloque 6 — Archivos .md ===== -->
  <rect x="44" y="198" width="252" height="48" rx="4" fill="#D8D4D4"/>
  <rect x="50" y="198" width="246" height="48" rx="4" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="66" y="227" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F1E1E">Archivos .md</text>
  <text x="316" y="227" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">“quiero que la IA entienda mi material”</text>

  <!-- ===== Bloque 5 — Instrucciones + Projects ===== -->
  <rect x="44" y="255" width="252" height="48" rx="4" fill="#D8D4D4"/>
  <rect x="50" y="255" width="246" height="48" rx="4" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="66" y="284" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F1E1E">Instrucciones + Projects</text>
  <text x="316" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">“contexto fijo + todo en un lugar”</text>

  <!-- ===== Bloque 4 — Cowork: carpetas (foco: estamos acá) ===== -->
  <rect x="44" y="312" width="252" height="48" rx="4" fill="#DA1B2E"/>
  <rect x="50" y="312" width="246" height="48" rx="4" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="66" y="341" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#DA1B2E">Cowork: carpetas</text>
  <text x="316" y="341" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">“quiero que trabaje sobre mis archivos”</text>
  <path d="M 672 336 H 654" stroke="#DA1B2E" stroke-width="2" fill="none"/>
  <path d="M 645 336 L 655 331 L 655 341 Z" fill="#DA1B2E"/>
  <text x="760" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#DA1B2E" text-anchor="end">ESTAMOS ACÁ</text>

  <!-- ===== Bloque 3 — Tareas programadas ===== -->
  <rect x="44" y="369" width="252" height="48" rx="4" fill="#D8D4D4"/>
  <rect x="50" y="369" width="246" height="48" rx="4" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="66" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F1E1E">Tareas programadas</text>
  <text x="316" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">“quiero que corra solo”</text>
  <rect x="706" y="383" width="54" height="20" rx="10" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="733" y="397" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6A737D" text-anchor="middle">(visto)</text>

  <!-- ===== Bloque 2 — Conectores ===== -->
  <rect x="44" y="426" width="252" height="48" rx="4" fill="#D8D4D4"/>
  <rect x="50" y="426" width="246" height="48" rx="4" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="66" y="455" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F1E1E">Conectores</text>
  <text x="316" y="455" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">“quiero info real + que actúe”</text>
  <rect x="706" y="440" width="54" height="20" rx="10" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="733" y="454" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6A737D" text-anchor="middle">(visto)</text>

  <!-- ===== Bloque 1 (base) — El chat ===== -->
  <rect x="44" y="483" width="252" height="48" rx="4" fill="#D8D4D4"/>
  <rect x="50" y="483" width="246" height="48" rx="4" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="66" y="512" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1F1E1E">El chat</text>
  <text x="316" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">“respondía solo de memoria”</text>
  <rect x="706" y="497" width="54" height="20" rx="10" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.2"/>
  <text x="733" y="511" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6A737D" text-anchor="middle">(visto)</text>

  <!-- ===== Pie ===== -->
  <text x="24" y="578" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">Los bloques se apilan (cada uno suma autonomía); PLUGINS los distribuye a todos.</text>
</svg>
