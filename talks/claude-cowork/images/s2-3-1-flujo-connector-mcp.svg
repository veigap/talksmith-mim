<!-- talksmith-ascii-sha256: da7d6565a0f68eef83c25bc59dddf75dbe492a2f01f1fc651f44b2ccb0f7863a -->
<svg viewBox="0 0 810 202" xmlns="http://www.w3.org/2000/svg">
  <title>Conectores y MCP: las «manos» del chat</title>
  <desc>Desarmar el miedo: conectar un servicio externo le da «manos» al chat, sin programar nada.</desc>

  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A7373"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="810" height="202" fill="#ffffff"/>

  <!-- Box 1 — Chat / agente -->
  <rect x="30" y="30" width="150" height="100" rx="6"
        fill="#F5F3F3" stroke="#C9C4C4" stroke-width="1.5"/>
  <text x="105" y="75" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">Chat</text>
  <text x="105" y="97" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7A7373">agente de IA</text>

  <!-- Box 2 — Connector (focal) -->
  <rect x="310" y="30" width="160" height="100" rx="6"
        fill="#FCEEF0" stroke="#DA1B2E" stroke-width="2"/>
  <text x="390" y="75" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#DA1B2E">Connector</text>
  <text x="390" y="97" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7A7373">un clic</text>

  <!-- Box 3 — Servicio externo -->
  <rect x="600" y="30" width="180" height="100" rx="6"
        fill="#F5F3F3" stroke="#C9C4C4" stroke-width="1.5"/>
  <text x="690" y="75" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535">Servicio externo</text>
  <text x="690" y="97" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7A7373">Gmail / Calendar</text>

  <!-- Gap 1 — chat to connector -->
  <text x="245" y="56" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535">pide datos</text>
  <line x1="186" y1="68" x2="304" y2="68"
        stroke="#7A7373" stroke-width="1.8" marker-end="url(#ah-grey)"/>
  <line x1="304" y1="102" x2="186" y2="102"
        stroke="#7A7373" stroke-width="1.8" marker-end="url(#ah-grey)"/>
  <text x="245" y="120" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7A7373">devuelve datos</text>

  <!-- Gap 2 — connector to servicio, vía MCP -->
  <text x="535" y="48" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7A7373">protocolo</text>
  <line x1="476" y1="68" x2="500" y2="68" stroke="#DA1B2E" stroke-width="1.8"/>
  <line x1="570" y1="68" x2="594" y2="68"
        stroke="#DA1B2E" stroke-width="1.8" marker-end="url(#ah-red)"/>
  <rect x="504" y="55" width="62" height="26" rx="13"
        fill="#ffffff" stroke="#DA1B2E" stroke-width="1.6"/>
  <text x="535" y="72" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#DA1B2E">MCP</text>
  <line x1="594" y1="102" x2="476" y2="102"
        stroke="#7A7373" stroke-width="1.8" marker-end="url(#ah-grey)"/>

  <!-- Caption -->
  <text x="405" y="168" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535">El conector le da «manos» al chat; MCP es el estándar que lo hace posible.</text>
</svg>
