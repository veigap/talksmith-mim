<!-- talksmith-ascii-sha256: e6a7b0b470b39438297c002f4df7e7868cdce768aed876ce6666a78c7ec8f4f5 -->
<svg viewBox="0 0 692 372" xmlns="http://www.w3.org/2000/svg">
  <title>El primer conector: búsqueda web</title>
  <desc>La misma pregunta por dos caminos: de memoria el chat responde hasta su fecha de corte y puede estar viejo o inventado; con búsqueda web trae información real y actual con fuentes citadas.</desc>

  <defs>
    <clipPath id="panelIzq"><rect x="24" y="132" width="300" height="216" rx="6"/></clipPath>
    <clipPath id="panelDer"><rect x="368" y="132" width="300" height="216" rx="6"/></clipPath>
  </defs>

  <rect x="0" y="0" width="692" height="372" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#3B3535">

    <!-- Pregunta compartida -->
    <rect x="156" y="24" width="380" height="40" rx="20" fill="#F4F2F2" stroke="#B9B2B2" stroke-width="1.5"/>
    <text x="346" y="49" font-size="14" text-anchor="middle" fill="#3B3535">la MISMA pregunta: «¿última versión de X?»</text>

    <!-- Bifurcación -->
    <g stroke="#8A8080" stroke-width="1.5" fill="none">
      <path d="M346 60 L346 84"/>
      <path d="M174 84 L518 84"/>
      <path d="M174 84 L174 124"/>
    </g>
    <path d="M518 84 L518 124" stroke="#DA1B2E" stroke-width="1.5" fill="none"/>
    <path d="M169 124 L179 124 L174 132 Z" fill="#8A8080"/>
    <path d="M513 124 L523 124 L518 132 Z" fill="#DA1B2E"/>

    <!-- ============ Panel izquierdo: DE MEMORIA ============ -->
    <g clip-path="url(#panelIzq)">
      <rect x="24" y="132" width="300" height="216" fill="#ffffff"/>
      <rect x="24" y="132" width="300" height="28" fill="#EDEAEA"/>
      <path d="M24 160 L324 160" stroke="#B9B2B2" stroke-width="1.5" fill="none"/>
    </g>
    <text x="174" y="152" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.1" fill="#3B3535">DE MEMORIA</text>

    <rect x="40" y="174" width="268" height="66" rx="4" fill="#F4F2F2" stroke="#B9B2B2" stroke-width="1.2"/>
    <text x="174" y="202" font-size="14" text-anchor="middle" fill="#3B3535">entrenamiento</text>
    <text x="174" y="222" font-size="14" text-anchor="middle" fill="#3B3535">hasta la fecha de corte</text>

    <path d="M174 240 L174 256" stroke="#8A8080" stroke-width="1.5" fill="none"/>
    <path d="M169 256 L179 256 L174 264 Z" fill="#8A8080"/>

    <rect x="40" y="264" width="268" height="68" rx="4" fill="#F4F2F2" stroke="#B9B2B2" stroke-width="1.2"/>
    <text x="174" y="292" font-size="15" font-weight="bold" text-anchor="middle" fill="#3B3535">respuesta</text>
    <text x="174" y="314" font-size="13" text-anchor="middle" fill="#8A8080">quizás vieja o inventada</text>

    <rect x="24" y="132" width="300" height="216" rx="6" fill="none" stroke="#B9B2B2" stroke-width="1.5"/>

    <!-- ============ Panel derecho: CON BÚSQUEDA WEB ============ -->
    <g clip-path="url(#panelDer)">
      <rect x="368" y="132" width="300" height="216" fill="#ffffff"/>
      <rect x="368" y="132" width="300" height="28" fill="#FCEEF0"/>
      <path d="M368 160 L668 160" stroke="#DA1B2E" stroke-width="1.5" fill="none"/>
    </g>
    <text x="518" y="152" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.1" fill="#DA1B2E">CON BÚSQUEDA WEB</text>

    <rect x="384" y="174" width="268" height="66" rx="4" fill="#F4F2F2" stroke="#B9B2B2" stroke-width="1.2"/>
    <text x="518" y="202" font-size="14" text-anchor="middle" fill="#3B3535">busca AHORA</text>
    <text x="518" y="222" font-size="14" text-anchor="middle" fill="#3B3535">en la web</text>

    <path d="M518 240 L518 256" stroke="#DA1B2E" stroke-width="1.5" fill="none"/>
    <path d="M513 256 L523 256 L518 264 Z" fill="#DA1B2E"/>

    <rect x="384" y="264" width="268" height="68" rx="4" fill="#FCEEF0" stroke="#DA1B2E" stroke-width="1.5"/>
    <text x="518" y="292" font-size="15" font-weight="bold" text-anchor="middle" fill="#DA1B2E">info REAL y actual</text>
    <text x="518" y="314" font-size="13" text-anchor="middle" fill="#3B3535">+ fuentes citadas</text>

    <rect x="368" y="132" width="300" height="216" rx="6" fill="none" stroke="#DA1B2E" stroke-width="1.5"/>

  </g>
</svg>
