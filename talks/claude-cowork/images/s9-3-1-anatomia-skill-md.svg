<!-- talksmith-ascii-sha256: 308199f48343fbd7c8a53a4442607f2cdf68adedb494a1d944d3c43dcb5fcdd2 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" role="img" aria-labelledby="t d">
  <title id="t">Anatomía de un SKILL.md</title>
  <desc id="d">Slide-ejemplo que aterriza dos cosas a la vez: la anatomía de una Skill y el beat de archivos .md con metadata.</desc>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="318" fill="#ffffff"/>

  <!-- file card -->
  <g>
    <!-- file title tab -->
    <text x="30" y="26" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" font-weight="bold" fill="#3B3535">SKILL.md</text>

    <!-- metadata zone (tinted) -->
    <rect x="24" y="36" width="440" height="118" fill="#F2F0F0" stroke="#3B3535" stroke-width="1.5"/>
    <!-- body zone (white) -->
    <rect x="24" y="154" width="440" height="140" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>

    <!-- metadata text -->
    <g font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" fill="#3B3535">
      <text x="40" y="56">---</text>
      <text x="40" y="74">name: reporte-semanal</text>
      <g fill="#DA1B2E">
        <text x="40" y="92">description: Genera el pulso semanal de mercado</text>
        <text x="54" y="108">a partir de la carpeta fuentes/ de la semana.</text>
        <text x="54" y="124">Usar cuando pidan "reporte semanal".</text>
      </g>
      <text x="40" y="142">---</text>
    </g>

    <!-- body text -->
    <g font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="11.5" fill="#3B3535">
      <text x="40" y="174"># Reporte semanal</text>
      <text x="40" y="198">1. Leé TODOS los archivos de fuentes/</text>
      <text x="57" y="214">y consolidá por empresa.</text>
      <text x="40" y="232">2. Generá el reporte con esta estructura</text>
      <text x="57" y="248">exacta...</text>
      <text x="40" y="266">3. Guardá con sufijo -new (no pises</text>
      <text x="57" y="282">el original).</text>
    </g>
  </g>

  <!-- side labels -->
  <!-- metadata label -->
  <g>
    <line x1="464" y1="95" x2="500" y2="95" stroke="#3B3535" stroke-width="1.5"/>
    <text x="508" y="78" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B3535">Metadata (YAML)</text>
    <text x="508" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">qué es · cuándo se activa</text>
    <text x="508" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#DA1B2E">la description dispara</text>
    <text x="508" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#DA1B2E">la Skill (semántico)</text>
  </g>

  <!-- body label -->
  <g>
    <line x1="464" y1="224" x2="500" y2="224" stroke="#3B3535" stroke-width="1.5"/>
    <text x="508" y="216" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B3535">Cuerpo (Markdown)</text>
    <text x="508" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">qué hace: los pasos</text>
    <text x="508" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">que sigue el agente</text>
  </g>
</svg>
