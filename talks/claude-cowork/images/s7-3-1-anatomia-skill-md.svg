<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <title>Anatomía de un SKILL.md</title>
  <desc>Un archivo SKILL.md partido en dos zonas: arriba el header YAML con name y description, abajo el cuerpo de instrucciones en Markdown.</desc>

  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#DA1B2E"/>
    </marker>
    <marker id="arrInk" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B3535"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <!-- ===== file card ===== -->
  <rect x="40" y="34" width="580" height="352" fill="#ffffff" stroke="#3B3535" stroke-width="1.6"/>

  <!-- filename bar -->
  <rect x="40" y="34" width="580" height="36" fill="#F5F2F2"/>
  <line x1="40" y1="70" x2="620" y2="70" stroke="#3B3535" stroke-width="1.2"/>
  <text x="60" y="57" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" font-weight="bold" fill="#3B3535">SKILL.md</text>

  <!-- metadata zone -->
  <rect x="40" y="70" width="580" height="158" fill="#FDF2F3"/>
  <rect x="50" y="128" width="3" height="62" fill="#DA1B2E"/>
  <text x="62" y="96" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#3B3535">---</text>
  <text x="62" y="118" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#3B3535">name: reporte-semanal</text>
  <text x="62" y="140" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#DA1B2E">description: Genera el pulso semanal de mercado a partir</text>
  <text x="79" y="162" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#DA1B2E">de la carpeta fuentes/ de la semana. Usar cuando pidan</text>
  <text x="79" y="184" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#DA1B2E">"reporte semanal" o "pulso de la semana".</text>
  <text x="62" y="206" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#3B3535">---</text>

  <!-- divider -->
  <line x1="40" y1="228" x2="620" y2="228" stroke="#3B3535" stroke-width="1.6"/>

  <!-- body zone -->
  <text x="62" y="254" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" font-weight="bold" fill="#3B3535"># Reporte semanal</text>
  <text x="62" y="298" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#3B3535">1. Leé TODOS los archivos de fuentes/ y consolidá</text>
  <text x="87" y="320" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#3B3535">por empresa.</text>
  <text x="62" y="342" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#3B3535">2. Generá el reporte con esta estructura exacta...</text>
  <text x="62" y="364" font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#3B3535">3. Guardá con sufijo -new (no pises el original).</text>

  <!-- ===== annotations ===== -->
  <line x1="646" y1="149" x2="620" y2="149" stroke="#DA1B2E" stroke-width="1.6" marker-end="url(#arrRed)"/>
  <rect x="648" y="97" width="228" height="104" rx="6" fill="#FDF2F3" stroke="#DA1B2E" stroke-width="1.5"/>
  <text x="762" y="123" text-anchor="middle" font-family="'DejaVu Sans','Helvetica Neue',sans-serif" font-size="15" font-weight="bold" fill="#DA1B2E">METADATA (YAML)</text>
  <text x="762" y="146" text-anchor="middle" font-family="'DejaVu Sans','Helvetica Neue',sans-serif" font-size="13" fill="#3B3535">qué es · cuándo se activa</text>
  <text x="762" y="168" text-anchor="middle" font-family="'DejaVu Sans','Helvetica Neue',sans-serif" font-size="13" fill="#3B3535">la description decide</text>
  <text x="762" y="187" text-anchor="middle" font-family="'DejaVu Sans','Helvetica Neue',sans-serif" font-size="13" fill="#3B3535">cuándo se dispara la Skill</text>

  <line x1="646" y1="307" x2="620" y2="307" stroke="#3B3535" stroke-width="1.4" marker-end="url(#arrInk)"/>
  <rect x="648" y="265" width="228" height="84" rx="6" fill="#F5F2F2" stroke="#3B3535" stroke-width="1.3"/>
  <text x="762" y="291" text-anchor="middle" font-family="'DejaVu Sans','Helvetica Neue',sans-serif" font-size="15" font-weight="bold" fill="#3B3535">CUERPO (Markdown)</text>
  <text x="762" y="314" text-anchor="middle" font-family="'DejaVu Sans','Helvetica Neue',sans-serif" font-size="13" fill="#3B3535">qué hace · los pasos que</text>
  <text x="762" y="333" text-anchor="middle" font-family="'DejaVu Sans','Helvetica Neue',sans-serif" font-size="13" fill="#3B3535">el agente sigue</text>
</svg>
