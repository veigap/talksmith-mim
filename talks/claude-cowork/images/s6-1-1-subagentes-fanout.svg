<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Subagentes: patron fan-out / fan-in</title>
  <desc>El agente principal reparte una tarea entre subagentes que corren en paralelo y junta los resultados.</desc>
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>

  <!-- main agent (focal, red) -->
  <rect x="245" y="30" width="190" height="60" rx="6" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.5"/>
  <text x="340" y="67" text-anchor="middle" font-weight="bold" font-size="15" fill="#ffffff">agente principal</text>

  <!-- fan-out lines -->
  <line x1="300" y1="90" x2="150" y2="175" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="146,166 148,180 159,171" fill="#3B3535"/>
  <line x1="340" y1="90" x2="340" y2="175" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="333,175 340,185 347,175" fill="#3B3535"/>
  <line x1="380" y1="90" x2="530" y2="175" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="521,171 532,180 534,166" fill="#3B3535"/>

  <!-- subagents -->
  <g>
    <rect x="70" y="185" width="150" height="95" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="145" y="215" text-anchor="middle" font-weight="bold" font-size="14" fill="#1F1E1E">sub A</text>
    <text x="145" y="245" text-anchor="middle" font-size="12" fill="#3B3535">contexto</text>
    <text x="145" y="263" text-anchor="middle" font-size="12" fill="#3B3535">propio</text>
  </g>
  <g>
    <rect x="265" y="185" width="150" height="95" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="340" y="215" text-anchor="middle" font-weight="bold" font-size="14" fill="#1F1E1E">sub B</text>
    <text x="340" y="245" text-anchor="middle" font-size="12" fill="#3B3535">contexto</text>
    <text x="340" y="263" text-anchor="middle" font-size="12" fill="#3B3535">propio</text>
  </g>
  <g>
    <rect x="460" y="185" width="150" height="95" rx="6" fill="#F2EEEE" stroke="#3B3535" stroke-width="1.5"/>
    <text x="535" y="215" text-anchor="middle" font-weight="bold" font-size="14" fill="#1F1E1E">sub C</text>
    <text x="535" y="245" text-anchor="middle" font-size="12" fill="#3B3535">contexto</text>
    <text x="535" y="263" text-anchor="middle" font-size="12" fill="#3B3535">propio</text>
  </g>

  <!-- fan-in lines -->
  <line x1="145" y1="280" x2="300" y2="370" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="291,366 302,375 304,361" fill="#3B3535"/>
  <line x1="340" y1="280" x2="340" y2="370" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="333,370 340,380 347,370" fill="#3B3535"/>
  <line x1="535" y1="280" x2="380" y2="370" stroke="#3B3535" stroke-width="1.5"/>
  <polygon points="376,361 378,375 389,366" fill="#3B3535"/>

  <!-- combined result -->
  <rect x="235" y="380" width="210" height="60" rx="6" fill="#F9D2D6" stroke="#DA1B2E" stroke-width="2"/>
  <text x="340" y="417" text-anchor="middle" font-weight="bold" font-size="15" fill="#1F1E1E">resumen combinado</text>
</svg>
