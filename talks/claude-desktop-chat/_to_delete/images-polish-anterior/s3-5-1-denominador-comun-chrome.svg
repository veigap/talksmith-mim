<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 458" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
<title>Cuándo sirve Claude in Chrome</title>
<desc>Los cuatro casos están elegidos para un perfil de gestión, no de desarrollo.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto">
<path d="M0,0 L10.5,4.5 L0,9 Z" fill="#8C8484"/>
</marker>
<marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto">
<path d="M0,0 L10.5,4.5 L0,9 Z" fill="#DA1B2E"/>
</marker>
</defs>
<rect x="0" y="0" width="660" height="458" fill="#ffffff"/>

<text x="26" y="40" font-size="19" font-weight="bold" letter-spacing="0.6">EL PATRÓN COMÚN DE LOS CUATRO CASOS</text>

<rect x="62" y="70" width="300" height="66" rx="6" fill="#F5F3F3" stroke="#C9C2C2" stroke-width="1.5"/>
<text x="212" y="98" font-size="14.5" text-anchor="middle">un sitio web sin exportación</text>
<text x="212" y="118" font-size="14.5" text-anchor="middle">ni integración (sin API)</text>

<line x1="212" y1="136" x2="212" y2="176" stroke="#8C8484" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="62" y="176" width="300" height="66" rx="6" fill="#F5F3F3" stroke="#C9C2C2" stroke-width="1.5"/>
<text x="212" y="204" font-size="14.5" text-anchor="middle">una tarea repetitiva sobre</text>
<text x="212" y="224" font-size="14.5" text-anchor="middle">esa misma pantalla</text>

<line x1="362" y1="209" x2="430" y2="209" stroke="#8C8484" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="424" y="163" width="210" height="92" rx="6" fill="#ffffff" stroke="#C9C2C2" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="440" y="185" font-size="12.5" font-weight="bold" fill="#8C8484" letter-spacing="0.8">HOY, A MANO</text>
<text x="440" y="207" font-size="13">pestaña por pestaña,</text>
<text x="440" y="225" font-size="13">campo por campo,</text>
<text x="440" y="243" font-size="13">todas las semanas</text>

<line x1="212" y1="242" x2="212" y2="282" stroke="#DA1B2E" stroke-width="2" marker-end="url(#ahr)"/>

<rect x="62" y="282" width="300" height="66" rx="6" fill="#FCEBED" stroke="#DA1B2E" stroke-width="2.2"/>
<text x="212" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="#DA1B2E">Claude in Chrome opera</text>
<text x="212" y="330" font-size="15" font-weight="bold" text-anchor="middle" fill="#DA1B2E">el navegador ya abierto</text>

<line x1="212" y1="348" x2="212" y2="388" stroke="#8C8484" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="26" y="388" width="372" height="44" rx="22" fill="#F5F3F3" stroke="#C9C2C2" stroke-width="1.5"/>
<text x="212" y="415" font-size="14" text-anchor="middle">el dato queda cargado / la tabla queda armada</text>
</svg>
