<svg viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Los bloques de Cowork: cada problema, una pieza</title>
  <desc id="d">Esta slide es el mapa de toda la sesión: antes de entrar en cada pieza, dar la foto completa.</desc>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="660" fill="#ffffff"/>

  <!-- PLUGINS transversal band (focal element, red accent) -->
  <rect x="70" y="66" width="595" height="538" rx="12" fill="none" stroke="#DA1B2E" stroke-width="2.5"/>
  <rect x="150" y="51" width="435" height="30" rx="15" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="367.5" y="71" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#DA1B2E" text-anchor="middle">PLUGINS · capa transversal: empaqueta y distribuye</text>

  <!-- autonomy direction cue (left, outside the band) -->
  <line x1="44" y1="570" x2="44" y2="122" stroke="#3B3535" stroke-width="2"/>
  <polygon points="44,108 37,124 51,124" fill="#3B3535"/>
  <text x="27" y="346" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle" transform="rotate(-90 27 346)">más autonomía</text>

  <!-- row 1 (top): Live Artifacts -->
  <rect x="95" y="104" width="200" height="54" rx="6" fill="#F5F4F4" stroke="#8C8686" stroke-width="1.5"/>
  <text x="195" y="136" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">Live Artifacts</text>
  <line x1="295" y1="131" x2="310" y2="131" stroke="#B9B4B4" stroke-width="1.5"/>
  <text x="316" y="136" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#3B3535">“quiero compartir el resultado vivo”</text>

  <!-- row 2: Schedule -->
  <rect x="95" y="174" width="200" height="54" rx="6" fill="#F5F4F4" stroke="#8C8686" stroke-width="1.5"/>
  <text x="195" y="206" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">Schedule</text>
  <line x1="295" y1="201" x2="310" y2="201" stroke="#B9B4B4" stroke-width="1.5"/>
  <text x="316" y="206" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#3B3535">“quiero que corra solo”</text>

  <!-- row 3: Connectors / MCP -->
  <rect x="95" y="244" width="200" height="54" rx="6" fill="#F5F4F4" stroke="#8C8686" stroke-width="1.5"/>
  <text x="195" y="276" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">Connectors / MCP</text>
  <line x1="295" y1="271" x2="310" y2="271" stroke="#B9B4B4" stroke-width="1.5"/>
  <text x="316" y="276" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#3B3535">“quiero traer datos de mis herramientas”</text>

  <!-- row 4: Skills -->
  <rect x="95" y="314" width="200" height="54" rx="6" fill="#F5F4F4" stroke="#8C8686" stroke-width="1.5"/>
  <text x="195" y="346" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">Skills</text>
  <line x1="295" y1="341" x2="310" y2="341" stroke="#B9B4B4" stroke-width="1.5"/>
  <text x="316" y="346" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#3B3535">“no quiero repetir la misma tarea”</text>

  <!-- row 5: Projects -->
  <rect x="95" y="384" width="200" height="54" rx="6" fill="#F5F4F4" stroke="#8C8686" stroke-width="1.5"/>
  <text x="195" y="416" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">Projects</text>
  <line x1="295" y1="411" x2="310" y2="411" stroke="#B9B4B4" stroke-width="1.5"/>
  <text x="316" y="416" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#3B3535">“quiero guardar y organizar todo en un lugar fijo”</text>

  <!-- row 6: Instrucciones -->
  <rect x="95" y="454" width="200" height="54" rx="6" fill="#F5F4F4" stroke="#8C8686" stroke-width="1.5"/>
  <text x="195" y="486" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">Instrucciones</text>
  <line x1="295" y1="481" x2="310" y2="481" stroke="#B9B4B4" stroke-width="1.5"/>
  <text x="316" y="486" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#3B3535">“no quiero repetir el contexto en cada prompt”</text>

  <!-- row 7 (base): Un prompt / chatear -->
  <rect x="95" y="524" width="200" height="54" rx="6" fill="#F5F4F4" stroke="#8C8686" stroke-width="1.5"/>
  <text x="195" y="556" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">Un prompt / chatear</text>
  <line x1="295" y1="551" x2="310" y2="551" stroke="#B9B4B4" stroke-width="1.5"/>
  <text x="316" y="556" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#3B3535">“hago todo a mano, un mensaje a la vez”</text>

  <!-- bottom caption -->
  <text x="367.5" y="638" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3B3535" text-anchor="middle">Los bloques se combinan — usás solo los que tu tarea necesita</text>
</svg>
