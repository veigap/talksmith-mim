<svg viewBox="0 0 880 620" xmlns="http://www.w3.org/2000/svg">
  <title>Cómo se crea una Skill</title>
  <desc>Los dos caminos reales en Cowork, que es GUI y no tiene slash commands.</desc>

  <defs>
    <marker id="arrowGrey" viewBox="0 0 12 10" refX="12" refY="5"
            markerWidth="12" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#3B3535"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 11 9" refX="11" refY="4.5"
            markerWidth="11" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="bold" fill="#3B3535">Crear una Skill en Cowork</text>
  <text x="440" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" fill="#7A7070">GUI, sin slash commands: solo estos dos caminos</text>

  <!-- Path labels -->
  <text x="225" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="bold" letter-spacing="1.5" fill="#7A7070">CAMINO 1</text>
  <text x="655" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="bold" letter-spacing="1.5" fill="#7A7070">CAMINO 2</text>

  <!-- Path 1 panel -->
  <rect x="60" y="110" width="330" height="100" rx="6"
        fill="#F4F2F2" stroke="#3B3535" stroke-width="1.5"/>
  <text x="225" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="bold" fill="#3B3535">Pedila en lenguaje natural</text>
  <text x="225" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" fill="#5C5454">Claude escribe el SKILL.md</text>

  <!-- Path 2 panel -->
  <rect x="490" y="110" width="330" height="100" rx="6"
        fill="#F4F2F2" stroke="#3B3535" stroke-width="1.5"/>
  <text x="655" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="bold" fill="#3B3535">Subí un ZIP</text>
  <text x="655" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" fill="#5C5454">Customize → Skills → «+»</text>

  <!-- Converging arrows -->
  <path d="M225,210 L340,330" fill="none" stroke="#3B3535" stroke-width="2"
        marker-end="url(#arrowGrey)"/>
  <path d="M655,210 L540,330" fill="none" stroke="#3B3535" stroke-width="2"
        marker-end="url(#arrowGrey)"/>

  <!-- Gate (focal element) -->
  <rect x="250" y="330" width="380" height="86" rx="6"
        fill="#FCEBED" stroke="#DA1B2E" stroke-width="3.5"/>
  <text x="440" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="bold" letter-spacing="1" fill="#DA1B2E">SAVE / ENABLE</text>
  <text x="440" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" fill="#DA1B2E">Customize → Skills</text>

  <!-- "la trampa" callout -->
  <path d="M694,373 L630,373" fill="none" stroke="#DA1B2E" stroke-width="2"
        marker-end="url(#arrowRed)"/>
  <text x="704" y="379" text-anchor="start" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="bold" fill="#DA1B2E">la trampa</text>

  <!-- Gate to outcome -->
  <path d="M440,416 L440,480" fill="none" stroke="#3B3535" stroke-width="2"
        marker-end="url(#arrowGrey)"/>

  <!-- Outcome -->
  <rect x="300" y="480" width="280" height="60" rx="6"
        fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
  <text x="440" y="517" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="19" font-weight="bold" fill="#3B3535">Skill activa</text>

  <!-- Footer legend -->
  <text x="440" y="582" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="bold" fill="#3B3535">Frenar en la compuerta = la Skill «no funciona»</text>
</svg>
