<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>〔Backup〕 Controller vs. processor</title>
  <desc>La prueba para distinguir roles bajo GDPR: quién decide para qué se usan los datos — tu empresa es responsable (controller), el proveedor es encargado (processor), y el DPA es el contrato obligatorio que une la relación.</desc>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="280" fill="#ffffff"/>

  <!-- left box: RESPONSABLE (controller) -->
  <rect x="35" y="48" width="220" height="94" rx="6" fill="#F2F0F0" stroke="#3B3535" stroke-width="1.5"/>
  <text x="145" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">RESPONSABLE</text>
  <text x="145" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#3B3535">controller · tu empresa</text>
  <text x="145" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">decide qué datos y para qué</text>

  <!-- right box: ENCARGADO (processor) -->
  <rect x="425" y="48" width="220" height="94" rx="6" fill="#F2F0F0" stroke="#3B3535" stroke-width="1.5"/>
  <text x="535" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">ENCARGADO</text>
  <text x="535" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#3B3535">processor · proveedor IA</text>
  <text x="535" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3B3535">solo ejecuta instrucciones</text>

  <!-- top arrow: data + instructions flow -->
  <text x="340" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">datos + instrucciones</text>
  <line x1="255" y1="100" x2="413" y2="100" stroke="#3B3535" stroke-width="2"/>
  <path d="M 425 100 L 413 94 L 413 106 Z" fill="#3B3535"/>

  <!-- DPA bridge (focal element, accent) -->
  <line x1="145" y1="142" x2="145" y2="200" stroke="#DA1B2E" stroke-width="2.5"/>
  <line x1="535" y1="142" x2="535" y2="200" stroke="#DA1B2E" stroke-width="2.5"/>
  <line x1="145" y1="200" x2="535" y2="200" stroke="#DA1B2E" stroke-width="2.5"/>
  <rect x="250" y="181" width="180" height="38" rx="19" fill="#DA1B2E"/>
  <text x="340" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">DPA (Art. 28)</text>

  <!-- caption -->
  <text x="340" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#3B3535">El contrato obligatorio que vuelve lícita la relación</text>
</svg>
