<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img">
  <title>Plugins en una cuenta Team: ciclo de vida</title>
  <desc>Slide de cierre del bloque avanzado, orientada a quien algún día administre una cuenta de equipo: el Owner crea un marketplace privado y los plugins llegan a todos los miembros con updates sincronizados.</desc>

  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/>
    </marker>
  </defs>

  <!-- ===== Paso 1: Owner crea marketplace (focal, acento) ===== -->
  <rect x="16" y="24" width="196" height="104" rx="8" fill="#FBE8EA" stroke="#DA1B2E" stroke-width="2"/>
  <text x="114" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DA1B2E">1 · OWNER</text>
  <text x="114" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">crea un marketplace</text>
  <text x="114" y="89" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">privado</text>
  <text x="114" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6363">de la organización</text>

  <!-- flecha 1 -> 2 -->
  <line x1="212" y1="76" x2="234" y2="76" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Paso 2: agrega plugins ===== -->
  <rect x="238" y="24" width="196" height="104" rx="8" fill="#F4F2F2" stroke="#3B3535" stroke-width="1.4"/>
  <text x="336" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B3535">2 · Agrega plugins</text>
  <text x="336" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">· subir ZIP</text>
  <text x="336" y="89" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">· sync repo GitHub</text>
  <text x="336" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6363">(auto-actualiza)</text>

  <!-- flecha 2 -> 3 -->
  <line x1="434" y1="76" x2="456" y2="76" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Paso 3: preferencia de instalación ===== -->
  <rect x="460" y="24" width="204" height="104" rx="8" fill="#F4F2F2" stroke="#3B3535" stroke-width="1.4"/>
  <text x="562" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B3535">3 · Instalación por plugin</text>
  <text x="562" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">fija la preferencia:</text>
  <text x="562" y="89" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">opcional / auto-install /</text>
  <text x="562" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">provisionado</text>

  <!-- flecha 3 -> 4 (baja) -->
  <line x1="562" y1="128" x2="562" y2="164" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Paso 4: distribución ===== -->
  <rect x="360" y="168" width="304" height="100" rx="8" fill="#F4F2F2" stroke="#3B3535" stroke-width="1.4"/>
  <text x="512" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B3535">4 · Se distribuye a los miembros</text>
  <text x="512" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">aparece en chat</text>
  <text x="512" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">y en Cowork</text>

  <!-- flecha 4 -> 5 (derecha a izquierda) -->
  <line x1="360" y1="218" x2="326" y2="218" stroke="#3B3535" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Paso 5: miembros ===== -->
  <rect x="16" y="168" width="306" height="100" rx="8" fill="#F4F2F2" stroke="#3B3535" stroke-width="1.4"/>
  <text x="169" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B3535">5 · MIEMBROS instalan / habilitan</text>
  <text x="169" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3B3535">desde el directorio de la org</text>
  <text x="169" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6363">los updates se sincronizan solos</text>
</svg>
