<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">El superpoder de Cowork: la herramienta de propósito general del knowledge worker</title>
  <desc id="d">Analogía de industria: como Excel fue durante ~40 años la habilidad base del trabajo de oficina, las herramientas agénticas — Claude Code para developers, Cowork para knowledge workers — apuntan a ser la nueva habilidad base.</desc>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

  <!-- title -->
  <text x="340" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#3B3535">De Excel a las herramientas agénticas</text>

  <!-- era labels -->
  <text x="170" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6E6868">~40 años</text>
  <text x="510" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6E6868">ahora</text>

  <!-- left panel: Excel (ayer, neutral) -->
  <rect x="40" y="90" width="260" height="134" rx="8" fill="#F1EFEF" stroke="#B9B4B4" stroke-width="1.5"/>
  <text x="170" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535">EXCEL</text>
  <text x="170" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3B3535">la lingua franca del trabajo</text>
  <text x="170" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3B3535">de oficina — sin programar</text>

  <!-- temporal arrow -->
  <line x1="306" y1="157" x2="366" y2="157" stroke="#3B3535" stroke-width="3"/>
  <polygon points="366,149 380,157 366,165" fill="#3B3535"/>

  <!-- right panel: herramientas agénticas (ahora, focal) -->
  <rect x="380" y="90" width="260" height="134" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
  <text x="510" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#DA1B2E">HERRAMIENTAS AGÉNTICAS</text>
  <text x="510" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3B3535">Claude Code → developers</text>
  <text x="510" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#3B3535">Cowork → knowledge workers</text>

  <!-- footer captions -->
  <text x="170" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#6E6868">la habilidad base de ayer</text>
  <text x="510" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#3B3535">la nueva habilidad base</text>

  <!-- attribution footnote -->
  <text x="340" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#6E6868">«el nuevo Excel» es un encuadre de analistas de la industria, no un claim oficial de Anthropic</text>
</svg>
