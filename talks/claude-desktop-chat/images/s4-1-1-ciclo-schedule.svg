<!-- talksmith-ascii-sha256: 17be3d97b0aca41704b57859b096a14150d4e57cfefc834cd93fff23788b5da7 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 422" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3B3535">
  <title>Describir una vez, que corra sola</title>
  <desc>Un Schedule se describe una sola vez, se le fija una cadencia y corre solo, usando los conectores ya configurados.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#3B3535"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="422" fill="#ffffff"/>

  <text x="350" y="43" text-anchor="middle" font-size="21" font-weight="bold">Schedule</text>
  <text x="350" y="66" text-anchor="middle" fill="#6B6360">se describe una sola vez y después corre sola</text>

  <rect x="28" y="104" width="236" height="88" rx="6" fill="#F4F2F1" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="436" y="104" width="236" height="88" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.8"/>
  <rect x="436" y="306" width="236" height="88" rx="6" fill="#F4F2F1" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="28" y="306" width="236" height="88" rx="6" fill="#F4F2F1" stroke="#3B3535" stroke-width="1.2"/>

  <circle cx="62" cy="148" r="16" fill="#ffffff" stroke="#3B3535" stroke-width="1.4"/>
  <path d="M62 148 L62 137" stroke="#3B3535" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M62 148 L70 152" stroke="#3B3535" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <circle cx="62" cy="148" r="1.8" fill="#3B3535"/>

  <text x="92" y="144" font-size="15" font-weight="bold">Cadencia fija</text>
  <text x="92" y="165" fill="#6B6360">lunes 8:00</text>

  <text x="554" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#DA1B2E">La tarea corre sola</text>
  <text x="554" y="165" text-anchor="middle" fill="#6B6360">sin que se lo pidas</text>

  <text x="554" y="346" text-anchor="middle" font-size="15" font-weight="bold">Conectores</text>
  <text x="554" y="367" text-anchor="middle" fill="#6B6360">mail · web · calendario</text>

  <text x="146" y="346" text-anchor="middle" font-size="15" font-weight="bold">Resumen listo</text>
  <text x="146" y="367" text-anchor="middle" fill="#6B6360">en tu chat</text>

  <path d="M264 148 H436" stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M554 192 V306" stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M436 350 H264" stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <path d="M146 306 V192" stroke="#3B3535" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>

  <text x="350" y="138" text-anchor="middle" fill="#6B6360">dispara la tarea</text>
  <text x="568" y="238" fill="#6B6360">usa los</text>
  <text x="568" y="256" fill="#6B6360">conectores</text>
  <text x="350" y="371" text-anchor="middle" fill="#6B6360">trae la info</text>
  <text x="160" y="238" fill="#6B6360">cada semana,</text>
  <text x="160" y="256" fill="#6B6360">sin pedirlo</text>

  <text x="350" y="240" text-anchor="middle" fill="#6B6360">se describe</text>
  <text x="350" y="266" text-anchor="middle" font-size="18" font-weight="bold">UNA vez</text>
</svg>
