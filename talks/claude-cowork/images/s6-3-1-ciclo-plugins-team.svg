<svg viewBox="0 0 680 318" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Plugins en una cuenta Team: ciclo de vida</title>
  <desc>Ciclo de vida de un plugin en una cuenta Team o Enterprise: el Owner crea un marketplace privado, agrega plugins por ZIP o sincronizando un repo de GitHub, fija la preferencia de instalación, y desde ahí se distribuye a los miembros en chat y en Cowork, que lo instalan con las actualizaciones sincronizadas.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B0A8A5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="318" fill="#ffffff"/>

  <!-- ============ ROW 1 ============ -->

  <!-- Box 1 — focal -->
  <rect x="24" y="40" width="188" height="106" rx="6" fill="#FCEEF0" stroke="#DA1B2E" stroke-width="1.6"/>
  <text x="40" y="62" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#DA1B2E">OWNER</text>
  <text x="40" y="83" font-size="12.5" font-weight="600" fill="#3B3535">Crea un marketplace</text>
  <text x="40" y="99" font-size="12.5" font-weight="600" fill="#3B3535">privado de la org</text>
  <text x="40" y="119" font-size="10.5" fill="#6E6663">Organization settings</text>
  <text x="40" y="134" font-size="10.5" fill="#6E6663">→ Plugins</text>

  <!-- Box 2 -->
  <rect x="246" y="40" width="188" height="106" rx="6" fill="#F6F4F3" stroke="#DDD8D6" stroke-width="1.2"/>
  <text x="262" y="62" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#8A817E">OWNER</text>
  <text x="262" y="83" font-size="12.5" font-weight="600" fill="#3B3535">Agrega plugins</text>
  <text x="262" y="103" font-size="10.5" fill="#6E6663">· Subir un ZIP</text>
  <text x="262" y="118" font-size="10.5" fill="#6E6663">· Sync de un repo GitHub</text>
  <text x="271" y="133" font-size="10.5" fill="#6E6663">(auto-actualiza)</text>

  <!-- Box 3 -->
  <rect x="468" y="40" width="188" height="106" rx="6" fill="#F6F4F3" stroke="#DDD8D6" stroke-width="1.2"/>
  <text x="484" y="62" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#8A817E">OWNER</text>
  <text x="484" y="83" font-size="12.5" font-weight="600" fill="#3B3535">Fija la preferencia</text>
  <text x="484" y="99" font-size="12.5" font-weight="600" fill="#3B3535">de instalación</text>
  <text x="484" y="119" font-size="10.5" fill="#6E6663">· Opcional / auto-install</text>
  <text x="484" y="134" font-size="10.5" fill="#6E6663">· Provisionado por usuario</text>

  <!-- Row 1 connectors -->
  <line x1="214" y1="93" x2="243" y2="93" stroke="#B0A8A5" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="436" y1="93" x2="465" y2="93" stroke="#B0A8A5" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Drop connector: box 3 -> box 4 -->
  <line x1="562" y1="148" x2="562" y2="187" stroke="#B0A8A5" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- ============ ROW 2 ============ -->

  <!-- Box 4 -->
  <rect x="340" y="190" width="316" height="106" rx="6" fill="#F6F4F3" stroke="#DDD8D6" stroke-width="1.2"/>
  <text x="356" y="212" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#8A817E">DISTRIBUCIÓN</text>
  <text x="356" y="234" font-size="12.5" font-weight="600" fill="#3B3535">Se distribuye a los miembros</text>
  <text x="356" y="252" font-size="10.5" fill="#6E6663">Un mismo plugin, dos superficies:</text>
  <rect x="356" y="262" width="78" height="24" rx="12" fill="#ECE8E6" stroke="#D8D3D1" stroke-width="1"/>
  <text x="395" y="277.7" font-size="10.5" font-weight="600" fill="#3B3535" text-anchor="middle">en chat</text>
  <rect x="444" y="262" width="94" height="24" rx="12" fill="#ECE8E6" stroke="#D8D3D1" stroke-width="1"/>
  <text x="491" y="277.7" font-size="10.5" font-weight="600" fill="#3B3535" text-anchor="middle">en Cowork</text>

  <!-- Box 5 -->
  <rect x="24" y="190" width="270" height="106" rx="6" fill="#F6F4F3" stroke="#DDD8D6" stroke-width="1.2"/>
  <text x="40" y="212" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#8A817E">MIEMBROS</text>
  <text x="40" y="234" font-size="12.5" font-weight="600" fill="#3B3535">Instalan / habilitan desde</text>
  <text x="40" y="250" font-size="12.5" font-weight="600" fill="#3B3535">el directorio de la org</text>
  <text x="40" y="270" font-size="10.5" fill="#6E6663">Las actualizaciones se</text>
  <text x="40" y="285" font-size="10.5" fill="#6E6663">sincronizan solas</text>

  <!-- Row 2 connector (right to left) -->
  <line x1="338" y1="243" x2="297" y2="243" stroke="#B0A8A5" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- ============ STEP BADGES ============ -->
  <circle cx="46" cy="40" r="11" fill="#DA1B2E"/>
  <text x="46" y="43.9" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <circle cx="268" cy="40" r="11" fill="#ffffff" stroke="#C9C3C0" stroke-width="1.2"/>
  <text x="268" y="43.9" font-size="11" font-weight="700" fill="#6E6663" text-anchor="middle">2</text>

  <circle cx="490" cy="40" r="11" fill="#ffffff" stroke="#C9C3C0" stroke-width="1.2"/>
  <text x="490" y="43.9" font-size="11" font-weight="700" fill="#6E6663" text-anchor="middle">3</text>

  <circle cx="362" cy="190" r="11" fill="#ffffff" stroke="#C9C3C0" stroke-width="1.2"/>
  <text x="362" y="193.9" font-size="11" font-weight="700" fill="#6E6663" text-anchor="middle">4</text>

  <circle cx="46" cy="190" r="11" fill="#ffffff" stroke="#C9C3C0" stroke-width="1.2"/>
  <text x="46" y="193.9" font-size="11" font-weight="700" fill="#6E6663" text-anchor="middle">5</text>
</svg>
