<text x="270" y="78" text-anchor="middle" fill="#5A5252">en la terminal</text>
<text x="270" y="95" text-anchor="middle" fill="#5A5252">para developers</text>

<rect x="364" y="24" width="152" height="120" rx="6" fill="#ffffff" stroke="#8A8080" stroke-width="1.5"/>
