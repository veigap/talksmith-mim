<!-- talksmith-ascii-sha256: 2726fd14465c7cb0d2d2133d63528f8e59a77f34d1c803c073a60c80485b7727 -->
<svg viewBox="0 0 714 318" xmlns="http://www.w3.org/2000/svg">
  <title>Trabajá en .md, exportá al final</title>
  <desc>Flujo de trabajo con la IA: las fuentes se convierten a archivos .md, todo el trabajo iterativo pasa sobre los .md, y el entregable final se genera una sola vez al final.</desc>

  <defs>
    <marker id="ah-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,1 L9,5 L0,9 z" fill="#3B3535"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,1 L9,5 L0,9 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="714" height="318" fill="#ffffff"/>

  <!-- ===== Column headers ===== -->
  <text x="81" y="33" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.8" fill="#1F1E1E">FUENTES</text>
  <text x="81" y="49" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6A737D">lo que llega</text>

  <text x="357" y="33" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.8" fill="#1F1E1E">TRABAJO</text>
  <text x="357" y="49" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6A737D">muchas idas y vueltas con la IA</text>

  <text x="633" y="33" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="0.8" fill="#1F1E1E">ENTREGA</text>
  <text x="633" y="49" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#6A737D">una sola vez, al final</text>

  <!-- ===== Box 1 — fuentes ===== -->
  <rect x="25" y="78" width="112" height="164" rx="8" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.5"/>
  <rect x="43" y="96" width="76" height="26" rx="4" fill="#F2EEEE"/>
  <text x="81" y="112.7" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="#3B3535">.docx</text>
  <rect x="43" y="130" width="76" height="26" rx="4" fill="#F2EEEE"/>
  <text x="81" y="146.7" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="#3B3535">.pdf</text>
  <rect x="43" y="164" width="76" height="26" rx="4" fill="#F2EEEE"/>
  <text x="81" y="180.7" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="#3B3535">mails</text>
  <rect x="43" y="198" width="76" height="26" rx="4" fill="#F2EEEE"/>
  <text x="81" y="214.7" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="#3B3535">webs</text>

  <!-- ===== Arrow 1 ===== -->
  <text x="197" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#6A737D">«convertime esto a .md»</text>
  <line x1="143" y1="160" x2="251" y2="160" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah-dark)"/>

  <!-- ===== Box 2 — archivos .md (focal) ===== -->
  <rect x="257" y="72" width="200" height="176" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="357" y="105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#DA1B2E">ARCHIVOS .MD</text>
  <line x1="285" y1="117" x2="429" y2="117" stroke="#F2EEEE" stroke-width="1"/>
  <text x="357" y="137" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3B3535">acá la IA interpreta,</text>
  <text x="357" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3B3535">edita y crea mejor</text>

  <rect x="273" y="168" width="168" height="62" rx="5" fill="#F2F2F2"/>
  <text x="357" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="0.7" fill="#6A737D">IDAS Y VUELTAS</text>
  <text x="357" y="201" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3B3535">resumir · corregir</text>
  <text x="357" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#3B3535">reescribir · fusionar</text>

  <!-- ===== Iteration loop under box 2 ===== -->
  <path d="M 305,248 V 266 A 6,6 0 0 0 311,272 H 403 A 6,6 0 0 0 409,266 V 254" fill="none" stroke="#DA1B2E" stroke-width="1.6" marker-end="url(#ah-red)"/>
  <text x="357" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6A737D">iterás acá: barato y preciso</text>

  <!-- ===== Arrow 2 ===== -->
  <text x="517" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-style="italic" fill="#6A737D">«generame el entregable»</text>
  <line x1="463" y1="160" x2="571" y2="160" stroke="#3B3535" stroke-width="1.6" marker-end="url(#ah-dark)"/>

  <!-- ===== Box 3 — entrega ===== -->
  <rect x="577" y="78" width="112" height="164" rx="8" fill="#ffffff" stroke="#D8D4D4" stroke-width="1.5"/>
  <rect x="595" y="96" width="76" height="26" rx="4" fill="#F2EEEE"/>
  <text x="633" y="112.7" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="#3B3535">.docx</text>
  <rect x="595" y="130" width="76" height="26" rx="4" fill="#F2EEEE"/>
  <text x="633" y="146.7" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="#3B3535">.xlsx</text>
  <rect x="595" y="164" width="76" height="26" rx="4" fill="#F2EEEE"/>
  <text x="633" y="180.7" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="#3B3535">PDF</text>
  <rect x="595" y="198" width="76" height="26" rx="4" fill="#F2EEEE"/>
  <text x="633" y="214.7" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="10" fill="#3B3535">slides</text>
</svg>
