<svg viewBox="0 0 680 225" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>La arquitectura, en tres saltos</title>
  <desc>Diagrama de red: tu PC conectada a internet, que cruza a un servidor SaaS de un tercero en otro país, y de ahí al proveedor de IA que retiene y entrena. Cada conexión es una API.</desc>
  <defs>
    <marker id="arrowh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B3535"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="225" fill="#ffffff"/>

  <!-- country brackets -->
  <line x1="25" y1="190" x2="105" y2="190" stroke="#B4AFAF" stroke-width="1"/>
  <line x1="25" y1="185" x2="25" y2="195" stroke="#B4AFAF" stroke-width="1"/>
  <line x1="105" y1="185" x2="105" y2="195" stroke="#B4AFAF" stroke-width="1"/>
  <text x="65" y="207" text-anchor="middle" font-size="12" fill="#7A7373">Tu país</text>

  <line x1="458" y1="190" x2="650" y2="190" stroke="#B4AFAF" stroke-width="1"/>
  <line x1="458" y1="185" x2="458" y2="195" stroke="#B4AFAF" stroke-width="1"/>
  <line x1="650" y1="185" x2="650" y2="195" stroke="#B4AFAF" stroke-width="1"/>
  <text x="554" y="207" text-anchor="middle" font-size="12" fill="#7A7373">Otro país</text>

  <!-- laptop (Tu PC) -->
  <rect x="40" y="75" width="50" height="34" rx="3" fill="#ffffff" stroke="#3B3535" stroke-width="1.5"/>
  <rect x="30" y="109" width="70" height="6" rx="2" fill="#3B3535"/>
  <text x="65" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B3535">Tu PC</text>

  <!-- cloud (internet) -->
  <circle cx="210" cy="68" r="20" fill="#EFEDED"/>
  <circle cx="274" cy="55" r="28" fill="#EFEDED"/>
  <circle cx="338" cy="68" r="20" fill="#EFEDED"/>
  <rect x="174" y="75" width="200" height="50" rx="25" fill="#EFEDED"/>
  <text x="274" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B3535">Internet</text>

  <!-- servidor SaaS -->
  <rect x="458" y="60" width="54" height="80" rx="6" fill="#F5F3F3" stroke="#3B3535" stroke-width="1.5"/>
  <line x1="470" y1="78" x2="500" y2="78" stroke="#3B3535" stroke-width="1"/>
  <line x1="470" y1="98" x2="500" y2="98" stroke="#3B3535" stroke-width="1"/>
  <line x1="470" y1="118" x2="500" y2="118" stroke="#3B3535" stroke-width="1"/>
  <circle cx="500" cy="78" r="2.5" fill="#3B3535"/>
  <circle cx="500" cy="98" r="2.5" fill="#3B3535"/>
  <circle cx="500" cy="118" r="2.5" fill="#3B3535"/>
  <text x="485" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B3535">Servidor SaaS</text>

  <!-- proveedor IA (riesgo) -->
  <rect x="596" y="60" width="54" height="80" rx="6" fill="#FDECEE" stroke="#DA1B2E" stroke-width="2"/>
  <line x1="608" y1="78" x2="638" y2="78" stroke="#DA1B2E" stroke-width="1"/>
  <line x1="608" y1="98" x2="638" y2="98" stroke="#DA1B2E" stroke-width="1"/>
  <line x1="608" y1="118" x2="638" y2="118" stroke="#DA1B2E" stroke-width="1"/>
  <circle cx="638" cy="78" r="2.5" fill="#DA1B2E"/>
  <circle cx="638" cy="98" r="2.5" fill="#DA1B2E"/>
  <circle cx="638" cy="118" r="2.5" fill="#DA1B2E"/>
  <text x="623" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#3B3535">Proveedor IA</text>
  <text x="623" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#DA1B2E">retiene y entrena</text>

  <!-- connections -->
  <line x1="90" y1="100" x2="172" y2="100" stroke="#3B3535" stroke-width="2" marker-end="url(#arrowh)"/>
  <circle cx="90" cy="100" r="3" fill="#3B3535"/>
  <text x="131" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3B3535">API</text>

  <line x1="376" y1="100" x2="456" y2="100" stroke="#3B3535" stroke-width="2" marker-end="url(#arrowh)"/>
  <circle cx="376" cy="100" r="3" fill="#3B3535"/>
  <text x="416" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3B3535">API</text>

  <line x1="512" y1="100" x2="594" y2="100" stroke="#DA1B2E" stroke-width="2" marker-end="url(#arrowh)"/>
  <circle cx="512" cy="100" r="3" fill="#3B3535"/>
  <text x="553" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3B3535">API</text>
</svg>
