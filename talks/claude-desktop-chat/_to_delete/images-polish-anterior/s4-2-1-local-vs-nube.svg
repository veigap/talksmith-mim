<!-- talksmith-ascii-sha256: 2213b007a7576c2f714ac4cf766bc7fd8a711c7ba9d014f56257ede18c6045c3 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" font-family="Helvetica, Arial, sans-serif" fill="#3B3535" font-size="13">
  <title>¿Dónde corre? Local o nube</title>
  <desc>Antes de confiarle algo a un Schedule hay que saber dónde corre: local, con la computadora prendida, o en la nube.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6B6363"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="396" fill="#ffffff"/>

  <rect x="190" y="40" width="300" height="46" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="340" y="69" text-anchor="middle" font-size="17" font-weight="bold" fill="#DA1B2E">el Schedule: ¿DÓNDE corre?</text>

  <path d="M340,86 L340,108 L180,108 L180,129" fill="none" stroke="#6B6363" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M340,108 L500,108 L500,129" fill="none" stroke="#6B6363" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="40" y="130" width="280" height="226" rx="6" fill="#F7F6F6" stroke="#CFC9C9" stroke-width="1.4"/>
  <text x="180" y="162" text-anchor="middle" font-size="19" font-weight="bold">LOCAL</text>
  <text x="180" y="182" text-anchor="middle" font-size="12" fill="#6B6363">hoy, para la mayoría</text>
  <line x1="56" y1="194" x2="304" y2="194" stroke="#CFC9C9" stroke-width="1"/>

  <circle cx="58" cy="212" r="2.6" fill="#8A8080"/>
  <text x="70" y="216">computadora prendida</text>
  <circle cx="58" cy="240" r="2.6" fill="#8A8080"/>
  <text x="70" y="244">app abierta</text>
  <circle cx="58" cy="268" r="2.6" fill="#8A8080"/>
  <text x="70" y="272">apagada o suspendida:</text>
  <text x="70" y="292">la corrida puede perderse</text>
  <circle cx="58" cy="316" r="2.6" fill="#8A8080"/>
  <text x="70" y="320">ojo: las laptops se</text>
  <text x="70" y="338">suspenden solas</text>

  <rect x="360" y="130" width="280" height="226" rx="6" fill="#F7F6F6" stroke="#CFC9C9" stroke-width="1.4"/>
  <text x="500" y="162" text-anchor="middle" font-size="19" font-weight="bold">NUBE</text>
  <text x="500" y="182" text-anchor="middle" font-size="12" fill="#6B6363">beta, desde julio de 2026</text>
  <line x1="376" y1="194" x2="624" y2="194" stroke="#CFC9C9" stroke-width="1"/>

  <circle cx="378" cy="212" r="2.6" fill="#8A8080"/>
  <text x="390" y="216">sin computadora prendida</text>
  <circle cx="378" cy="240" r="2.6" fill="#8A8080"/>
  <text x="390" y="244">llegada gradual (Max primero)</text>

  <rect x="376" y="266" width="248" height="76" rx="5" fill="#FCEBED" stroke="#DA1B2E" stroke-width="1.4"/>
  <text x="392" y="294" font-weight="bold" fill="#DA1B2E">PERO: si usa archivos o apps</text>
  <text x="392" y="316" font-weight="bold" fill="#DA1B2E">locales, corre local igual</text>
</svg>
