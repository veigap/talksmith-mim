<!-- talksmith-ascii-sha256: 73d9cdfa3eccd6aec7d45014f6f155c370398d3bfca98c1e86383175a54c51d8 -->
<svg viewBox="0 0 788 263" xmlns="http://www.w3.org/2000/svg">
  <title>Chat solo vs chat con conectores</title>
  <desc>Un conector saca al chat de su aislamiento y le da acceso a buscar en la web, leer tu mail, ver tu calendario y consultar tus documentos.</desc>

  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="788" height="263" fill="#ffffff"/>

  <!-- divisor -->
  <line x1="284" y1="52" x2="284" y2="235" stroke="#E5E0E0" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ===== IZQUIERDA: chat solo ===== -->
  <text x="133" y="41" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3B3535" text-anchor="middle">CHAT SOLO</text>

  <rect x="28" y="64" width="210" height="118" rx="6" fill="#F5F3F3" stroke="#C9C2C2" stroke-width="2"/>
  <text x="133" y="102" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">CHAT</text>
  <text x="133" y="132" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle">responde de memoria</text>
  <text x="133" y="152" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle">de entrenamiento</text>

  <text x="133" y="208" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#7A7070" text-anchor="middle">(aislado)</text>

  <!-- ===== DERECHA: chat con conectores ===== -->
  <text x="545" y="41" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#DA1B2E" text-anchor="middle">CHAT CON CONECTORES</text>

  <rect x="330" y="64" width="220" height="142" rx="6" fill="#FDF2F3" stroke="#DA1B2E" stroke-width="2"/>
  <text x="440" y="114" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#3B3535" text-anchor="middle">CHAT</text>
  <text x="440" y="144" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle">consulta fuentes reales</text>
  <text x="440" y="164" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle">antes de responder</text>

  <text x="440" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#7A7070" text-anchor="middle">(conectado a tu mundo)</text>

  <!-- flechas -->
  <line x1="550" y1="81" x2="596" y2="81" stroke="#DA1B2E" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="550" y1="117" x2="596" y2="117" stroke="#DA1B2E" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="550" y1="153" x2="596" y2="153" stroke="#DA1B2E" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="550" y1="189" x2="596" y2="189" stroke="#DA1B2E" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- destinos -->
  <rect x="600" y="65" width="160" height="32" rx="16" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="680" y="86" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle">web</text>

  <rect x="600" y="101" width="160" height="32" rx="16" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="680" y="122" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle">mail</text>

  <rect x="600" y="137" width="160" height="32" rx="16" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="680" y="158" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle">calendario</text>

  <rect x="600" y="173" width="160" height="32" rx="16" fill="#ffffff" stroke="#DA1B2E" stroke-width="2"/>
  <text x="680" y="194" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3B3535" text-anchor="middle">documentos</text>
</svg>
