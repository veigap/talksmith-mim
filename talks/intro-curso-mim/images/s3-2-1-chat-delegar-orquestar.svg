<!-- talksmith-ascii-sha256: c4039cb70cf214ef6dc044ef22019acd51f0e505ea77845c5e1b7f6a92b4a065 -->
<svg viewBox="0 0 892 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>De un chat a una organización de agentes</title>
  <desc>Este es el diagrama que conviene que se lleven en la cabeza: el curso entero cabe en esas tres cajas.</desc>
  <defs>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B3535"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DA1B2E"/>
    </marker>
    <marker id="ah-soft" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E6666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="892" height="320" fill="#ffffff"/>

  <!-- stage titles -->
  <g font-size="22" font-weight="bold" text-anchor="middle">
    <text x="124" y="40">CHAT</text>
    <text x="402" y="40">DELEGAR</text>
    <text x="718" y="40" fill="#DA1B2E">ORQUESTAR</text>
  </g>

  <!-- boxes -->
  <rect x="24" y="60" width="200" height="110" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <rect x="284" y="60" width="236" height="110" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <rect x="580" y="60" width="276" height="110" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>

  <!-- box copy -->
  <g font-size="15" text-anchor="middle">
    <text x="124" y="108">un mensaje</text>
    <text x="124" y="130">por vez</text>
    <text x="402" y="108">un resultado</text>
    <text x="402" y="131" font-size="13.5" fill="#6E6666">(Claude Cowork)</text>
    <text x="718" y="97">una organización</text>
    <text x="718" y="118">de agentes</text>
    <text x="718" y="142" font-size="13.5" fill="#6E6666">(Paperclip)</text>
  </g>

  <!-- progression arrows -->
  <path d="M232,115 L278,115" fill="none" stroke="#3B3535" stroke-width="2.5" marker-end="url(#ah-grey)"/>
  <path d="M528,115 L574,115" fill="none" stroke="#DA1B2E" stroke-width="3" marker-end="url(#ah-red)"/>

  <!-- stage sublabels -->
  <g font-size="13.5" fill="#6E6666" text-anchor="middle">
    <text x="124" y="192">donde arrancamos</text>
    <text x="402" y="192">Días 1-2-3-5</text>
    <text x="718" y="192">Día 6</text>
  </g>

  <!-- human-in-the-loop footer, hanging off ORQUESTAR -->
  <path d="M718,204 L718,232" fill="none" stroke="#6E6666" stroke-width="2" marker-end="url(#ah-soft)"/>
  <rect x="568" y="236" width="300" height="60" rx="6" fill="#F4F2F2" stroke="#C9C2C2" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="718" y="260" font-size="14" font-weight="bold">humano siempre en el loop</text>
    <text x="718" y="280" font-size="13.5" fill="#6E6666">compuertas de aprobación y budgets</text>
  </g>
</svg>
