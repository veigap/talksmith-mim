<svg viewBox="0 0 680 314" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Los conectores también actúan: del leer al hacer</title>
  <desc>El giro de la sección: hasta acá el conector era una antena que traía información; ahora es también una mano que ejecuta acciones.</desc>

  <defs>
    <marker id="ar-grey" viewBox="0 0 9 7" refX="8.5" refY="3.5" markerWidth="9" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8.5 3.5 L0 7 Z" fill="#6A737D"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 11 8.5" refX="10.5" refY="4.25" markerWidth="11" markerHeight="8.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10.5 4.25 L0 8.5 Z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="314" fill="#FFFFFF"/>

  <!-- headings -->
  <text x="340" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F1E1E">Un conector va en dos direcciones</text>
  <text x="340" y="58" text-anchor="middle" font-size="10.5" fill="#3B3535">el mismo conector trae información y también ejecuta acciones</text>

  <!-- CHAT -->
  <rect x="24" y="135" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.5"/>
  <text x="86" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F1E1E">CHAT</text>

  <!-- conector -->
  <rect x="265" y="135" width="150" height="70" rx="8" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1.5"/>
  <text x="340" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F1E1E">conector</text>
  <text x="340" y="182" text-anchor="middle" font-size="8" fill="#3B3535">el mismo, en ambos sentidos</text>

  <!-- tu mundo -->
  <rect x="530" y="120" width="122" height="100" rx="8" fill="#FFFFFF" stroke="#D8D4D4" stroke-width="1.5"/>
  <text x="591" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#1F1E1E">tu mundo</text>
  <line x1="542" y1="147" x2="640" y2="147" stroke="#F2EEEE" stroke-width="1"/>
  <text x="591" y="163" text-anchor="middle" font-size="9" fill="#3B3535">mail</text>
  <text x="591" y="178" text-anchor="middle" font-size="9" fill="#3B3535">calendario</text>
  <text x="591" y="193" text-anchor="middle" font-size="9" fill="#3B3535">tickets</text>
  <text x="591" y="208" text-anchor="middle" font-size="9" fill="#3B3535">mensajes</text>

  <!-- LEER lane (right to left) -->
  <line x1="528" y1="140" x2="417" y2="140" stroke="#6A737D" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <line x1="263" y1="140" x2="150" y2="140" stroke="#6A737D" stroke-width="1.5" marker-end="url(#ar-grey)"/>
  <text x="206" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A737D">LEER — traer info</text>
  <text x="472" y="118" text-anchor="middle" font-size="9" fill="#6A737D">inbox, agenda,</text>
  <text x="472" y="129" text-anchor="middle" font-size="9" fill="#6A737D">noticias</text>

  <!-- ACTUAR lane (left to right) — foco de la slide -->
  <line x1="150" y1="196" x2="263" y2="196" stroke="#DA1B2E" stroke-width="2.4" marker-end="url(#ar-red)"/>
  <line x1="417" y1="196" x2="528" y2="196" stroke="#DA1B2E" stroke-width="2.4" marker-end="url(#ar-red)"/>
  <text x="206" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#DA1B2E">ACTUAR — hacer</text>
  <text x="472" y="210" text-anchor="middle" font-size="9" fill="#3B3535">mandar mail, agendar,</text>
  <text x="472" y="221" text-anchor="middle" font-size="9" fill="#3B3535">abrir ticket, mensaje</text>

  <!-- control -->
  <rect x="80" y="248" width="520" height="40" rx="8" fill="#F7BBC1"/>
  <text x="340" y="272" text-anchor="middle" font-size="10" fill="#000000">Vos conectás y autorizás — mejor «dejar borrador» que «enviar directo»</text>
</svg>
