<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>De la tarea a la perilla</title>
  <desc>Arbol de decision: cada pregunta de negocio baja a la perilla que hay que mover.</desc>

  <rect x="0" y="0" width="720" height="430" fill="#ffffff"/>

  <!-- Root node (focal, red) -->
  <rect x="240" y="24" width="240" height="52" rx="8" fill="#DA1B2E"/>
  <text x="360" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">¿Qué necesita tu tarea?</text>
  <text x="360" y="64" text-anchor="middle" font-size="10.5" fill="#F9D2D6">Empezá por el problema, no por la perilla</text>

  <!-- Trunk drops into the clean gap column (x=305) between question boxes and knobs -->
  <line x1="360" y1="76" x2="360" y2="98" stroke="#6A737D" stroke-width="2"/>
  <path d="M360 98 L305 98 L305 298" stroke="#6A737D" stroke-width="2" fill="none"/>
  <circle cx="305" cy="98" r="3" fill="#6A737D"/>
  <!-- spine taps to each axis -->
  <circle cx="305" cy="180" r="3" fill="#6A737D"/>
  <circle cx="305" cy="298" r="3" fill="#6A737D"/>

  <!-- ===== AXIS 1: consistencia vs creatividad ===== -->
  <rect x="40" y="150" width="235" height="60" rx="8" fill="#F4F4F5" stroke="#6A737D" stroke-width="1.5"/>
  <text x="157" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3B3535">¿Consistencia o creatividad?</text>
  <text x="157" y="196" text-anchor="middle" font-size="10.5" fill="#6A737D">respuestas de marca vs. variedad</text>

  <!-- question box -> spine tap -->
  <line x1="275" y1="180" x2="302" y2="180" stroke="#6A737D" stroke-width="1.5"/>
  <!-- spine tap -> knob pair -->
  <line x1="308" y1="180" x2="323" y2="180" stroke="#6A737D" stroke-width="1.5"/>
  <path d="M320 175 L330 180 L320 185 Z" fill="#6A737D"/>

  <rect x="330" y="146" width="360" height="30" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.5"/>
  <text x="345" y="165" font-size="11.5" fill="#3B3535">¿Consistente / de marca?</text>
  <text x="515" y="165" font-size="11.5" font-weight="bold" fill="#DA1B2E">→ bajar temperatura y top-p</text>

  <rect x="330" y="184" width="360" height="30" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.5"/>
  <text x="345" y="203" font-size="11.5" fill="#3B3535">¿Variedad / creatividad?</text>
  <text x="515" y="203" font-size="11.5" font-weight="bold" fill="#DA1B2E">→ subir temperatura y top-p</text>

  <!-- Divider between the two decision axes -->
  <line x1="40" y1="240" x2="690" y2="240" stroke="#E5E5E7" stroke-width="1"/>

  <!-- ===== AXIS 2: dificultad vs presupuesto ===== -->
  <rect x="40" y="268" width="235" height="60" rx="8" fill="#F4F4F5" stroke="#6A737D" stroke-width="1.5"/>
  <text x="157" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3B3535">¿Dificultad vs. presupuesto?</text>
  <text x="157" y="314" text-anchor="middle" font-size="10.5" fill="#6A737D">qué tan difícil vs. cuánto pagar</text>

  <!-- question box -> spine tap -->
  <line x1="275" y1="298" x2="302" y2="298" stroke="#6A737D" stroke-width="1.5"/>
  <!-- spine tap -> knob pair -->
  <line x1="308" y1="298" x2="323" y2="298" stroke="#6A737D" stroke-width="1.5"/>
  <path d="M320 293 L330 298 L320 303 Z" fill="#6A737D"/>

  <rect x="330" y="264" width="360" height="30" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.5"/>
  <text x="345" y="283" font-size="11.5" fill="#3B3535">¿Presupuesto o latencia ajustada?</text>
  <text x="548" y="283" font-size="11.5" font-weight="bold" fill="#DA1B2E">→ modelo más chico</text>

  <rect x="330" y="302" width="360" height="30" rx="6" fill="#ffffff" stroke="#DA1B2E" stroke-width="1.5"/>
  <text x="345" y="321" font-size="11.5" fill="#3B3535">¿Tarea compleja / mucho contexto?</text>
  <text x="548" y="321" font-size="11.5" font-weight="bold" fill="#DA1B2E">→ modelo más grande</text>

  <!-- Footer message -->
  <text x="360" y="400" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6A737D">La configuración se deriva del problema — no al revés.</text>
</svg>
