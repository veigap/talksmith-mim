<svg viewBox="0 0 680 216" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Connectors y MCP: las &#171;manos&#187; del agente</title>
  <desc>El agente pide datos, el Connector los trae v&#237;a el protocolo MCP, y el servicio externo responde.</desc>
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6666"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DA1B2E"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="680" height="216" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#3B3535">

    <!-- ===== box A: Cowork (agente) ===== -->
    <rect x="16" y="40" width="120" height="104" rx="8" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="76" y="86" text-anchor="middle" font-size="16" font-weight="bold">Cowork</text>
    <text x="76" y="108" text-anchor="middle" font-size="12" fill="#6E6666">el agente</text>

    <!-- ===== gap 1: Cowork &#8596; Connector ===== -->
    <text x="191" y="59" text-anchor="middle" font-size="11.5">pide datos</text>
    <line x1="142" y1="74" x2="240" y2="74" stroke="#6E6666" stroke-width="1.8" marker-end="url(#arrow-grey)"/>
    <line x1="240" y1="110" x2="142" y2="110" stroke="#6E6666" stroke-width="1.8" marker-end="url(#arrow-grey)"/>
    <text x="191" y="133" text-anchor="middle" font-size="11.5">devuelve datos</text>

    <!-- ===== box B: Connector (focal) ===== -->
    <rect x="246" y="40" width="142" height="104" rx="8" fill="#ffffff" stroke="#DA1B2E" stroke-width="2.5"/>
    <text x="317" y="82" text-anchor="middle" font-size="16" font-weight="bold">Connector</text>
    <rect x="287" y="92" width="60" height="22" rx="11" fill="#DA1B2E"/>
    <text x="317" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">1 clic</text>

    <!-- ===== gap 2: Connector &#8596; Servicio externo (protocolo MCP) ===== -->
    <rect x="401" y="44" width="104" height="22" rx="11" fill="#DA1B2E"/>
    <text x="453" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">protocolo MCP</text>
    <line x1="394" y1="74" x2="512" y2="74" stroke="#DA1B2E" stroke-width="2.2" marker-end="url(#arrow-red)"/>
    <line x1="512" y1="110" x2="394" y2="110" stroke="#6E6666" stroke-width="1.8" marker-end="url(#arrow-grey)"/>

    <!-- ===== box C: servicio externo ===== -->
    <rect x="518" y="40" width="146" height="104" rx="8" fill="#F4F2F2" stroke="#B8B2B2" stroke-width="1.5"/>
    <text x="591" y="86" text-anchor="middle" font-size="16" font-weight="bold">Servicio externo</text>
    <text x="591" y="108" text-anchor="middle" font-size="11" fill="#6E6666">Gmail &#183; MT Newswires</text>

    <!-- ===== takeaway ===== -->
    <text x="340" y="186" text-anchor="middle" font-size="12.5" font-style="italic">El agente no gana una capacidad nueva: la plataforma se vuelve conversacional.</text>

  </g>
</svg>
