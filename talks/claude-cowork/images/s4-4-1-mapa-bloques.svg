<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 582" font-family="Helvetica, Arial, sans-serif" fill="#3B3535">
  <title>El mapa de la charla: bloques que se apilan</title>
  <desc>El mapa de toda la sesión: arranca en el chat que la audiencia ya usa y sube bloque a bloque hasta Live Artifacts, con Plugins como capa transversal que distribuye la pila.</desc>

  <rect x="0" y="0" width="760" height="582" fill="#ffffff"/>

  <!-- banda PLUGINS (capa transversal envolvente) -->
  <rect x="20" y="20" width="720" height="516" rx="12" fill="#EDEAE6" stroke="#3B3535" stroke-width="1.6"/>
  <text x="380" y="46" text-anchor="middle" font-size="15" font-weight="bold">PLUGINS · capa transversal: empaqueta y distribuye la pila</text>

  <!-- panel interior blanco con la pila -->
  <rect x="42" y="60" width="676" height="458" rx="8" fill="#ffffff" stroke="#C9C4BE" stroke-width="1"/>

  <!-- fila 1: LIVE ARTIFACTS -->
  <rect x="58" y="78" width="236" height="46" rx="6" fill="#F5F3F0" stroke="#3B3535" stroke-width="1.2"/>
  <text x="176" y="106" text-anchor="middle" font-size="13" font-weight="bold">LIVE ARTIFACTS</text>
  <text x="310" y="106" font-size="12.5" font-style="italic">“quiero compartir el resultado vivo”</text>

  <!-- fila 2: SKILLS / SUBAGENTES -->
  <rect x="58" y="132" width="236" height="46" rx="6" fill="#F5F3F0" stroke="#3B3535" stroke-width="1.2"/>
  <text x="176" y="160" text-anchor="middle" font-size="13" font-weight="bold">SKILLS / SUBAGENTES</text>
  <text x="310" y="153" font-size="12.5" font-style="italic">“no quiero repetir la tarea · delegar en paralelo”</text>
  <text x="310" y="170" font-size="11" fill="#8A847E">(secciones 5 y 6)</text>

  <!-- fila 3: ARCHIVOS .MD -->
  <rect x="58" y="186" width="236" height="46" rx="6" fill="#F5F3F0" stroke="#3B3535" stroke-width="1.2"/>
  <text x="176" y="214" text-anchor="middle" font-size="13" font-weight="bold">ARCHIVOS .MD</text>
  <text x="310" y="214" font-size="12.5" font-style="italic">“quiero que la IA entienda mi material”</text>

  <!-- fila 4: INSTRUCCIONES + PROJECTS -->
  <rect x="58" y="240" width="236" height="46" rx="6" fill="#F5F3F0" stroke="#3B3535" stroke-width="1.2"/>
  <text x="176" y="268" text-anchor="middle" font-size="12.5" font-weight="bold">INSTRUCCIONES + PROJECTS</text>
  <text x="310" y="268" font-size="12.5" font-style="italic">“contexto y trabajo agrupados de un tema”</text>

  <!-- fila 5: COWORK (estamos aca) -->
  <rect x="58" y="294" width="236" height="46" rx="6" fill="#F9E1E3" stroke="#DA1B2E" stroke-width="2"/>
  <text x="176" y="313" text-anchor="middle" font-size="13" font-weight="bold">COWORK</text>
  <text x="176" y="330" text-anchor="middle" font-size="11.5">carpetas y archivos</text>
  <text x="310" y="322" font-size="12.5" font-style="italic">“quiero que trabaje sobre mis archivos”</text>
  <path d="M 600 317 L 616 309 L 616 313.5 L 638 313.5 L 638 320.5 L 616 320.5 L 616 325 Z" fill="#DA1B2E"/>
  <text x="646" y="322" font-size="11" font-weight="bold" fill="#DA1B2E">ESTAMOS ACÁ</text>

  <!-- fila 6: TAREAS PROGRAMADAS -->
  <rect x="58" y="348" width="236" height="46" rx="6" fill="#F5F3F0" stroke="#3B3535" stroke-width="1.2"/>
  <text x="176" y="376" text-anchor="middle" font-size="13" font-weight="bold">TAREAS PROGRAMADAS</text>
  <text x="310" y="376" font-size="12.5" font-style="italic">“quiero que corra solo”</text>
  <path d="M 652 371 l 5 6 l 10 -12" fill="none" stroke="#6F6A66" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="674" y="376" font-size="11" fill="#8A847E">visto</text>

  <!-- fila 7: CONECTORES -->
  <rect x="58" y="402" width="236" height="46" rx="6" fill="#F5F3F0" stroke="#3B3535" stroke-width="1.2"/>
  <text x="176" y="430" text-anchor="middle" font-size="13" font-weight="bold">CONECTORES</text>
  <text x="310" y="430" font-size="12.5" font-style="italic">“quiero info real, y que actúe”</text>
  <path d="M 652 425 l 5 6 l 10 -12" fill="none" stroke="#6F6A66" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="674" y="430" font-size="11" fill="#8A847E">visto</text>

  <!-- fila 8: EL CHAT -->
  <rect x="58" y="456" width="236" height="46" rx="6" fill="#F5F3F0" stroke="#3B3535" stroke-width="1.2"/>
  <text x="176" y="484" text-anchor="middle" font-size="13" font-weight="bold">EL CHAT</text>
  <text x="310" y="484" font-size="12.5" font-style="italic">“respondía solo de memoria”</text>
  <path d="M 652 479 l 5 6 l 10 -12" fill="none" stroke="#6F6A66" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="674" y="484" font-size="11" fill="#8A847E">visto</text>

  <!-- leyenda inferior -->
  <text x="380" y="560" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6F6A66">los bloques se apilan: cada tarea combina solo los que necesita</text>
</svg>
